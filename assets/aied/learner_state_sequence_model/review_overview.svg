<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788"><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia;fill:#173A63}.s{font:600 14px Arial;fill:#60717D;letter-spacing:3px}.h{font:700 17px Arial;fill:#173A63}.b{font:14px Arial;fill:#263846}.sm{font:12px Arial;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#6E5D9A}.soft{fill:#F2EEFA;stroke:#6E5D9A;stroke-width:1.2}.w{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.m{font:700 20px Georgia;fill:#6E5D9A}</style><text x="700" y="48" text-anchor="middle" class="t">Learner State Sequence Model</text><text x="700" y="80" text-anchor="middle" class="s">AI IN EDUCATION RESEARCH PROTOTYPE · FULL STORY</text><rect x="28" y="116" width="426" height="222" rx="11" class="c"/><circle cx="62" cy="150" r="18" class="a"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">PURPOSE</text><text x="55" y="198" class="b"><tspan x="55">What first-order transition structure is</tspan><tspan x="55" dy="21">present in a supplied learner-state sequence</tspan><tspan x="55" dy="21">without treating labels as mental truth?</tspan></text><rect x="487" y="116" width="426" height="222" rx="11" class="c"/><circle cx="521" cy="150" r="18" class="a"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">INPUTS / EVIDENCE</text><text x="514" y="198" class="b"><tspan x="514">Supplied state sequences</tspan><tspan x="514" dy="21">Ordered observations</tspan><tspan x="514" dy="21">Explicit state vocabulary</tspan><tspan x="514" dy="21">No hidden-state inference</tspan></text><rect x="946" y="116" width="426" height="222" rx="11" class="c"/><circle cx="980" cy="150" r="18" class="a"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">CORE LOGIC</text><text x="973" y="198" class="b"><tspan x="973">Count adjacent transitions</tspan><tspan x="973" dy="21">Normalize outgoing probabilities</tspan><tspan x="973" dy="21">Calculate entropy where supported</tspan><tspan x="973" dy="21">Measure adjacent-state persistence</tspan></text><rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">WHAT THE PROTOTYPE PRODUCES</text><text x="55" y="453" class="b"><tspan x="55">Transition matrix</tspan><tspan x="55" dy="23">Outgoing-state entropy</tspan><tspan x="55" dy="23">Persistence proportion</tspan><tspan x="55" dy="23">Undefined values when evidence is absent</tspan></text><text x="55" y="583" class="m">P(j|i) = count(i→j) / Σj count(i→j)</text><text x="55" y="610" class="sm">Descriptive first-order transition probability</text><rect x="946" y="372" width="426" height="268" rx="11" class="w"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="b"><tspan x="973">The model summarizes supplied labels.</tspan><tspan x="973" dy="23">It does not infer mental states.</tspan><tspan x="973" dy="23">State validity needs separate justification.</tspan><tspan x="973" dy="23">Short sequences may be insufficient.</tspan></text><text x="28" y="728" class="sm">Best use: establish a descriptive sequence baseline before fitting more complex learner-state models.</text></svg>