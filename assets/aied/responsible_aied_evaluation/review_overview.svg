<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
<title id="title">Responsible AIED Evaluation, UCI 697 Study</title><desc id="desc">Study overview</desc>
<rect width="1400" height="788" fill="#F7F9FB"/>
<style>
.title{font-family:Georgia,serif;font-weight:700;fill:#173A63;font-size:38px}
.subtitle{font-family:Arial,sans-serif;fill:#173A63;font-size:15px;letter-spacing:4px}
.h{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:18px}
.h2{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:15px}
.txt{font-family:Arial,sans-serif;fill:#172533;font-size:14px}
.sm{font-family:Arial,sans-serif;fill:#5C6B78;font-size:12px}
.metric{font-family:Georgia,serif;font-weight:700;fill:#173A63;font-size:24px}
.card{fill:#FFFFFF;stroke:#C8D5E1;stroke-width:1.2}
.soft{fill:#EAF2F8;stroke:#D9E6F0;stroke-width:1}
</style>
<text x="700" y="50" text-anchor="middle" class="title">Responsible AIED Evaluation, UCI 697 Study</text>
<line x1="240" y1="78" x2="545" y2="78" stroke="#9DB5CB"/><line x1="855" y1="78" x2="1160" y2="78" stroke="#9DB5CB"/>
<text x="700" y="84" text-anchor="middle" class="subtitle">STUDY OVERVIEW</text>
<rect x="18" y="110" width="455" height="260" rx="10" class="card"/><circle cx="48" cy="140" r="19" fill="#173A63"/><text x="48" y="146" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">1</text><text x="82" y="146" class="h">AUDIT QUESTION</text>
<text x="45" y="190" class="h"><tspan x="45">How should an enrollment-time dropout</tspan><tspan x="45" dy="23">probability model be evaluated before any</tspan><tspan x="45" dy="23">practical use is considered?</tspan></text>
<text x="45" y="300" class="sm"><tspan x="45">The study measures prediction and audit</tspan><tspan x="45" dy="18">properties. It does not issue a fairness or</tspan><tspan x="45" dy="18">deployment verdict.</tspan></text>
<rect x="490" y="110" width="890" height="260" rx="10" class="card"/><circle cx="520" cy="140" r="19" fill="#173A63"/><text x="520" y="146" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">2</text><text x="554" y="146" class="h">DATA AND PREDICTION BOUNDARY</text>
<rect x="530" y="205" width="150" height="92" rx="8" class="soft"/><text x="605" y="239" class="metric" text-anchor="middle">4,424</text><text x="605" y="263" class="h2" text-anchor="middle">historical records</text>
<rect x="690" y="205" width="150" height="92" rx="8" class="soft"/><text x="765" y="239" class="metric" text-anchor="middle">20</text><text x="765" y="263" class="h2" text-anchor="middle">retained predictors</text>
<rect x="850" y="205" width="150" height="92" rx="8" class="soft"/><text x="925" y="239" class="metric" text-anchor="middle">3,539</text><text x="925" y="263" class="h2" text-anchor="middle">train records</text>
<rect x="1010" y="205" width="150" height="92" rx="8" class="soft"/><text x="1085" y="239" class="metric" text-anchor="middle">885</text><text x="1085" y="263" class="h2" text-anchor="middle">test records</text>
<text x="530" y="325" class="txt"><tspan x="530">Semester-performance variables are excluded from the enrollment-time model. Gender,</tspan><tspan x="530" dy="18">nationality, international status and special-needs fields are retained for audit only and</tspan><tspan x="530" dy="18">are not model inputs.</tspan></text>
<rect x="18" y="395" width="850" height="350" rx="10" class="card"/><circle cx="48" cy="425" r="19" fill="#173A63"/><text x="48" y="431" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">3</text><text x="82" y="431" class="h">PRIMARY HOLDOUT PERFORMANCE</text>
<rect x="75" y="500" width="210" height="92" rx="8" class="soft"/><text x="180" y="534" class="metric" text-anchor="middle">0.8316</text><text x="180" y="558" class="h2" text-anchor="middle">ROC-AUC</text>
<rect x="300" y="500" width="210" height="92" rx="8" class="soft"/><text x="405" y="534" class="metric" text-anchor="middle">0.1447</text><text x="405" y="558" class="h2" text-anchor="middle">Brier score</text>
<rect x="525" y="500" width="210" height="92" rx="8" class="soft"/><text x="630" y="534" class="metric" text-anchor="middle">0.0413</text><text x="630" y="558" class="h2" text-anchor="middle">ECE-10</text>
<text x="75" y="625" class="txt"><tspan x="75">Repeated stratified splits and bootstrap checks describe uncertainty around</tspan><tspan x="75" dy="20">this historical modeling protocol.</tspan></text>
<rect x="890" y="395" width="490" height="350" rx="10" class="card"/><circle cx="920" cy="425" r="19" fill="#173A63"/><text x="920" y="431" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">4</text><text x="954" y="431" class="h">AUDIT BOUNDARY</text>
<circle cx="925" cy="490" r="10" fill="#2F8F72"/><path d="M 920 490 l4 5 l8 -10" stroke="white" stroke-width="2.5" fill="none"/><text x="950" y="495" class="h2">Gender audit: evaluable</text>
<circle cx="925" cy="545" r="10" fill="#B94B55"/><path d="M 921 541 l8 8 M 929 541 l-8 8" stroke="white" stroke-width="2.5"/><text x="950" y="550" class="h2">International status: not evaluable</text>
<circle cx="925" cy="600" r="10" fill="#B94B55"/><path d="M 921 596 l8 8 M 929 596 l-8 8" stroke="white" stroke-width="2.5"/><text x="950" y="605" class="h2">Intersectional audit: not evaluable</text>
<circle cx="925" cy="655" r="10" fill="#B94B55"/><path d="M 921 651 l8 8 M 929 651 l-8 8" stroke="white" stroke-width="2.5"/><text x="950" y="660" class="h2">Special-needs audit: not evaluable</text>
<text x="920" y="700" class="sm"><tspan x="920">Historical data and incomplete governance</tspan><tspan x="920" dy="18">evidence prevent deployment approval or</tspan><tspan x="920" dy="18">fairness certification.</tspan></text>
</svg>