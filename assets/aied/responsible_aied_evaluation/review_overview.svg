<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc"><title id="title">Enrollment-Time Dropout Risk Model Audit on UCI 697 — full study story</title><desc id="desc">Research question, dataset, study design, main result and interpretation boundary.</desc><rect width="1400" height="788" fill="#F8FAFC"/><style>.title{font:700 38px Georgia,serif;fill:#173A63}.sub{font:600 14px Arial,sans-serif;fill:#5B6B7A;letter-spacing:3px}.h{font:700 18px Arial,sans-serif;fill:#173A63}.body{font:14px Arial,sans-serif;fill:#21313E}.small{font:12px Arial,sans-serif;fill:#5D6A75}.metric{font:700 27px Georgia,serif;fill:#2F7D55}.metricLabel{font:600 12px Arial,sans-serif;fill:#40505E}.card{fill:#FFF;stroke:#CBD6E0;stroke-width:1.4}.soft{fill:#E8F5EE;stroke:#2F7D55;stroke-width:1}.flow{stroke:#8FA4B8;stroke-width:2;fill:none}.accent{fill:#2F7D55}.warn{fill:#FFF7ED;stroke:#E7B06B;stroke-width:1.2}</style><text x="700" y="50" text-anchor="middle" class="title">Enrollment-Time Dropout Risk Model Audit on UCI 697</text><text x="700" y="82" text-anchor="middle" class="sub">EMPIRICAL STUDY · FULL STORY</text><rect x="28" y="118" width="425" height="230" rx="12" class="card"/><circle cx="62" cy="151" r="18" class="accent"/><text x="62" y="157" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="157" class="h">RESEARCH QUESTION</text><text x="55" y="198" class="body"><tspan x="55">What can an enrollment-time dropout model</tspan><tspan x="55" dy="23">actually support once prediction quality,</tspan><tspan x="55" dy="23">calibration, subgroup evidence and practical</tspan><tspan x="55" dy="23">allocation behavior are audited together?</tspan></text><rect x="478" y="118" width="425" height="230" rx="12" class="card"/><circle cx="512" cy="151" r="18" class="accent"/><text x="512" y="157" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="544" y="157" class="h">DATA + DESIGN</text><text x="505" y="198" class="body"><tspan x="505">UCI 697 · 4,424 historical student records</tspan><tspan x="505" dy="22">Remove semester-performance leakage variables</tspan><tspan x="505" dy="22">20 retained enrollment-time predictors</tspan><tspan x="505" dy="22">Protected fields kept for audit only</tspan></text><rect x="928" y="118" width="444" height="230" rx="12" class="card"/><circle cx="962" cy="151" r="18" class="accent"/><text x="962" y="157" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="994" y="157" class="h">ANALYTICAL LOGIC</text><text x="955" y="198" class="body"><tspan x="955">Train a probability model on allowed inputs</tspan><tspan x="955" dy="22">Evaluate held-out discrimination + calibration</tspan><tspan x="955" dy="22">Audit subgroup errors only where support exists</tspan><tspan x="955" dy="22">Stress-test thresholds and split sensitivity</tspan></text><path d="M453 233 H478 M903 233 H928" class="flow"/><rect x="28" y="377" width="874" height="272" rx="12" class="soft"/><text x="55" y="415" class="h">WHAT THE STUDY FOUND</text><text x="65" y="476" class="metric">0.8316</text><text x="65" y="500" class="metricLabel">holdout ROC-AUC</text><text x="270" y="476" class="metric">0.1447</text><text x="270" y="500" class="metricLabel">holdout Brier score</text><text x="475" y="476" class="metric">885</text><text x="475" y="500" class="metricLabel">primary holdout records</text><text x="680" y="476" class="metric">20</text><text x="680" y="500" class="metricLabel">retained predictors</text><text x="55" y="548" class="body"><tspan x="55">The model shows useful predictive signal on the primary holdout, but audit conclusions differ</tspan><tspan x="55" dy="22">by subgroup support. Where the data are too sparse, the result is explicitly marked not</tspan><tspan x="55" dy="22">evaluable rather than being turned into a misleading zero-disparity claim.</tspan></text><rect x="928" y="377" width="444" height="272" rx="12" class="warn"/><text x="955" y="415" class="h">INTERPRETATION BOUNDARY</text><text x="955" y="458" class="body"><tspan x="955">This is an audit of one historical Portuguese</tspan><tspan x="955" dy="23">higher-education dataset. It is not a fairness</tspan><tspan x="955" dy="23">certificate, deployment approval or proof that</tspan><tspan x="955" dy="23">a threshold-based intervention would help</tspan><tspan x="955" dy="23">students in another setting.</tspan></text><text x="55" y="704" class="small">Scientific source: UCI Machine Learning Repository dataset 697, Predict Students' Dropout and Academic Success.</text><line x1="28" y1="728" x2="1372" y2="728" stroke="#D7E0E8"/><text x="28" y="754" class="small">Designed for rapid professor review: question → evidence → analysis → result → limit.</text></svg>