<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
<title id="title">Early Assessment Submission and Later Outcomes in OULAD — full study story</title>
<desc id="desc">Research question, dataset, study design, main result and interpretation boundary.</desc>
<rect width="1400" height="788" fill="#F8FAFC"/>
<style>
.title{font:700 38px Georgia,serif;fill:#173A63}.sub{font:600 14px Arial,sans-serif;fill:#5B6B7A;letter-spacing:3px}.h{font:700 18px Arial,sans-serif;fill:#173A63}.body{font:14px Arial,sans-serif;fill:#21313E}.small{font:12px Arial,sans-serif;fill:#5D6A75}.metric{font:700 27px Georgia,serif;fill:#C96B2C}.metricLabel{font:600 12px Arial,sans-serif;fill:#40505E}.card{fill:#FFF;stroke:#CBD6E0;stroke-width:1.4}.soft{fill:#FFF1E6;stroke:#C96B2C;stroke-width:1}.flow{stroke:#8FA4B8;stroke-width:2;fill:none}.accent{fill:#C96B2C}.warn{fill:#FFF7ED;stroke:#E7B06B;stroke-width:1.2}
</style>
<text x="700" y="50" text-anchor="middle" class="title">Early Assessment Submission and Later Outcomes in OULAD</text>
<text x="700" y="82" text-anchor="middle" class="sub">EMPIRICAL STUDY · FULL STORY</text>
<rect x="28" y="118" width="425" height="230" rx="12" class="card"/>
<circle cx="62" cy="151" r="18" class="accent"/><text x="62" y="157" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text>
<text x="94" y="157" class="h">RESEARCH QUESTION</text>
<text x="55" y="198" class="body"><tspan x="55">Among learners still eligible at day 30,</tspan><tspan x="55" dy="23">what adjusted difference in later favorable</tspan><tspan x="55" dy="23">outcome is associated with an early</tspan><tspan x="55" dy="23">non-banked assessment submission?</tspan></text>
<rect x="478" y="118" width="425" height="230" rx="12" class="card"/>
<circle cx="512" cy="151" r="18" class="accent"/><text x="512" y="157" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text>
<text x="544" y="157" class="h">DATA + DESIGN</text>
<text x="505" y="198" class="body"><tspan x="505">OULAD · CCC 2014J module presentation</tspan><tspan x="505" dy="22">1,983 eligible at day 30</tspan><tspan x="505" dy="22">1,820 complete supported analysis cases</tspan><tspan x="505" dy="22">1,624 exposed · 196 comparison cases</tspan></text>
<rect x="928" y="118" width="444" height="230" rx="12" class="card"/>
<circle cx="962" cy="151" r="18" class="accent"/><text x="962" y="157" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text>
<text x="994" y="157" class="h">ANALYTICAL LOGIC</text>
<text x="955" y="198" class="body"><tspan x="955">Freeze eligibility at the day-30 landmark</tspan><tspan x="955" dy="22">Use only pre-exposure covariates</tspan><tspan x="955" dy="22">Estimate inverse-probability weights</tspan><tspan x="955" dy="22">Check overlap, balance and sensitivity</tspan></text>
<path d="M453 233 H478 M903 233 H928" class="flow"/>
<rect x="28" y="377" width="874" height="272" rx="12" class="soft"/>
<text x="55" y="415" class="h">WHAT THE STUDY FOUND</text>
<text x="65" y="476" class="metric">0.3861</text><text x="65" y="500" class="metricLabel">Hájek contrast</text><text x="270" y="476" class="metric">0.3242–0.4447</text><text x="270" y="500" class="metricLabel">refit bootstrap interval</text><text x="475" y="476" class="metric">0.3261</text><text x="475" y="500" class="metricLabel">overlap-weighted estimate</text><text x="680" y="476" class="metric">≈509.5</text><text x="680" y="500" class="metricLabel">effective sample size</text>
<text x="55" y="548" class="body"><tspan x="55">The adjusted contrast is positive across the primary and overlap-weighted analyses,</tspan><tspan x="55" dy="22">but the weighting diagnostics also show limited overlap, extreme weights and residual</tspan><tspan x="55" dy="22">imbalance. Those diagnostics are part of the result, not hidden in an appendix.</tspan></text>
<rect x="928" y="377" width="444" height="272" rx="12" class="warn"/>
<text x="955" y="415" class="h">INTERPRETATION BOUNDARY</text>
<text x="955" y="458" class="body"><tspan x="955">This is an observational association,</tspan><tspan x="955" dy="23">not a causal estimate of a policy intervention.</tspan><tspan x="955" dy="23">Unmeasured confounding and selection may remain;</tspan><tspan x="955" dy="23">the study does not show that forcing early</tspan><tspan x="955" dy="23">submission would improve outcomes.</tspan></text>
<text x="55" y="704" class="small">Scientific source: Open University Learning Analytics Dataset (OULAD), using a frozen day-30 landmark cohort.</text>
<line x1="28" y1="728" x2="1372" y2="728" stroke="#D7E0E8"/>
<text x="28" y="754" class="small">Designed for rapid professor review: question → evidence → analysis → result → limit.</text>
</svg>