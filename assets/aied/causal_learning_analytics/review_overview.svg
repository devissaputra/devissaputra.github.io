<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
<title id="title">Causal Learning Analytics, OULAD Day 30 Landmark Study</title><desc id="desc">Study overview</desc>
<rect width="1400" height="788" fill="#F7F9FB"/>
<style>.title{font-family:Georgia,serif;font-weight:700;fill:#173A63;font-size:38px}.subtitle{font-family:Arial,sans-serif;fill:#173A63;font-size:15px;letter-spacing:4px}.h{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:18px}.h2{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:15px}.txt{font-family:Arial,sans-serif;fill:#172533;font-size:14px}.sm{font-family:Arial,sans-serif;fill:#5C6B78;font-size:12px}.metric{font-family:Georgia,serif;font-weight:700;fill:#173A63;font-size:24px}.card{fill:#FFFFFF;stroke:#C8D5E1;stroke-width:1.2}.soft{fill:#EAF2F8;stroke:#D9E6F0;stroke-width:1}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#173A63"/></marker></defs>
<text x="700" y="50" text-anchor="middle" class="title">Causal Learning Analytics, OULAD Day 30 Landmark Study</text><line x1="240" y1="78" x2="545" y2="78" stroke="#9DB5CB"/><line x1="855" y1="78" x2="1160" y2="78" stroke="#9DB5CB"/><text x="700" y="84" text-anchor="middle" class="subtitle">STUDY OVERVIEW</text>
<rect x="18" y="110" width="455" height="260" rx="10" class="card"/><circle cx="48" cy="140" r="19" fill="#173A63"/><text x="48" y="146" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">1</text><text x="82" y="146" class="h">OBSERVATIONAL QUESTION</text>
<text x="45" y="190" class="h"><tspan x="45">Among learners still eligible at day 30, what</tspan><tspan x="45" dy="23">adjusted difference in favorable final</tspan><tspan x="45" dy="23">outcome is associated with submitting at</tspan><tspan x="45" dy="23">least one non-banked assessment by that</tspan><tspan x="45" dy="23">point?</tspan></text><text x="45" y="330" class="sm" style="fill:#B94B55;font-weight:700">Association study, not a causal effect estimate.</text>
<rect x="490" y="110" width="890" height="260" rx="10" class="card"/><circle cx="520" cy="140" r="19" fill="#173A63"/><text x="520" y="146" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">2</text><text x="554" y="146" class="h">FROZEN LANDMARK DESIGN</text>
<line x1="540" y1="220" x2="1260" y2="220" stroke="#173A63" stroke-width="2" marker-end="url(#arrow)"/><circle cx="604" cy="220" r="9" fill="#6EA4D7" stroke="white" stroke-width="2"/><text x="604" y="200" class="sm" text-anchor="middle">registration</text><circle cx="815" cy="220" r="9" fill="#2F6EAA" stroke="white" stroke-width="2"/><text x="815" y="188" class="sm" text-anchor="middle"><tspan x="815">day 30</tspan><tspan x="815" dy="12">landmark</tspan></text><circle cx="1027" cy="220" r="9" fill="#173A63" stroke="white" stroke-width="2"/><text x="1027" y="188" class="sm" text-anchor="middle"><tspan x="1027">later</tspan><tspan x="1027" dy="12">outcome</tspan></text>
<text x="540" y="275" class="txt"><tspan x="540">OULAD CCC 2014J. Eligibility is defined before exposure; exposure is at least one</tspan><tspan x="540" dy="19">qualifying assessment submission by day 30; the outcome is Pass or Distinction versus</tspan><tspan x="540" dy="19">Fail or withdrawal after the landmark.</tspan></text>
<rect x="545" y="315" width="185" height="92" rx="8" class="soft"/><text x="638" y="349" class="metric" text-anchor="middle">1,983</text><text x="638" y="373" class="h2" text-anchor="middle">eligible before complete case</text><rect x="740" y="315" width="165" height="92" rx="8" class="soft"/><text x="823" y="349" class="metric" text-anchor="middle">1,820</text><text x="823" y="373" class="h2" text-anchor="middle">analysis cases</text><rect x="915" y="315" width="165" height="92" rx="8" class="soft"/><text x="998" y="349" class="metric" text-anchor="middle">1,624</text><text x="998" y="373" class="h2" text-anchor="middle">exposed</text><rect x="1090" y="315" width="165" height="92" rx="8" class="soft"/><text x="1173" y="349" class="metric" text-anchor="middle">196</text><text x="1173" y="373" class="h2" text-anchor="middle">control</text>
<rect x="18" y="395" width="850" height="350" rx="10" class="card"/><circle cx="48" cy="425" r="19" fill="#173A63"/><text x="48" y="431" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">3</text><text x="82" y="431" class="h">ADJUSTED CONTRAST</text>
<rect x="55" y="485" width="220" height="92" rx="8" class="soft"/><text x="165" y="519" class="metric" text-anchor="middle">0.3861</text><text x="165" y="543" class="h2" text-anchor="middle">Hájek weighted contrast</text><rect x="290" y="485" width="250" height="92" rx="8" class="soft"/><text x="415" y="519" class="metric" text-anchor="middle">0.3242–0.4447</text><text x="415" y="543" class="h2" text-anchor="middle">95% bootstrap interval</text><rect x="555" y="485" width="220" height="92" rx="8" class="soft"/><text x="665" y="519" class="metric" text-anchor="middle">0.3261</text><text x="665" y="543" class="h2" text-anchor="middle">overlap sensitivity</text>
<text x="55" y="615" class="txt"><tspan x="55">Inverse-probability weighting adjusts observed covariates. The full-refit bootstrap</tspan><tspan x="55" dy="20">reflects uncertainty in the fitted weighting model. Overlap weighting changes the</tspan><tspan x="55" dy="20">target population and is reported as a sensitivity analysis.</tspan></text>
<rect x="890" y="395" width="490" height="350" rx="10" class="card"/><circle cx="920" cy="425" r="19" fill="#173A63"/><text x="920" y="431" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">4</text><text x="954" y="431" class="h">CAUTIONS</text>
<circle cx="925" cy="490" r="10" fill="#B94B55"/><path d="M 921 486 l8 8 M 929 486 l-8 8" stroke="white" stroke-width="2.5"/><text x="950" y="495" class="h2">Extreme weights</text><circle cx="925" cy="545" r="10" fill="#B94B55"/><path d="M 921 541 l8 8 M 929 541 l-8 8" stroke="white" stroke-width="2.5"/><text x="950" y="550" class="h2">Effective sample size ≈ 509.5</text><circle cx="925" cy="600" r="10" fill="#B94B55"/><path d="M 921 596 l8 8 M 929 596 l-8 8" stroke="white" stroke-width="2.5"/><text x="950" y="605" class="h2">Residual imbalance</text><circle cx="925" cy="655" r="10" fill="#B94B55"/><path d="M 921 651 l8 8 M 929 651 l-8 8" stroke="white" stroke-width="2.5"/><text x="950" y="660" class="h2">Unmeasured confounding and selection</text>
</svg>