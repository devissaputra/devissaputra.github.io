<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
<title id="title">Early Assessment Submission and Later Outcomes in OULAD — data processing pipeline</title>
<desc id="desc">Step-by-step data preparation, modelling and evaluation workflow.</desc>
<rect width="1400" height="788" fill="#F8FAFC"/>
<style>
.title{font:700 38px Georgia,serif;fill:#173A63}.sub{font:600 14px Arial,sans-serif;fill:#5B6B7A;letter-spacing:3px}.step{fill:#FFF;stroke:#CBD6E0;stroke-width:1.4}.num{fill:#C96B2C}.h{font:700 15px Arial,sans-serif;fill:#173A63}.body{font:13px Arial,sans-serif;fill:#263846}.small{font:12px Arial,sans-serif;fill:#61717E}.note{fill:#FFF1E6;stroke:#C96B2C;stroke-width:1.2}.arrow{stroke:#C96B2C;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C96B2C"/></marker></defs>
<text x="700" y="50" text-anchor="middle" class="title">Early Assessment Submission and Later Outcomes in OULAD</text>
<text x="700" y="82" text-anchor="middle" class="sub">DATA PROCESSING + ANALYSIS WORKFLOW</text>

<rect x="28" y="142" width="200" height="388" rx="11" class="step"/>
<circle cx="58" cy="174" r="18" class="num"/><text x="58" y="180" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text>
<text x="48" y="217" class="h"><tspan x="48">1. DEFINE COHORT</tspan></text>
<text x="48" y="286" class="body"><tspan x="48">Load OULAD tables</tspan><tspan x="48" dy="21">Select CCC 2014J</tspan><tspan x="48" dy="21">Apply day-30 eligibility</tspan><tspan x="48" dy="21">Freeze analysis population</tspan></text>
<path d="M228 335 H246" class="arrow"/>
<rect x="252" y="142" width="200" height="388" rx="11" class="step"/>
<circle cx="282" cy="174" r="18" class="num"/><text x="282" y="180" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text>
<text x="272" y="217" class="h"><tspan x="272">2. DEFINE EXPOSURE</tspan></text>
<text x="272" y="286" class="body"><tspan x="272">Find non-banked assessments</tspan><tspan x="272" dy="21">Classify submission by day 30</tspan><tspan x="272" dy="21">Keep timing explicit</tspan><tspan x="272" dy="21">No post-landmark leakage</tspan></text>
<path d="M452 335 H470" class="arrow"/>
<rect x="476" y="142" width="200" height="388" rx="11" class="step"/>
<circle cx="506" cy="174" r="18" class="num"/><text x="506" y="180" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text>
<text x="496" y="217" class="h"><tspan x="496">3. BUILD COVARIATES</tspan></text>
<text x="496" y="286" class="body"><tspan x="496">Use pre-exposure information</tspan><tspan x="496" dy="21">Encode supported complete cases</tspan><tspan x="496" dy="21">Track missingness rules</tspan><tspan x="496" dy="21">Separate later outcome</tspan></text>
<path d="M676 335 H694" class="arrow"/>
<rect x="700" y="142" width="200" height="388" rx="11" class="step"/>
<circle cx="730" cy="174" r="18" class="num"/><text x="730" y="180" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">4</text>
<text x="720" y="217" class="h"><tspan x="720">4. WEIGHT</tspan></text>
<text x="720" y="286" class="body"><tspan x="720">Fit propensity model</tspan><tspan x="720" dy="21">Compute inverse weights</tspan><tspan x="720" dy="21">Normalize with Hájek form</tspan><tspan x="720" dy="21">Inspect extreme weights</tspan></text>
<path d="M900 335 H918" class="arrow"/>
<rect x="924" y="142" width="200" height="388" rx="11" class="step"/>
<circle cx="954" cy="174" r="18" class="num"/><text x="954" y="180" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">5</text>
<text x="944" y="217" class="h"><tspan x="944">5. DIAGNOSE</tspan></text>
<text x="944" y="286" class="body"><tspan x="944">Balance before/after</tspan><tspan x="944" dy="21">Overlap and ESS</tspan><tspan x="944" dy="21">Full-refit bootstrap</tspan><tspan x="944" dy="21">Overlap-weight sensitivity</tspan></text>
<path d="M1124 335 H1142" class="arrow"/>
<rect x="1148" y="142" width="200" height="388" rx="11" class="step"/>
<circle cx="1178" cy="174" r="18" class="num"/><text x="1178" y="180" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">6</text>
<text x="1168" y="217" class="h"><tspan x="1168">6. INTERPRET</tspan></text>
<text x="1168" y="286" class="body"><tspan x="1168">Adjusted favorable-outcome contrast</tspan><tspan x="1168" dy="21">Report uncertainty</tspan><tspan x="1168" dy="21">Surface residual imbalance</tspan><tspan x="1168" dy="21">State non-causal boundary</tspan></text>

<rect x="28" y="568" width="1344" height="112" rx="10" class="note"/>
<text x="50" y="603" class="h">Landmark logic</text>
<text x="50" y="632" class="body"><tspan x="50">Eligibility, exposure and later outcome are separated in time so early withdrawal is not quietly mixed with exposure assignment.</tspan></text>
<text x="28" y="732" class="small">Workflow purpose: make an observational learning-analytics comparison explicit about timing, overlap and causal limits.</text>
</svg>