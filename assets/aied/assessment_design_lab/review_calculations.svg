<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788"><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia;fill:#173A63}.s{font:600 14px Arial;fill:#60717D;letter-spacing:3px}.h{font:700 15px Arial;fill:#173A63}.b{font:13px Arial;fill:#263846}.sm{font:12px Arial;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#A05F3B}.n{fill:#FAEEE7;stroke:#A05F3B;stroke-width:1.2}.ar{stroke:#A05F3B;stroke-width:2.3;fill:none;marker-end:url(#x)}</style><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A05F3B"/></marker></defs><text x="700" y="48" text-anchor="middle" class="t">Assessment Design Lab</text><text x="700" y="80" text-anchor="middle" class="s">DATA PROCESSING + DECISION WORKFLOW</text><rect x="28" y="138" width="200" height="385" rx="10" class="c"/><circle cx="58" cy="170" r="18" class="a"/><text x="58" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="48" y="214" class="h"><tspan x="48">RESPONSES</tspan></text><text x="48" y="282" class="b"><tspan x="48">Rows = respondents</tspan><tspan x="48" dy="21">Cols = items</tspan><tspan x="48" dy="21">Binary/score data</tspan></text><path d="M228 330 H246" class="ar"/><rect x="252" y="138" width="200" height="385" rx="10" class="c"/><circle cx="282" cy="170" r="18" class="a"/><text x="282" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="272" y="214" class="h"><tspan x="272">DIFFICULTY</tspan></text><text x="272" y="282" class="b"><tspan x="272">Proportion correct</tspan><tspan x="272" dy="21">Per item</tspan><tspan x="272" dy="21">Sample dependent</tspan></text><path d="M452 330 H470" class="ar"/><rect x="476" y="138" width="200" height="385" rx="10" class="c"/><circle cx="506" cy="170" r="18" class="a"/><text x="506" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="496" y="214" class="h"><tspan x="496">REST SCORE</tspan></text><text x="496" y="282" class="b"><tspan x="496">Exclude focal item</tspan><tspan x="496" dy="21">Rank respondents</tspan><tspan x="496" dy="21">Preserve ties</tspan></text><path d="M676 330 H694" class="ar"/><rect x="700" y="138" width="200" height="385" rx="10" class="c"/><circle cx="730" cy="170" r="18" class="a"/><text x="730" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">4</text><text x="720" y="214" class="h"><tspan x="720">DISCRIM</tspan></text><text x="720" y="282" class="b"><tspan x="720">Upper/lower groups</tspan><tspan x="720" dy="21">Pupper − Plower</tspan><tspan x="720" dy="21">Undefined if needed</tspan></text><path d="M900 330 H918" class="ar"/><rect x="924" y="138" width="200" height="385" rx="10" class="c"/><circle cx="954" cy="170" r="18" class="a"/><text x="954" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">5</text><text x="944" y="214" class="h"><tspan x="944">RELIABILITY</tspan></text><text x="944" y="282" class="b"><tspan x="944">Item variances</tspan><tspan x="944" dy="21">Total variance</tspan><tspan x="944" dy="21">Cronbach alpha</tspan></text><path d="M1124 330 H1142" class="ar"/><rect x="1148" y="138" width="200" height="385" rx="10" class="c"/><circle cx="1178" cy="170" r="18" class="a"/><text x="1178" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">6</text><text x="1168" y="214" class="h"><tspan x="1168">FLAG</tspan></text><text x="1168" y="282" class="b"><tspan x="1168">Extreme difficulty</tspan><tspan x="1168" dy="21">Weak discrimination</tspan><tspan x="1168" dy="21">Human review</tspan></text><rect x="28" y="560" width="1344" height="122" rx="10" class="n"/><text x="50" y="598" class="h">KEY RULE / CALCULATION</text><text x="50" y="630" class="b"><tspan x="50">For each item, exclude it from the rest score before defining upper/lower groups;</tspan><tspan x="50" dy="21">compute proportion correct, group discrimination and Cronbach alpha when estimable.</tspan></text><text x="28" y="736" class="sm">Rest-score grouping avoids using the focal item to help decide which respondents are 'high' and 'low' for that same item.</text></svg>