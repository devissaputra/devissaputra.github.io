<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788"><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia;fill:#173A63}.s{font:600 14px Arial;fill:#60717D;letter-spacing:3px}.h{font:700 17px Arial;fill:#173A63}.b{font:14px Arial;fill:#263846}.sm{font:12px Arial;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#A05F3B}.soft{fill:#FAEEE7;stroke:#A05F3B;stroke-width:1.2}.w{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.m{font:700 20px Georgia;fill:#A05F3B}</style><text x="700" y="48" text-anchor="middle" class="t">Assessment Design Lab</text><text x="700" y="80" text-anchor="middle" class="s">AI IN EDUCATION RESEARCH PROTOTYPE · FULL STORY</text><rect x="28" y="116" width="426" height="222" rx="11" class="c"/><circle cx="62" cy="150" r="18" class="a"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">PURPOSE</text><text x="55" y="198" class="b"><tspan x="55">Which assessment items deserve review based</tspan><tspan x="55" dy="21">on difficulty, discrimination and internal</tspan><tspan x="55" dy="21">consistency diagnostics?</tspan></text><rect x="487" y="116" width="426" height="222" rx="11" class="c"/><circle cx="521" cy="150" r="18" class="a"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">INPUTS / EVIDENCE</text><text x="514" y="198" class="b"><tspan x="514">Synthetic response matrix</tspan><tspan x="514" dy="21">Item-level correct/incorrect data</tspan><tspan x="514" dy="21">Respondent total/rest scores</tspan><tspan x="514" dy="21">Defined review thresholds</tspan></text><rect x="946" y="116" width="426" height="222" rx="11" class="c"/><circle cx="980" cy="150" r="18" class="a"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">CORE LOGIC</text><text x="973" y="198" class="b"><tspan x="973">Calculate proportion correct</tspan><tspan x="973" dy="21">Build rest score excluding focal item</tspan><tspan x="973" dy="21">Form extreme groups with ties preserved</tspan><tspan x="973" dy="21">Estimate discrimination + alpha</tspan></text><rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">WHAT THE PROTOTYPE PRODUCES</text><text x="55" y="453" class="b"><tspan x="55">Item difficulty diagnostics</tspan><tspan x="55" dy="23">Upper–lower discrimination</tspan><tspan x="55" dy="23">Internal-consistency summary</tspan><tspan x="55" dy="23">Explicit undefined cases + flags</tspan></text><text x="55" y="583" class="m">α = k/(k−1) × [1 − Σ Var(item) / Var(total)]</text><text x="55" y="610" class="sm">Reliability diagnostic, not evidence of assessment validity</text><rect x="946" y="372" width="426" height="268" rx="11" class="w"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="b"><tspan x="973">Synthetic responses only.</tspan><tspan x="973" dy="23">Alpha can be high for a poor assessment.</tspan><tspan x="973" dy="23">Thresholds flag items for review; they do not</tspan><tspan x="973" dy="23">prove that an item is invalid.</tspan></text><text x="28" y="728" class="sm">Best use: expose classic assessment diagnostics while preserving the conditions under which each statistic is interpretable.</text></svg>