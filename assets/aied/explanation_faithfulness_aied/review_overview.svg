<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc"><title id="title">Explanation Faithfulness for AIED — full project story</title><desc id="desc">Purpose, inputs, method, outputs and interpretation limits for this AI in Education research prototype.</desc><rect width="1400" height="788" fill="#F8FAFC"/><style>.title{font:700 37px Georgia,serif;fill:#173A63}.sub{font:600 14px Arial,sans-serif;fill:#5D6D7A;letter-spacing:3px}.h{font:700 17px Arial,sans-serif;fill:#173A63}.body{font:14px Arial,sans-serif;fill:#243744}.small{font:12px Arial,sans-serif;fill:#60717D}.card{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.soft{fill:#F1ECF8;stroke:#7557A5;stroke-width:1.2}.warn{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.accent{fill:#7557A5}.metric{font:700 20px Georgia,serif;fill:#7557A5}</style><text x="700" y="48" text-anchor="middle" class="title">Explanation Faithfulness for AIED</text><text x="700" y="80" text-anchor="middle" class="sub">AI IN EDUCATION RESEARCH PROTOTYPE · FULL STORY</text>
<rect x="28" y="116" width="426" height="222" rx="11" class="card"/><circle cx="62" cy="150" r="18" class="accent"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">PURPOSE</text><text x="55" y="198" class="body"><tspan x="55">Do highlighted features actually support a</tspan><tspan x="55" dy="22">model prediction, or do they merely look</tspan><tspan x="55" dy="22">plausible to a human reader?</tspan></text>
<rect x="487" y="116" width="426" height="222" rx="11" class="card"/><circle cx="521" cy="150" r="18" class="accent"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">INPUTS / EVIDENCE</text><text x="514" y="198" class="body"><tspan x="514">Synthetic original probabilities</tspan><tspan x="514" dy="22">Feature-removed probabilities</tspan><tspan x="514" dy="22">Feature-only probabilities</tspan><tspan x="514" dy="22">Top-feature sets across perturbations</tspan></text>
<rect x="946" y="116" width="426" height="222" rx="11" class="card"/><circle cx="980" cy="150" r="18" class="accent"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">CORE LOGIC</text><text x="973" y="198" class="body"><tspan x="973">Measure comprehensiveness</tspan><tspan x="973" dy="22">Measure sufficiency gap</tspan><tspan x="973" dy="22">Compare feature-set stability</tspan><tspan x="973" dy="22">Keep metrics separate before summary</tspan></text>
<rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">WHAT THE PROTOTYPE PRODUCES</text><text x="55" y="453" class="body"><tspan x="55">Comprehensiveness</tspan><tspan x="55" dy="23">Sufficiency gap</tspan><tspan x="55" dy="23">Jaccard stability</tspan><tspan x="55" dy="23">Transparent heuristic index</tspan></text><text x="55" y="583" class="metric">Comprehensiveness = max(0, p − p_without)</text><text x="55" y="610" class="small">Probability drop after removing the selected explanatory evidence</text>
<rect x="946" y="372" width="426" height="268" rx="11" class="warn"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="body"><tspan x="973">Inputs are supplied synthetic perturbations.</tspan><tspan x="973" dy="23">The combined index is hand weighted.</tspan><tspan x="973" dy="23">Faithfulness is not the same as usefulness,</tspan><tspan x="973" dy="23">persuasiveness or trustworthiness.</tspan></text>
<line x1="28" y1="699" x2="1372" y2="699" stroke="#D6E0E8"/><text x="28" y="728" class="small">Best use: make explanation diagnostics explicit before connecting them to real model perturbations and human studies.</text><text x="28" y="754" class="small">The diagram separates implemented computation from claims that still require authentic data and validation.</text></svg>