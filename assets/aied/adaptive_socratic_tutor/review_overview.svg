<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788"><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia;fill:#173A63}.s{font:600 14px Arial;fill:#60717D;letter-spacing:3px}.h{font:700 17px Arial;fill:#173A63}.b{font:14px Arial;fill:#263846}.sm{font:12px Arial;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#B47B31}.soft{fill:#FFF3E3;stroke:#B47B31;stroke-width:1.2}.w{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.m{font:700 20px Georgia;fill:#B47B31}</style><text x="700" y="48" text-anchor="middle" class="t">Adaptive Socratic Tutor</text><text x="700" y="80" text-anchor="middle" class="s">AI IN EDUCATION RESEARCH PROTOTYPE · FULL STORY</text><rect x="28" y="116" width="426" height="222" rx="11" class="c"/><circle cx="62" cy="150" r="18" class="a"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">PURPOSE</text><text x="55" y="198" class="b"><tspan x="55">How can a tutor increase support gradually</tspan><tspan x="55" dy="21">without revealing the full answer too early</tspan><tspan x="55" dy="21">or pretending to know more than it does?</tspan></text><rect x="487" y="116" width="426" height="222" rx="11" class="c"/><circle cx="521" cy="150" r="18" class="a"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">INPUTS / EVIDENCE</text><text x="514" y="198" class="b"><tspan x="514">Supplied mastery estimate</tspan><tspan x="514" dy="21">Attempt count</tspan><tspan x="514" dy="21">Problem context</tspan><tspan x="514" dy="21">Transparent support rules</tspan></text><rect x="946" y="116" width="426" height="222" rx="11" class="c"/><circle cx="980" cy="150" r="18" class="a"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">CORE LOGIC</text><text x="973" y="198" class="b"><tspan x="973">Start with a focused question</tspan><tspan x="973" dy="21">Increase hint depth after struggle</tspan><tspan x="973" dy="21">Use mastery + attempt thresholds</tspan><tspan x="973" dy="21">Keep full answer outside main policy</tspan></text><rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">WHAT THE PROTOTYPE PRODUCES</text><text x="55" y="453" class="b"><tspan x="55">Hint level 0–3</tspan><tspan x="55" dy="23">Inspectable support decision</tspan><tspan x="55" dy="23">Consistent escalation path</tspan><tspan x="55" dy="23">Policy boundary visible to designers</tspan></text><text x="55" y="583" class="m">Hint level ∈ {0,1,2,3}</text><text x="55" y="610" class="sm">Lower mastery or more attempts can increase support</text><rect x="946" y="372" width="426" height="268" rx="11" class="w"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="b"><tspan x="973">The prototype does not estimate mastery.</tspan><tspan x="973" dy="23">Synthetic cases only test decision boundaries.</tspan><tspan x="973" dy="23">Learning benefit and productive struggle</tspan><tspan x="973" dy="23">require empirical study.</tspan></text><text x="28" y="728" class="sm">Best use: inspect scaffolding policy logic before connecting it to a real mastery model or tutoring experiment.</text></svg>