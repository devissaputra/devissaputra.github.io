<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
<title id="title">Knowledge Tracing Benchmark on ASSISTments 2009 — full study story</title>
<desc id="desc">Research question, dataset, study design, main result and interpretation boundary.</desc>
<rect width="1400" height="788" fill="#F8FAFC"/>
<style>
.title{font:700 38px Georgia,serif;fill:#173A63}.sub{font:600 14px Arial,sans-serif;fill:#5B6B7A;letter-spacing:3px}.h{font:700 18px Arial,sans-serif;fill:#173A63}.body{font:14px Arial,sans-serif;fill:#21313E}.small{font:12px Arial,sans-serif;fill:#5D6A75}.metric{font:700 27px Georgia,serif;fill:#197A7A}.metricLabel{font:600 12px Arial,sans-serif;fill:#40505E}.card{fill:#FFF;stroke:#CBD6E0;stroke-width:1.4}.soft{fill:#E7F5F4;stroke:#197A7A;stroke-width:1}.flow{stroke:#8FA4B8;stroke-width:2;fill:none}.accent{fill:#197A7A}.warn{fill:#FFF7ED;stroke:#E7B06B;stroke-width:1.2}
</style>
<text x="700" y="50" text-anchor="middle" class="title">Knowledge Tracing Benchmark on ASSISTments 2009</text>
<text x="700" y="82" text-anchor="middle" class="sub">EMPIRICAL STUDY · FULL STORY</text>
<rect x="28" y="118" width="425" height="230" rx="12" class="card"/>
<circle cx="62" cy="151" r="18" class="accent"/><text x="62" y="157" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text>
<text x="94" y="157" class="h">RESEARCH QUESTION</text>
<text x="55" y="198" class="body"><tspan x="55">How much does learner history improve</tspan><tspan x="55" dy="23">next-response prediction when evaluation</tspan><tspan x="55" dy="23">is learner-disjoint and leakage controlled?</tspan></text>
<rect x="478" y="118" width="425" height="230" rx="12" class="card"/>
<circle cx="512" cy="151" r="18" class="accent"/><text x="512" y="157" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text>
<text x="544" y="157" class="h">DATA + DESIGN</text>
<text x="505" y="198" class="body"><tspan x="505">4,148 learners · 274,331 interactions</tspan><tspan x="505" dy="22">70/15/15 split by learner, not attempt</tspan><tspan x="505" dy="22">Priors, BKT, PFA and compact GRU</tspan><tspan x="505" dy="22">Final test contains 623 unseen learners</tspan></text>
<rect x="928" y="118" width="444" height="230" rx="12" class="card"/>
<circle cx="962" cy="151" r="18" class="accent"/><text x="962" y="157" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text>
<text x="994" y="157" class="h">ANALYTICAL LOGIC</text>
<text x="955" y="198" class="body"><tspan x="955">Fit simple and stateful baselines</tspan><tspan x="955" dy="22">Tune only on validation learners</tspan><tspan x="955" dy="22">Predict before observing the current answer</tspan><tspan x="955" dy="22">Compare discrimination + probability quality</tspan></text>
<path d="M453 233 H478 M903 233 H928" class="flow"/>
<rect x="28" y="377" width="874" height="272" rx="12" class="soft"/>
<text x="55" y="415" class="h">WHAT THE STUDY FOUND</text>
<text x="65" y="476" class="metric">0.7471</text><text x="65" y="500" class="metricLabel">GRU mean ROC-AUC</text><text x="270" y="476" class="metric">0.1800</text><text x="270" y="500" class="metricLabel">GRU Brier (seed 42)</text><text x="475" y="476" class="metric">0.6982</text><text x="475" y="500" class="metricLabel">PFA ROC-AUC</text><text x="680" y="476" class="metric">3 seeds</text><text x="680" y="500" class="metricLabel">GRU stability check</text>
<text x="55" y="548" class="body"><tspan x="55">The recurrent model predicts held-out responses better than the transparent baselines</tspan><tspan x="55" dy="22">under this frozen benchmark. Calibration, learner-level uncertainty and first-versus-</tspan><tspan x="55" dy="22">repeated skill encounters remain visible in the evidence chain.</tspan></text>
<rect x="928" y="377" width="444" height="272" rx="12" class="warn"/>
<text x="955" y="415" class="h">INTERPRETATION BOUNDARY</text>
<text x="955" y="458" class="body"><tspan x="955">Prediction quality is not a direct</tspan><tspan x="955" dy="23">measurement of knowledge or intelligence.</tspan><tspan x="955" dy="23">The benchmark does not show that a model</tspan><tspan x="955" dy="23">improves teaching, learning or high-stakes</tspan><tspan x="955" dy="23">educational decisions.</tspan></text>
<text x="55" y="704" class="small">Scientific source: ASSISTments 2009; executable adapter pins the public Atomi sequence representation and verifies its fingerprint.</text>
<line x1="28" y1="728" x2="1372" y2="728" stroke="#D7E0E8"/>
<text x="28" y="754" class="small">Designed for rapid professor review: question → evidence → analysis → result → limit.</text>
</svg>