<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
<title id="title">Knowledge Tracing Benchmark on ASSISTments 2009</title><desc id="desc">Study overview</desc>
<rect width="1400" height="788" fill="#F7F9FB"/>
<style>
.title{font-family:Georgia,serif;font-weight:700;fill:#173A63;font-size:38px}
.subtitle{font-family:Arial,sans-serif;fill:#173A63;font-size:15px;letter-spacing:4px}
.h{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:18px}
.h2{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:15px}
.txt{font-family:Arial,sans-serif;fill:#172533;font-size:14px}
.sm{font-family:Arial,sans-serif;fill:#5C6B78;font-size:12px}
.metric{font-family:Georgia,serif;font-weight:700;fill:#173A63;font-size:24px}
.card{fill:#FFFFFF;stroke:#C8D5E1;stroke-width:1.2}
.soft{fill:#EAF2F8;stroke:#D9E6F0;stroke-width:1}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#173A63"/></marker></defs>
<text x="700" y="50" text-anchor="middle" class="title">Knowledge Tracing Benchmark on ASSISTments 2009</text>
<line x1="240" y1="78" x2="545" y2="78" stroke="#9DB5CB"/><line x1="855" y1="78" x2="1160" y2="78" stroke="#9DB5CB"/>
<text x="700" y="84" text-anchor="middle" class="subtitle">STUDY OVERVIEW</text>
<rect x="18" y="110" width="440" height="250" rx="10" class="card"/><circle cx="48" cy="140" r="19" fill="#173A63"/><text x="48" y="146" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">1</text><text x="82" y="146" class="h">QUESTION AND DATA</text>
<circle cx="90" cy="202" r="8" fill="#2F6EAA"/><circle cx="70" cy="205" r="7" fill="#6EA4D7"/><circle cx="110" cy="205" r="7" fill="#6EA4D7"/><rect x="78" y="215" width="24" height="20" rx="8" fill="#2F6EAA"/><rect x="59" y="217" width="20" height="17" rx="7" fill="#6EA4D7"/><rect x="101" y="217" width="20" height="17" rx="7" fill="#6EA4D7"/>
<text x="145" y="190" class="h"><tspan x="145">How much predictive value is added</tspan><tspan x="145" dy="22">by different representations of</tspan><tspan x="145" dy="22">learner history?</tspan></text>
<rect x="42" y="260" width="118" height="92" rx="8" class="soft"/><text x="101" y="294" class="metric" text-anchor="middle">4,148</text><text x="101" y="318" class="h2" text-anchor="middle">learners</text>
<rect x="170" y="260" width="128" height="92" rx="8" class="soft"/><text x="234" y="294" class="metric" text-anchor="middle">274,331</text><text x="234" y="318" class="h2" text-anchor="middle">interactions</text>
<rect x="308" y="260" width="125" height="92" rx="8" class="soft"/><text x="371" y="294" class="metric" text-anchor="middle">623</text><text x="371" y="318" class="h2" text-anchor="middle">test learners</text>
<rect x="475" y="110" width="905" height="250" rx="10" class="card"/><circle cx="505" cy="140" r="19" fill="#173A63"/><text x="505" y="146" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">2</text><text x="539" y="146" class="h">LEARNER HISTORY AND MODEL COMPARISON</text>
<line x1="520" y1="205" x2="1280" y2="205" stroke="#173A63" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="562" cy="205" r="9" fill="#6EA4D7" stroke="white" stroke-width="2"/><text x="562" y="185" class="sm" text-anchor="middle">prior</text>
<circle cx="703" cy="205" r="9" fill="#6EA4D7" stroke="white" stroke-width="2"/><text x="703" y="185" class="sm" text-anchor="middle">skill</text>
<circle cx="844" cy="205" r="9" fill="#2F6EAA" stroke="white" stroke-width="2"/><text x="844" y="185" class="sm" text-anchor="middle">BKT</text>
<circle cx="984" cy="205" r="9" fill="#2F6EAA" stroke="white" stroke-width="2"/><text x="984" y="185" class="sm" text-anchor="middle">PFA</text>
<circle cx="1125" cy="205" r="9" fill="#173A63" stroke="white" stroke-width="2"/><text x="1125" y="185" class="sm" text-anchor="middle">GRU</text>
<text x="520" y="250" class="h2">Prediction is emitted before the current response is observed.</text>
<text x="520" y="282" class="txt"><tspan x="520">Models range from population and skill priors to Bayesian Knowledge Tracing, a PFA</tspan><tspan x="520" dy="18">logistic model and a compact GRU sequence model. Learners are split before model fitting</tspan><tspan x="520" dy="18">to keep train, validation and test partitions disjoint.</tspan></text>
<rect x="18" y="385" width="850" height="360" rx="10" class="card"/><circle cx="48" cy="415" r="19" fill="#173A63"/><text x="48" y="421" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">3</text><text x="82" y="421" class="h">RECORDED TEST RESULTS</text>
<line x1="70" y1="645" x2="790" y2="645" stroke="#C8D5E1"/>
<rect x="107" y="623" width="69" height="22" rx="3" fill="#B7C8D8"/><text x="142" y="617" class="sm" text-anchor="middle">0.5000</text><text x="142" y="662" class="sm" text-anchor="middle"><tspan x="142">Global</tspan><tspan x="142" dy="12">prior</tspan></text>
<rect x="251" y="568" width="69" height="77" rx="3" fill="#9FBBDC"/><text x="286" y="562" class="sm" text-anchor="middle">0.6234</text><text x="286" y="662" class="sm" text-anchor="middle"><tspan x="286">Skill</tspan><tspan x="286" dy="12">prior</tspan></text>
<rect x="395" y="546" width="69" height="99" rx="3" fill="#7EA7CF"/><text x="430" y="540" class="sm" text-anchor="middle">0.6722</text><text x="430" y="662" class="sm" text-anchor="middle">BKT tuned</text>
<rect x="539" y="535" width="69" height="110" rx="3" fill="#5489BE"/><text x="574" y="529" class="sm" text-anchor="middle">0.6982</text><text x="574" y="662" class="sm" text-anchor="middle">PFA</text>
<rect x="683" y="513" width="69" height="132" rx="3" fill="#173A63"/><text x="718" y="507" class="sm" text-anchor="middle">0.7470</text><text x="718" y="662" class="sm" text-anchor="middle">GRU</text>
<text x="70" y="695" class="h2">ROC-AUC on 623 held-out learners</text>
<rect x="890" y="385" width="490" height="360" rx="10" class="card"/><circle cx="920" cy="415" r="19" fill="#173A63"/><text x="920" y="421" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">4</text><text x="954" y="421" class="h">INTERPRETATION</text>
<circle cx="930" cy="480" r="10" fill="#2F8F72"/><path d="M 925 480 l4 5 l8 -10" stroke="white" stroke-width="2.5" fill="none"/><text x="955" y="474" class="txt">GRU seed 42: ROC-AUC 0.7470 and Brier 0.1800.</text>
<circle cx="930" cy="545" r="10" fill="#2F8F72"/><path d="M 925 545 l4 5 l8 -10" stroke="white" stroke-width="2.5" fill="none"/><text x="955" y="539" class="txt"><tspan x="955">Across three GRU seeds, mean ROC-AUC is</tspan><tspan x="955" dy="18">0.7471 with sample SD 0.0008.</tspan></text>
<circle cx="930" cy="615" r="10" fill="#B94B55"/><path d="M 926 611 l8 8 M 934 611 l-8 8" stroke="white" stroke-width="2.5"/><text x="955" y="609" class="txt"><tspan x="955">Predictive performance is not a direct</tspan><tspan x="955" dy="18">measurement of learner knowledge and does not</tspan><tspan x="955" dy="18">establish instructional benefit.</tspan></text>
</svg>