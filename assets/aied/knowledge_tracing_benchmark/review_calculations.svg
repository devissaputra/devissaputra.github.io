<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
<title id="title">Knowledge Tracing Benchmark on ASSISTments 2009</title><desc id="desc">Data processing and evaluation pipeline</desc>
<rect width="1400" height="788" fill="#F7F9FB"/>
<style>
.title{font-family:Georgia,serif;font-weight:700;fill:#173A63;font-size:38px}
.subtitle{font-family:Arial,sans-serif;fill:#173A63;font-size:15px;letter-spacing:4px}
.h{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:18px}
.h2{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:15px}
.txt{font-family:Arial,sans-serif;fill:#172533;font-size:14px}
.sm{font-family:Arial,sans-serif;fill:#5C6B78;font-size:12px}
.metric{font-family:Georgia,serif;font-weight:700;fill:#173A63;font-size:24px}
.card{fill:#FFFFFF;stroke:#C8D5E1;stroke-width:1.2}
.soft{fill:#EAF2F8;stroke:#D9E6F0;stroke-width:1}
.flow{stroke:#173A63;stroke-width:2;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#173A63"/></marker></defs>
<text x="700" y="50" text-anchor="middle" class="title">Knowledge Tracing Benchmark on ASSISTments 2009</text>
<line x1="240" y1="78" x2="545" y2="78" stroke="#9DB5CB"/><line x1="855" y1="78" x2="1160" y2="78" stroke="#9DB5CB"/>
<text x="700" y="84" text-anchor="middle" class="subtitle">DATA PROCESSING AND EVALUATION PIPELINE</text>
<rect x="20" y="125" width="210" height="420" rx="10" class="card"/><circle cx="48" cy="155" r="19" fill="#173A63"/><text x="48" y="161" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">1</text><text x="75" y="161" class="h2">RAW SEQUENCES</text>
<rect x="245" y="125" width="210" height="420" rx="10" class="card"/><circle cx="273" cy="155" r="19" fill="#173A63"/><text x="273" y="161" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">2</text><text x="300" y="161" class="h2">LEARNER SPLIT</text>
<rect x="470" y="125" width="210" height="420" rx="10" class="card"/><circle cx="498" cy="155" r="19" fill="#173A63"/><text x="498" y="161" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">3</text><text x="525" y="161" class="h2">ORDERED HISTORY</text>
<rect x="695" y="125" width="210" height="420" rx="10" class="card"/><circle cx="723" cy="155" r="19" fill="#173A63"/><text x="723" y="161" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">4</text><text x="750" y="161" class="h2">MODEL INPUTS</text>
<rect x="920" y="125" width="210" height="420" rx="10" class="card"/><circle cx="948" cy="155" r="19" fill="#173A63"/><text x="948" y="161" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">5</text><text x="975" y="161" class="h2">MODEL FITTING</text>
<rect x="1145" y="125" width="210" height="420" rx="10" class="card"/><circle cx="1173" cy="155" r="19" fill="#173A63"/><text x="1173" y="161" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">6</text><text x="1200" y="161" class="h2">HELD-OUT EVALUATION</text>
<ellipse cx="125" cy="225" rx="28" ry="10" fill="#6EA4D7"/><rect x="97" y="225" width="56" height="36" fill="#6EA4D7"/><ellipse cx="125" cy="261" rx="28" ry="10" fill="#2F6EAA"/><ellipse cx="125" cy="225" rx="28" ry="10" fill="#BFD4E6"/>
<text x="45" y="285" class="txt"><tspan x="45">ASSISTments 2009 sequence</tspan><tspan x="45" dy="19">representation</tspan><tspan x="45" dy="19">4,148 learner rows</tspan><tspan x="45" dy="19">274,331 aligned</tspan><tspan x="45" dy="19">interactions</tspan></text>
<rect x="270" y="210" width="160" height="92" rx="8" class="soft"/><text x="350" y="244" class="metric" text-anchor="middle">70%</text><text x="350" y="268" class="h2" text-anchor="middle">train</text>
<rect x="270" y="312" width="160" height="92" rx="8" class="soft"/><text x="350" y="346" class="metric" text-anchor="middle">15%</text><text x="350" y="370" class="h2" text-anchor="middle">validation</text>
<rect x="270" y="414" width="160" height="92" rx="8" class="soft"/><text x="350" y="448" class="metric" text-anchor="middle">15%</text><text x="350" y="472" class="h2" text-anchor="middle">test</text>
<text x="495" y="210" class="txt"><tspan x="495">Sort each learner</tspan><tspan x="495" dy="19">sequence by recorded</tspan><tspan x="495" dy="19">order.</tspan><tspan x="495" dy="38">Use skill IDs and binary</tspan><tspan x="495" dy="19">response history.</tspan><tspan x="495" dy="38">Reject misaligned</tspan><tspan x="495" dy="19">sequences.</tspan></text>
<text x="720" y="210" class="txt"><tspan x="720">BKT: mastery state</tspan><tspan x="720" dy="19">PFA: prior success/failure</tspan><tspan x="720" dy="19">counts</tspan><tspan x="720" dy="19">GRU: padded skill-response</tspan><tspan x="720" dy="19">sequence</tspan><tspan x="720" dy="38">Current target response is</tspan><tspan x="720" dy="19">withheld.</tspan></text>
<text x="945" y="210" class="txt"><tspan x="945">Fit priors, BKT and PFA</tspan><tspan x="945" dy="19">on training learners.</tspan><tspan x="945" dy="38">Tune on validation</tspan><tspan x="945" dy="19">learners.</tspan><tspan x="945" dy="38">Train compact GRU with</tspan><tspan x="945" dy="19">fixed seeds.</tspan></text>
<text x="1170" y="210" class="txt"><tspan x="1170">Evaluate only on 623</tspan><tspan x="1170" dy="19">held-out learners.</tspan><tspan x="1170" dy="38">Report ROC-AUC, average</tspan><tspan x="1170" dy="19">precision, Brier, log</tspan><tspan x="1170" dy="19">loss and ECE.</tspan></text>
<path d="M 230 335 L 242 335" class="flow"/><path d="M 455 335 L 467 335" class="flow"/><path d="M 680 335 L 692 335" class="flow"/><path d="M 905 335 L 917 335" class="flow"/><path d="M 1130 335 L 1142 335" class="flow"/>
<rect x="20" y="575" width="1360" height="150" rx="10" class="card"/><text x="45" y="610" class="h">LEAKAGE CONTROL</text>
<line x1="60" y1="665" x2="760" y2="665" stroke="#173A63" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="108" cy="665" r="9" fill="#2F6EAA" stroke="white" stroke-width="2"/><text x="108" y="645" class="sm" text-anchor="middle">history t-3</text>
<circle cx="267" cy="665" r="9" fill="#2F6EAA" stroke="white" stroke-width="2"/><text x="267" y="645" class="sm" text-anchor="middle">history t-2</text>
<circle cx="426" cy="665" r="9" fill="#2F6EAA" stroke="white" stroke-width="2"/><text x="426" y="645" class="sm" text-anchor="middle">history t-1</text>
<circle cx="585" cy="665" r="9" fill="#FFFFFF" stroke="#173A63" stroke-width="2"/><text x="585" y="645" class="sm" text-anchor="middle">predict t</text>
<text x="820" y="625" class="txt"><tspan x="820">Every stateful prediction is produced before the current</tspan><tspan x="820" dy="20">response is observed. The split unit is the learner,</tspan><tspan x="820" dy="20">preventing one learner from appearing in more than one</tspan><tspan x="820" dy="20">partition.</tspan></text>
</svg>