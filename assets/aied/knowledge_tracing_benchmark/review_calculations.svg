<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
<title id="title">Knowledge Tracing Benchmark on ASSISTments 2009 — data processing pipeline</title>
<desc id="desc">Step-by-step data preparation, modelling and evaluation workflow.</desc>
<rect width="1400" height="788" fill="#F8FAFC"/>
<style>
.title{font:700 38px Georgia,serif;fill:#173A63}.sub{font:600 14px Arial,sans-serif;fill:#5B6B7A;letter-spacing:3px}.step{fill:#FFF;stroke:#CBD6E0;stroke-width:1.4}.num{fill:#197A7A}.h{font:700 15px Arial,sans-serif;fill:#173A63}.body{font:13px Arial,sans-serif;fill:#263846}.small{font:12px Arial,sans-serif;fill:#61717E}.note{fill:#E7F5F4;stroke:#197A7A;stroke-width:1.2}.arrow{stroke:#197A7A;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#197A7A"/></marker></defs>
<text x="700" y="50" text-anchor="middle" class="title">Knowledge Tracing Benchmark on ASSISTments 2009</text>
<text x="700" y="82" text-anchor="middle" class="sub">DATA PROCESSING + ANALYSIS WORKFLOW</text>

<rect x="28" y="142" width="200" height="388" rx="11" class="step"/>
<circle cx="58" cy="174" r="18" class="num"/><text x="58" y="180" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text>
<text x="48" y="217" class="h"><tspan x="48">1. INGEST</tspan></text>
<text x="48" y="286" class="body"><tspan x="48">Pinned learner sequences</tspan><tspan x="48" dy="21">Verify learner-row integrity</tspan><tspan x="48" dy="21">Record source fingerprint</tspan></text>
<path d="M228 335 H246" class="arrow"/>
<rect x="252" y="142" width="200" height="388" rx="11" class="step"/>
<circle cx="282" cy="174" r="18" class="num"/><text x="282" y="180" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text>
<text x="272" y="217" class="h"><tspan x="272">2. SPLIT</tspan></text>
<text x="272" y="286" class="body"><tspan x="272">Split by learner</tspan><tspan x="272" dy="21">70% train · 15% validation</tspan><tspan x="272" dy="21">15% final test</tspan><tspan x="272" dy="21">No learner crosses partitions</tspan></text>
<path d="M452 335 H470" class="arrow"/>
<rect x="476" y="142" width="200" height="388" rx="11" class="step"/>
<circle cx="506" cy="174" r="18" class="num"/><text x="506" y="180" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text>
<text x="496" y="217" class="h"><tspan x="496">3. FEATURES</tspan></text>
<text x="496" y="286" class="body"><tspan x="496">Build prior skill history</tspan><tspan x="496" dy="21">Success/failure counts</tspan><tspan x="496" dy="21">Sequence skill vocabulary</tspan><tspan x="496" dy="21">No current-answer leakage</tspan></text>
<path d="M676 335 H694" class="arrow"/>
<rect x="700" y="142" width="200" height="388" rx="11" class="step"/>
<circle cx="730" cy="174" r="18" class="num"/><text x="730" y="180" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">4</text>
<text x="720" y="217" class="h"><tspan x="720">4. FIT</tspan></text>
<text x="720" y="286" class="body"><tspan x="720">Global + skill priors</tspan><tspan x="720" dy="21">Fixed and tuned BKT</tspan><tspan x="720" dy="21">PFA-style logistic model</tspan><tspan x="720" dy="21">Compact GRU · 3 seeds</tspan></text>
<path d="M900 335 H918" class="arrow"/>
<rect x="924" y="142" width="200" height="388" rx="11" class="step"/>
<circle cx="954" cy="174" r="18" class="num"/><text x="954" y="180" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">5</text>
<text x="944" y="217" class="h"><tspan x="944">5. EVALUATE</tspan></text>
<text x="944" y="286" class="body"><tspan x="944">ROC-AUC · AP</tspan><tspan x="944" dy="21">Brier · log loss · ECE</tspan><tspan x="944" dy="21">First/repeated skill slices</tspan><tspan x="944" dy="21">Learner-block bootstrap</tspan></text>
<path d="M1124 335 H1142" class="arrow"/>
<rect x="1148" y="142" width="200" height="388" rx="11" class="step"/>
<circle cx="1178" cy="174" r="18" class="num"/><text x="1178" y="180" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">6</text>
<text x="1168" y="217" class="h"><tspan x="1168">6. REPORT</tspan></text>
<text x="1168" y="286" class="body"><tspan x="1168">Machine-readable metrics</tspan><tspan x="1168" dy="21">Generated result tables</tspan><tspan x="1168" dy="21">Calibration diagnostics</tspan><tspan x="1168" dy="21">Paper + model card + ethics</tspan></text>

<rect x="28" y="568" width="1344" height="112" rx="10" class="note"/>
<text x="50" y="603" class="h">Critical processing rule</text>
<text x="50" y="632" class="body"><tspan x="50">Every stateful prediction is emitted before the response being predicted is observed; test learners are never used for model selection.</tspan></text>
<text x="28" y="732" class="small">Pipeline purpose: make the benchmark reproducible, leakage-resistant and easy to audit.</text>
</svg>