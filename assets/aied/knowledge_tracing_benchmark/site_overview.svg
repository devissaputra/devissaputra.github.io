<rect x="1170" y="140" width="388" height="590" rx="18" fill="#fff" stroke="#c9d7e8" stroke-width="2"/>
<text x="1200" y="183" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#174f91" font-weight="700" text-anchor="start">3  What the design tests</text>
<rect x="1200" y="218" width="328" height="92" rx="14" fill="#eef6ff" stroke="#bad4f2" stroke-width="1.3"/>
<text x="1220" y="248" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f5fbf" font-weight="700" text-anchor="start">Model comparison</text>
<text x="1220" y="274" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="400" text-anchor="start">Priors → BKT → PFA → GRU</text><text x="1220" y="296" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="400" text-anchor="start">under one frozen protocol</text>
<rect x="1200" y="325" width="328" height="92" rx="14" fill="#f3efff" stroke="#cabefa" stroke-width="1.3"/>
<text x="1220" y="355" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6b4bc9" font-weight="700" text-anchor="start">Encounter slices</text>
<text x="1220" y="381" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="400" text-anchor="start">First-seen skill for learner</text><text x="1220" y="403" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="400" text-anchor="start">versus repeated-skill interactions</text>
<rect x="1200" y="432" width="328" height="92" rx="14" fill="#fff4e8" stroke="#efc68f" stroke-width="1.3"/>
<text x="1220" y="462" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#bd7119" font-weight="700" text-anchor="start">Uncertainty</text>
<text x="1220" y="488" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="400" text-anchor="start">Learner-block bootstrap Brier deltas</text><text x="1220" y="510" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="400" text-anchor="start">against the skill-prior baseline</text>
<rect x="1200" y="539" width="328" height="92" rx="14" fill="#eaf8f2" stroke="#a9dccb" stroke-width="1.3"/>
<text x="1220" y="569" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#10825f" font-weight="700" text-anchor="start">Recurrent stability</text>
<text x="1220" y="595" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="400" text-anchor="start">Three prespecified GRU seeds</text><text x="1220" y="617" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="400" text-anchor="start">plus skill-level error analysis</text>
<text x="1200" y="676" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#183153" font-weight="700" text-anchor="start">Interpretation boundary</text>
<text x="1200" y="700" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#56697d" font-weight="400" text-anchor="start">Predictive states are not direct measures</text><text x="1200" y="721" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#56697d" font-weight="400" text-anchor="start">of knowledge or instructional benefit.</text>

<rect x="42" y="755" width="1516" height="104" rx="18" fill="#102f50" stroke="#102f50" stroke-width="0"/>
<text x="70" y="793" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#83e4cf" font-weight="700" text-anchor="start">Main empirical pattern</text>
<text x="70" y="828" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#ffffff" font-weight="700" text-anchor="start">The compact GRU improves held-out prediction and probability quality over the transparent baselines, with stable results across three seeds.</text>
