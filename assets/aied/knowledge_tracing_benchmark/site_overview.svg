<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Knowledge Tracing on ASSISTments 2009</title>
<desc id="desc">Scientific overview of a learner-disjoint benchmark comparing priors, Bayesian Knowledge Tracing, PFA-style logistic regression, and a compact GRU model on ASSISTments 2009.</desc>
<defs>
 <linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#0c2f5c"/><stop offset=".56" stop-color="#145e9b"/><stop offset="1" stop-color="#6546d7"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="#f5f8fc"/>
<rect width="1600" height="112" fill="url(#head)"/>
<text x="54" y="58" font-family="Arial,Helvetica,sans-serif" font-size="43" fill="#ffffff" font-weight="700" text-anchor="start">Knowledge Tracing on ASSISTments 2009</text>
<text x="56" y="91" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#dbeeff" font-weight="400" text-anchor="start">A leakage-resistant benchmark of transparent and recurrent learner models</text>
<text x="1538" y="52" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#c9f4ff" font-weight="700" text-anchor="end">EMPIRICAL AIED STUDY</text>
<text x="1538" y="80" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#ffffff" font-weight="400" text-anchor="end">learner-disjoint · calibrated · uncertainty-aware</text>

<rect x="42" y="140" width="390" height="590" rx="18" fill="#fff" stroke="#c9d7e8" stroke-width="2"/>
<text x="70" y="183" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#174f91" font-weight="700" text-anchor="start">1  Dataset + split discipline</text>
<rect x="70" y="213" width="334" height="152" rx="15" fill="#eef6ff" stroke="#b7d2f3" stroke-width="1.5"/>
<text x="91" y="247" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#183153" font-weight="700" text-anchor="start">ASSISTments 2009</text>
<text x="91" y="286" font-family="Arial,Helvetica,sans-serif" font-size="35" fill="#1f5fbf" font-weight="700" text-anchor="start">4,148</text>
<text x="208" y="286" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#56697d" font-weight="400" text-anchor="start">learners</text>
<text x="91" y="326" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#6a47c8" font-weight="700" text-anchor="start">274,331</text>
<text x="235" y="326" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#56697d" font-weight="400" text-anchor="start">interactions</text>
<text x="91" y="352" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#34465c" font-weight="600" text-anchor="start">138 training skills</text>

<text x="70" y="408" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#183153" font-weight="700" text-anchor="start">Learner-disjoint partition</text>
<text x="70" y="438" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="600" text-anchor="start">Train</text><rect x="135" y="423" width="220" height="18" rx="9" fill="#e4ebf3"/><rect x="135" y="423" width="154" height="18" rx="9" fill="#2c77c5"/><text x="365" y="438" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#44576b" font-weight="700" text-anchor="start">70%</text>
<text x="70" y="477" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="600" text-anchor="start">Validation</text><rect x="135" y="462" width="220" height="18" rx="9" fill="#e4ebf3"/><rect x="135" y="462" width="33" height="18" rx="9" fill="#13a373"/><text x="365" y="477" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#44576b" font-weight="700" text-anchor="start">15%</text>
<text x="70" y="516" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="600" text-anchor="start">Test</text><rect x="135" y="501" width="220" height="18" rx="9" fill="#e4ebf3"/><rect x="135" y="501" width="33" height="18" rx="9" fill="#d47b24"/><text x="365" y="516" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#44576b" font-weight="700" text-anchor="start">15%</text>
<text x="70" y="557" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#44576b" font-weight="400" text-anchor="start">No learner crosses partitions.</text><text x="70" y="583" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#44576b" font-weight="400" text-anchor="start">Every stateful prediction is emitted</text><text x="70" y="609" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#44576b" font-weight="400" text-anchor="start">before the current response is observed.</text>
<rect x="70" y="647" width="334" height="54" rx="12" fill="#f3f6fa" stroke="#d2dce8" stroke-width="1"/>
<text x="91" y="680" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#34465c" font-weight="700" text-anchor="start">Final test: 623 learners · 41,228 interactions</text>

<rect x="455" y="140" width="690" height="590" rx="18" fill="#fff" stroke="#c9d7e8" stroke-width="2"/>
