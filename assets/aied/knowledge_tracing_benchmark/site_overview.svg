<line x1="485" y1="264" x2="1110" y2="264" stroke="#cbd7e5"/><rect x="477" y="275" width="645" height="43" rx="10" fill="#fafbfd" stroke="#e4e9f0"/><text x="495" y="303" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#7a8794" font-weight="700" text-anchor="start">Global prior</text><text x="790" y="303" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.5000</text><text x="895" y="303" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.2197</text><text x="1018" y="303" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.6313</text><text x="1104" y="303" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.0160</text><rect x="477" y="330" width="645" height="43" rx="10" fill="#fafbfd" stroke="#e4e9f0"/><text x="495" y="358" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#4b789f" font-weight="700" text-anchor="start">Skill prior</text><text x="790" y="358" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.6234</text><text x="895" y="358" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.2097</text><text x="1018" y="358" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.6096</text><text x="1104" y="358" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.0145</text><rect x="477" y="385" width="645" height="43" rx="10" fill="#fafbfd" stroke="#e4e9f0"/><text x="495" y="413" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#d36c59" font-weight="700" text-anchor="start">Fixed BKT</text><text x="790" y="413" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.6746</text><text x="895" y="413" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.2187</text><text x="1018" y="413" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.6360</text><text x="1104" y="413" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.1226</text><rect x="477" y="440" width="645" height="43" rx="10" fill="#fafbfd" stroke="#e4e9f0"/><text x="495" y="468" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#b07821" font-weight="700" text-anchor="start">Tuned BKT</text><text x="790" y="468" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.6722</text><text x="895" y="468" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.2024</text><text x="1018" y="468" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.5928</text><text x="1104" y="468" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.0279</text><rect x="477" y="495" width="645" height="43" rx="10" fill="#fafbfd" stroke="#e4e9f0"/><text x="495" y="523" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#6b54bf" font-weight="700" text-anchor="start">PFA logistic</text><text x="790" y="523" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.6982</text><text x="895" y="523" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.1976</text><text x="1018" y="523" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.5840</text><text x="1104" y="523" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.0413</text><rect x="477" y="550" width="645" height="43" rx="10" fill="#e9f8f2" stroke="#9edac5"/><text x="495" y="578" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#0f9369" font-weight="700" text-anchor="start">GRU seed 42</text><text x="790" y="578" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.7470</text><text x="895" y="578" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.1800</text><text x="1018" y="578" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.5382</text><text x="1104" y="578" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25384d" font-weight="600" text-anchor="end">0.0133</text><text x="485" y="645" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#183153" font-weight="700" text-anchor="start">GRU stability across seeds 13, 42, 73</text>
