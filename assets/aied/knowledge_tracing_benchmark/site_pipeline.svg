<title id="t">Knowledge Tracing Experimental Workflow</title>
<desc id="d">Reproducible workflow from pinned ASSISTments 2009 sequence data through learner-disjoint splitting, model fitting, validation, final test evaluation, slice analysis, uncertainty estimation, and generated evidence.</desc>
