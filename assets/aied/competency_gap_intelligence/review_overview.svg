<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788"><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia;fill:#173A63}.s{font:600 14px Arial;fill:#60717D;letter-spacing:3px}.h{font:700 17px Arial;fill:#173A63}.b{font:14px Arial;fill:#263846}.sm{font:12px Arial;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#5C6FA3}.soft{fill:#EDF0F8;stroke:#5C6FA3;stroke-width:1.2}.w{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.m{font:700 20px Georgia;fill:#5C6FA3}</style><text x="700" y="48" text-anchor="middle" class="t">Competency Gap Intelligence</text><text x="700" y="80" text-anchor="middle" class="s">AI IN EDUCATION RESEARCH PROTOTYPE · FULL STORY</text><rect x="28" y="116" width="426" height="222" rx="11" class="c"/><circle cx="62" cy="150" r="18" class="a"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">PURPOSE</text><text x="55" y="198" class="b"><tspan x="55">Which evidenced competency gaps should be</tspan><tspan x="55" dy="21">addressed first, and how should uncertainty</tspan><tspan x="55" dy="21">and prerequisites affect that priority?</tspan></text><rect x="487" y="116" width="426" height="222" rx="11" class="c"/><circle cx="521" cy="150" r="18" class="a"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">INPUTS / EVIDENCE</text><text x="514" y="198" class="b"><tspan x="514">Role requirements</tspan><tspan x="514" dy="21">Dated competency evidence</tspan><tspan x="514" dy="21">Confidence labels</tspan><tspan x="514" dy="21">Prerequisite + resource metadata</tspan></text><rect x="946" y="116" width="426" height="222" rx="11" class="c"/><circle cx="980" cy="150" r="18" class="a"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">CORE LOGIC</text><text x="973" y="198" class="b"><tspan x="973">Aggregate evidence with confidence weights</tspan><tspan x="973" dy="21">Keep missing/stale evidence visible</tspan><tspan x="973" dy="21">Calculate positive gaps × importance</tspan><tspan x="973" dy="21">Sequence around prerequisite blockers</tspan></text><rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">WHAT THE PROTOTYPE PRODUCES</text><text x="55" y="453" class="b"><tspan x="55">Observed level with provenance</tspan><tspan x="55" dy="23">Confirmed gap priorities</tspan><tspan x="55" dy="23">Development sequence</tspan><tspan x="55" dy="23">Resource matches + sensitivity</tspan></text><text x="55" y="583" class="m">Priority = max(target − observed, 0) × importance</text><text x="55" y="610" class="sm">Decision-support score; underlying competency ratings remain subjective</text><rect x="946" y="372" width="426" height="268" rx="11" class="w"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="b"><tspan x="973">Evidence scales are not validated measures.</tspan><tspan x="973" dy="23">Missing data must not be treated as low skill.</tspan><tspan x="973" dy="23">Priorities depend on declared importance and</tspan><tspan x="973" dy="23">confidence assumptions.</tspan></text><text x="28" y="728" class="sm">Best use: make competency decisions auditable by keeping evidence, uncertainty and sequencing rules explicit.</text></svg>