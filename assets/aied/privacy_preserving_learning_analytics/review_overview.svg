<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc"><title id="title">Privacy-Preserving Learning Analytics — full project story</title><desc id="desc">Purpose, inputs, method, outputs and interpretation limits for this AI in Education research prototype.</desc><rect width="1400" height="788" fill="#F8FAFC"/><style>.title{font:700 37px Georgia,serif;fill:#173A63}.sub{font:600 14px Arial,sans-serif;fill:#5D6D7A;letter-spacing:3px}.h{font:700 17px Arial,sans-serif;fill:#173A63}.body{font:14px Arial,sans-serif;fill:#243744}.small{font:12px Arial,sans-serif;fill:#60717D}.card{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.soft{fill:#EAF2F8;stroke:#3D6B8A;stroke-width:1.2}.warn{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.accent{fill:#3D6B8A}.metric{font:700 20px Georgia,serif;fill:#3D6B8A}</style><text x="700" y="48" text-anchor="middle" class="title">Privacy-Preserving Learning Analytics</text><text x="700" y="80" text-anchor="middle" class="sub">AI IN EDUCATION RESEARCH PROTOTYPE · FULL STORY</text>
<rect x="28" y="116" width="426" height="222" rx="11" class="card"/><circle cx="62" cy="150" r="18" class="accent"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">PURPOSE</text><text x="55" y="198" class="body"><tspan x="55">Can model training keep synthetic learner</tspan><tspan x="55" dy="22">records local while exposing how clipping</tspan><tspan x="55" dy="22">and noise affect predictive utility?</tspan></text>
<rect x="487" y="116" width="426" height="222" rx="11" class="card"/><circle cx="521" cy="150" r="18" class="accent"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">INPUTS / EVIDENCE</text><text x="514" y="198" class="body"><tspan x="514">Synthetic learner shards</tspan><tspan x="514" dy="22">Local client data only</tspan><tspan x="514" dy="22">Shared model parameters</tspan><tspan x="514" dy="22">Separate synthetic test set</tspan></text>
<rect x="946" y="116" width="426" height="222" rx="11" class="card"/><circle cx="980" cy="150" r="18" class="accent"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">CORE LOGIC</text><text x="973" y="198" class="body"><tspan x="973">Compute local gradients</tspan><tspan x="973" dy="22">Clip updates before aggregation</tspan><tspan x="973" dy="22">Optionally add Gaussian noise</tspan><tspan x="973" dy="22">Weight and aggregate client updates</tspan></text>
<rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">WHAT THE PROTOTYPE PRODUCES</text><text x="55" y="453" class="body"><tspan x="55">Federated training trajectory</tspan><tspan x="55" dy="23">Utility comparison with and without noise</tspan><tspan x="55" dy="23">Inspectable client weighting and updates</tspan><tspan x="55" dy="23">No movement of raw shard records</tspan></text><text x="55" y="583" class="metric">Local data → clipped/noisy gradients → weighted aggregation</text><text x="55" y="610" class="small">Engineering privacy pattern; not formal differential privacy</text>
<rect x="946" y="372" width="426" height="268" rx="11" class="warn"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="body"><tspan x="973">No ε/δ privacy accounting is implemented.</tspan><tspan x="973" dy="23">Secure aggregation and threat-model tests</tspan><tspan x="973" dy="23">are outside scope. Synthetic locality alone</tspan><tspan x="973" dy="23">does not establish a privacy guarantee.</tspan></text>
<line x1="28" y1="699" x2="1372" y2="699" stroke="#D6E0E8"/><text x="28" y="728" class="small">Best use: demonstrate data-local training mechanics and utility sensitivity before adding formal privacy machinery.</text><text x="28" y="754" class="small">The diagram separates implemented computation from claims that still require authentic data and validation.</text></svg>