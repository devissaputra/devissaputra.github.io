<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788"><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia;fill:#173A63}.s{font:600 14px Arial;fill:#60717D;letter-spacing:3px}.h{font:700 17px Arial;fill:#173A63}.b{font:14px Arial;fill:#263846}.sm{font:12px Arial;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#9A5E55}.soft{fill:#F9EDEC;stroke:#9A5E55;stroke-width:1.2}.w{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.m{font:700 20px Georgia;fill:#9A5E55}</style><text x="700" y="48" text-anchor="middle" class="t">Engagement Early-Warning System</text><text x="700" y="80" text-anchor="middle" class="s">AI IN EDUCATION RESEARCH PROTOTYPE · FULL STORY</text><rect x="28" y="116" width="426" height="222" rx="11" class="c"/><circle cx="62" cy="150" r="18" class="a"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">PURPOSE</text><text x="55" y="198" class="b"><tspan x="55">What support signal is available at a fixed</tspan><tspan x="55" dy="21">prediction date without leaking information</tspan><tspan x="55" dy="21">from the future outcome window?</tspan></text><rect x="487" y="116" width="426" height="222" rx="11" class="c"/><circle cx="521" cy="150" r="18" class="a"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">INPUTS / EVIDENCE</text><text x="514" y="198" class="b"><tspan x="514">Synthetic dated activity history</tspan><tspan x="514" dy="21">Tasks + assessments before cutoff</tspan><tspan x="514" dy="21">Future outcome window</tspan><tspan x="514" dy="21">Transparent risk coefficients</tspan></text><rect x="946" y="116" width="426" height="222" rx="11" class="c"/><circle cx="980" cy="150" r="18" class="a"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">CORE LOGIC</text><text x="973" y="198" class="b"><tspan x="973">Construct features only from available history</tspan><tspan x="973" dy="21">Freeze prediction cutoff</tspan><tspan x="973" dy="21">Apply exposed logistic risk rule</tspan><tspan x="973" dy="21">Evaluate queue, calibration + subgroup checks</tspan></text><rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">WHAT THE PROTOTYPE PRODUCES</text><text x="55" y="453" class="b"><tspan x="55">Risk probability</tspan><tspan x="55" dy="23">Capacity-limited review queue</tspan><tspan x="55" dy="23">Calibration diagnostics</tspan><tspan x="55" dy="23">Time-boundary audit</tspan></text><text x="55" y="583" class="m">Risk = 1 / (1 + exp(−z))</text><text x="55" y="610" class="sm">Synthetic transparent model; coefficients are not externally validated</text><rect x="946" y="372" width="426" height="268" rx="11" class="w"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="b"><tspan x="973">The code demonstrates leakage control.</tspan><tspan x="973" dy="23">It does not show real-world predictive validity.</tspan><tspan x="973" dy="23">A risk score should trigger support review,</tspan><tspan x="973" dy="23">not punitive action.</tspan></text><text x="28" y="728" class="sm">Best use: prototype time-safe early-warning architecture before fitting and validating a real learner model.</text></svg>