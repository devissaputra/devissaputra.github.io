<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788"><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia;fill:#173A63}.s{font:600 14px Arial;fill:#60717D;letter-spacing:3px}.h{font:700 15px Arial;fill:#173A63}.b{font:13px Arial;fill:#263846}.sm{font:12px Arial;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#9A5E55}.n{fill:#F9EDEC;stroke:#9A5E55;stroke-width:1.2}.ar{stroke:#9A5E55;stroke-width:2.3;fill:none;marker-end:url(#x)}</style><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9A5E55"/></marker></defs><text x="700" y="48" text-anchor="middle" class="t">Engagement Early-Warning System</text><text x="700" y="80" text-anchor="middle" class="s">DATA PROCESSING + DECISION WORKFLOW</text><rect x="28" y="138" width="200" height="385" rx="10" class="c"/><circle cx="58" cy="170" r="18" class="a"/><text x="58" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="48" y="214" class="h"><tspan x="48">CUTOFF</tspan></text><text x="48" y="282" class="b"><tspan x="48">Prediction date</tspan><tspan x="48" dy="21">Eligible learners</tspan><tspan x="48" dy="21">Freeze time</tspan></text><path d="M228 330 H246" class="ar"/><rect x="252" y="138" width="200" height="385" rx="10" class="c"/><circle cx="282" cy="170" r="18" class="a"/><text x="282" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="272" y="214" class="h"><tspan x="272">HISTORY</tspan></text><text x="272" y="282" class="b"><tspan x="272">Only prior events</tspan><tspan x="272" dy="21">Tasks</tspan><tspan x="272" dy="21">Assessments</tspan></text><path d="M452 330 H470" class="ar"/><rect x="476" y="138" width="200" height="385" rx="10" class="c"/><circle cx="506" cy="170" r="18" class="a"/><text x="506" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="496" y="214" class="h"><tspan x="496">FEATURES</tspan></text><text x="496" y="282" class="b"><tspan x="496">Time-safe aggregates</tspan><tspan x="496" dy="21">Missingness</tspan><tspan x="496" dy="21">No future data</tspan></text><path d="M676 330 H694" class="ar"/><rect x="700" y="138" width="200" height="385" rx="10" class="c"/><circle cx="730" cy="170" r="18" class="a"/><text x="730" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">4</text><text x="720" y="214" class="h"><tspan x="720">RISK</tspan></text><text x="720" y="282" class="b"><tspan x="720">Transparent z</tspan><tspan x="720" dy="21">Sigmoid</tspan><tspan x="720" dy="21">Probability</tspan></text><path d="M900 330 H918" class="ar"/><rect x="924" y="138" width="200" height="385" rx="10" class="c"/><circle cx="954" cy="170" r="18" class="a"/><text x="954" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">5</text><text x="944" y="214" class="h"><tspan x="944">QUEUE</tspan></text><text x="944" y="282" class="b"><tspan x="944">Capacity limit</tspan><tspan x="944" dy="21">Support review</tspan><tspan x="944" dy="21">Store rationale</tspan></text><path d="M1124 330 H1142" class="ar"/><rect x="1148" y="138" width="200" height="385" rx="10" class="c"/><circle cx="1178" cy="170" r="18" class="a"/><text x="1178" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">6</text><text x="1168" y="214" class="h"><tspan x="1168">AUDIT</tspan></text><text x="1168" y="282" class="b"><tspan x="1168">Calibration</tspan><tspan x="1168" dy="21">Subgroups</tspan><tspan x="1168" dy="21">Leakage checks</tspan></text><rect x="28" y="560" width="1344" height="122" rx="10" class="n"/><text x="50" y="598" class="h">KEY RULE / CALCULATION</text><text x="50" y="630" class="b"><tspan x="50">Build every predictor strictly from evidence dated at or before the cutoff;</tspan><tspan x="50" dy="21">z = intercept + Σ(coefficient × feature), then risk = sigmoid(z).</tspan></text><text x="28" y="736" class="sm">The future outcome window begins strictly after the prediction cutoff, making temporal leakage testable.</text></svg>