<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788"><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia;fill:#173A63}.s{font:600 14px Arial;fill:#60717D;letter-spacing:3px}.h{font:700 17px Arial;fill:#173A63}.b{font:14px Arial;fill:#263846}.sm{font:12px Arial;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#3F7B6D}.soft{fill:#EAF5F1;stroke:#3F7B6D;stroke-width:1.2}.w{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.m{font:700 20px Georgia;fill:#3F7B6D}</style><text x="700" y="48" text-anchor="middle" class="t">Learner Agency Simulator</text><text x="700" y="80" text-anchor="middle" class="s">AI IN EDUCATION RESEARCH PROTOTYPE · FULL STORY</text><rect x="28" y="116" width="426" height="222" rx="11" class="c"/><circle cx="62" cy="150" r="18" class="a"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">PURPOSE</text><text x="55" y="198" class="b"><tspan x="55">How do different support policies behave</tspan><tspan x="55" dy="21">when synthetic learners can request, accept</tspan><tspan x="55" dy="21">or decline assistance?</tspan></text><rect x="487" y="116" width="426" height="222" rx="11" class="c"/><circle cx="521" cy="150" r="18" class="a"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">INPUTS / EVIDENCE</text><text x="514" y="198" class="b"><tspan x="514">Synthetic learner states</tspan><tspan x="514" dy="21">Learner actions and preferences</tspan><tspan x="514" dy="21">System support actions</tspan><tspan x="514" dy="21">Seeded transition assumptions</tspan></text><rect x="946" y="116" width="426" height="222" rx="11" class="c"/><circle cx="980" cy="150" r="18" class="a"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">CORE LOGIC</text><text x="973" y="198" class="b"><tspan x="973">Simulate learner–system trajectories</tspan><tspan x="973" dy="21">Compare proactive vs requested support</tspan><tspan x="973" dy="21">Track acceptance + intervention burden</tspan><tspan x="973" dy="21">Run sensitivity scenarios</tspan></text><rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">WHAT THE PROTOTYPE PRODUCES</text><text x="55" y="453" class="b"><tspan x="55">State occupancy</tspan><tspan x="55" dy="23">Support acceptance and burden</tspan><tspan x="55" dy="23">Recovery + time to mastery</tspan><tspan x="55" dy="23">Policy comparisons across assumptions</tspan></text><text x="55" y="583" class="m">State occupancy = observations in state / all recorded states</text><text x="55" y="610" class="sm">Simulation summary, not an observed learner outcome</text><rect x="946" y="372" width="426" height="268" rx="11" class="w"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="b"><tspan x="973">Results follow the assumed transitions.</tspan><tspan x="973" dy="23">They do not validate agency or learning.</tspan><tspan x="973" dy="23">Policy conclusions may change when help-seeking</tspan><tspan x="973" dy="23">or persistence assumptions change.</tspan></text><text x="28" y="728" class="sm">Best use: stress-test support policies and assumptions before designing a human learner study.</text></svg>