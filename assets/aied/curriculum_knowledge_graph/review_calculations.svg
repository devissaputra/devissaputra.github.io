ill="#fff" font-family="Arial" font-weight="700">3</text><text x="496" y="214" class="h"><tspan x="496">VALIDATE</tspan></text><text x="496" y="282" class="b"><tspan x="496">Type semantics</tspan><tspan x="496" dy="21">Provenance</tspan><tspan x="496" dy="21">Unknown edges</tspan></text><path d="M676 330 H694" class="ar"/><rect x="700" y="138" width="200" height="385" rx="10" class="c"/><circle cx="730" cy="170" r="18" class="a"/><text x="730" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">4</text><text x="720" y="214" class="h"><tspan x="720">TRAVERSE</tspan></text><text x="720" y="282" class="b"><tspan x="720">Prerequisite paths</tspan><tspan x="720" dy="21">Reachability</tspan><tspan x="720" dy="21">Disconnected nodes</tspan></text><path d="M900 330 H918" class="ar"/><rect x="924" y="138" width="200" height="385" rx="10" class="c"/><circle cx="954" cy="170" r="18" class="a"/><text x="954" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">5</text><text x="944" y="214" class="h"><tspan x="944">CHECK</tspan></text><text x="944" y="282" class="b"><tspan x="944">Cycles</tspan><tspan x="944" dy="21">Coverage gaps</tspan><tspan x="944" dy="21">Missing relations</tspan></text><path d="M1124 330 H1142" class="ar"/><rect x="1148" y="138" width="200" height="385" rx="10" class="c"/><circle cx="1178" cy="170" r="18" class="a"/><text x="1178" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">6</text><text x="1168" y="214" class="h"><tspan x="1168">REPORT</tspan></text><text x="1168" y="282" class="b"><tspan x="1168">Graph queries</tspan><tspan x="1168" dy="21">Diagnostics</tspan><tspan x="1168" dy="21">Expert review</tspan></text><rect x="28" y="560" width="1344" height="122" rx="10" class="n"/><text x="50" y="598" class="h">KEY RULE / CALCULATION</text><text x="50" y="630" class="b"><tspan x="50">Validate entity and relation types, then traverse the graph for paths, cycles and disconnected nodes;</tspan><tspan x="50" dy="21">coverage = eligible entities with the required relation / all eligible entities.</tspan></text><text x="28" y="736" class="sm">The graph checks structural consistency; it cannot independently verify that a prerequisite or assessment relationship is educationally sound.</text></svg>