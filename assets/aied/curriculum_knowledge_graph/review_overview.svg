<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788"><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia;fill:#173A63}.s{font:600 14px Arial;fill:#60717D;letter-spacing:3px}.h{font:700 17px Arial;fill:#173A63}.b{font:14px Arial;fill:#263846}.sm{font:12px Arial;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#5C7B46}.soft{fill:#EEF5E9;stroke:#5C7B46;stroke-width:1.2}.w{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.m{font:700 20px Georgia;fill:#5C7B46}</style><text x="700" y="48" text-anchor="middle" class="t">Curriculum Knowledge Graph</text><text x="700" y="80" text-anchor="middle" class="s">AI IN EDUCATION RESEARCH PROTOTYPE · FULL STORY</text><rect x="28" y="116" width="426" height="222" rx="11" class="c"/><circle cx="62" cy="150" r="18" class="a"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">PURPOSE</text><text x="55" y="198" class="b"><tspan x="55">Where do prerequisite chains, disconnected</tspan><tspan x="55" dy="21">concepts and assessment-coverage gaps appear</tspan><tspan x="55" dy="21">in a curriculum structure?</tspan></text><rect x="487" y="116" width="426" height="222" rx="11" class="c"/><circle cx="521" cy="150" r="18" class="a"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">INPUTS / EVIDENCE</text><text x="514" y="198" class="b"><tspan x="514">Typed curriculum entities</tspan><tspan x="514" dy="21">Courses, concepts, outcomes</tspan><tspan x="514" dy="21">Assessments + resources</tspan><tspan x="514" dy="21">Provenance-labeled relations</tspan></text><rect x="946" y="116" width="426" height="222" rx="11" class="c"/><circle cx="980" cy="150" r="18" class="a"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">CORE LOGIC</text><text x="973" y="198" class="b"><tspan x="973">Validate relation semantics</tspan><tspan x="973" dy="21">Traverse prerequisite paths</tspan><tspan x="973" dy="21">Detect cycles + disconnected entities</tspan><tspan x="973" dy="21">Measure required-relation coverage</tspan></text><rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">WHAT THE PROTOTYPE PRODUCES</text><text x="55" y="453" class="b"><tspan x="55">Typed curriculum graph</tspan><tspan x="55" dy="23">Prerequisite paths + cycles</tspan><tspan x="55" dy="23">Disconnected-node diagnostics</tspan><tspan x="55" dy="23">Assessment coverage gaps</tspan></text><text x="55" y="583" class="m">Coverage = eligible entities with relation / all eligible entities</text><text x="55" y="610" class="sm">Structural coverage metric; not proof of pedagogical validity</text><rect x="946" y="372" width="426" height="268" rx="11" class="w"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="b"><tspan x="973">Graph quality depends on supplied relations.</tspan><tspan x="973" dy="23">A valid edge type can still be pedagogically wrong.</tspan><tspan x="973" dy="23">Expert review is required for meaning and</tspan><tspan x="973" dy="23">curriculum decisions.</tspan></text><text x="28" y="728" class="sm">Best use: make curriculum structure queryable and auditable while preserving provenance for every relationship.</text></svg>