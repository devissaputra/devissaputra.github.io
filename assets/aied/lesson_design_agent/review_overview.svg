<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788"><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia;fill:#173A63}.s{font:600 14px Arial;fill:#60717D;letter-spacing:3px}.h{font:700 17px Arial;fill:#173A63}.b{font:14px Arial;fill:#263846}.sm{font:12px Arial;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#7A5C9B}.soft{fill:#F3EEFA;stroke:#7A5C9B;stroke-width:1.2}.w{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.m{font:700 20px Georgia;fill:#7A5C9B}</style><text x="700" y="48" text-anchor="middle" class="t">Lesson Design Agent</text><text x="700" y="80" text-anchor="middle" class="s">AI IN EDUCATION RESEARCH PROTOTYPE · FULL STORY</text><rect x="28" y="116" width="426" height="222" rx="11" class="c"/><circle cx="62" cy="150" r="18" class="a"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">PURPOSE</text><text x="55" y="198" class="b"><tspan x="55">Can transparent instructional constraints</tspan><tspan x="55" dy="21">turn an objective into a structured lesson</tspan><tspan x="55" dy="21">plan that remains easy to audit?</tspan></text><rect x="487" y="116" width="426" height="222" rx="11" class="c"/><circle cx="521" cy="150" r="18" class="a"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">INPUTS / EVIDENCE</text><text x="514" y="198" class="b"><tspan x="514">Learning objective</tspan><tspan x="514" dy="21">Audience + modality</tspan><tspan x="514" dy="21">Duration and prerequisites</tspan><tspan x="514" dy="21">Assessment/accessibility context</tspan></text><rect x="946" y="116" width="426" height="222" rx="11" class="c"/><circle cx="980" cy="150" r="18" class="a"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">CORE LOGIC</text><text x="973" y="198" class="b"><tspan x="973">Validate the design brief</tspan><tspan x="973" dy="21">Match explicit objective verbs</tspan><tspan x="973" dy="21">Choose a cognitive-demand sequence</tspan><tspan x="973" dy="21">Allocate exact requested duration</tspan></text><rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">WHAT THE PROTOTYPE PRODUCES</text><text x="55" y="453" class="b"><tspan x="55">Structured lesson phases</tspan><tspan x="55" dy="23">Assessment-evidence prompt</tspan><tspan x="55" dy="23">Accessibility prompts</tspan><tspan x="55" dy="23">Missing-context review flags</tspan></text><text x="55" y="583" class="m">Σ phase minutes = requested lesson duration</text><text x="55" y="610" class="sm">Hard planning constraint enforced by the prototype</text><rect x="946" y="372" width="426" height="268" rx="11" class="w"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="b"><tspan x="973">Generated activities are proposals.</tspan><tspan x="973" dy="23">Verb rules can misread complex objectives.</tspan><tspan x="973" dy="23">An educator must judge content, pedagogy,</tspan><tspan x="973" dy="23">accessibility and local feasibility.</tspan></text><text x="28" y="728" class="sm">Best use: create an inspectable lesson-planning scaffold, not an autonomous instructional designer.</text></svg>