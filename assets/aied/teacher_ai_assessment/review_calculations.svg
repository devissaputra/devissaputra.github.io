<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc"><title id="title">Teacher–AI Assessment Studio — data processing workflow</title><desc id="desc">Step-by-step processing workflow and the main calculation or decision rule.</desc><rect width="1400" height="788" fill="#F8FAFC"/><style>.title{font:700 37px Georgia,serif;fill:#173A63}.sub{font:600 14px Arial,sans-serif;fill:#5D6D7A;letter-spacing:3px}.step{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.num{fill:#9A5A3A}.h{font:700 15px Arial,sans-serif;fill:#173A63}.body{font:13px Arial,sans-serif;fill:#263846}.small{font:12px Arial,sans-serif;fill:#60717D}.note{fill:#F9EEE8;stroke:#9A5A3A;stroke-width:1.2}.arrow{stroke:#9A5A3A;stroke-width:2.3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9A5A3A"/></marker></defs><text x="700" y="48" text-anchor="middle" class="title">Teacher–AI Assessment Studio</text><text x="700" y="80" text-anchor="middle" class="sub">DATA PROCESSING + DECISION WORKFLOW</text><rect x="28" y="138" width="200" height="385" rx="10" class="step"/><circle cx="58" cy="170" r="18" class="num"/><text x="58" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="48" y="214" class="h"><tspan x="48">PAIR SCORES</tspan></text><text x="48" y="282" class="body"><tspan x="48">Human ordinal score</tspan><tspan x="48" dy="21">AI ordinal score</tspan><tspan x="48" dy="21">AI uncertainty</tspan></text><path d="M228 330 H246" class="arrow"/><rect x="252" y="138" width="200" height="385" rx="10" class="step"/><circle cx="282" cy="170" r="18" class="num"/><text x="282" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="272" y="214" class="h"><tspan x="272">COMPARE</tspan></text><text x="272" y="282" class="body"><tspan x="272">Absolute gap</tspan><tspan x="272" dy="21">Exact agreement</tspan><tspan x="272" dy="21">Within-one</tspan></text><path d="M452 330 H470" class="arrow"/><rect x="476" y="138" width="200" height="385" rx="10" class="step"/><circle cx="506" cy="170" r="18" class="num"/><text x="506" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="496" y="214" class="h"><tspan x="496">AGREEMENT</tspan></text><text x="496" y="282" class="body"><tspan x="496">Quadratic kappa</tspan><tspan x="496" dy="21">Score marginals</tspan><tspan x="496" dy="21">Near misses</tspan></text><path d="M676 330 H694" class="arrow"/><rect x="700" y="138" width="200" height="385" rx="10" class="step"/><circle cx="730" cy="170" r="18" class="num"/><text x="730" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">4</text><text x="720" y="214" class="h"><tspan x="720">ROUTE</tspan></text><text x="720" y="282" class="body"><tspan x="720">Disagreement rule</tspan><tspan x="720" dy="21">Uncertainty rule</tspan><tspan x="720" dy="21">Review flag</tspan></text><path d="M900 330 H918" class="arrow"/><rect x="924" y="138" width="200" height="385" rx="10" class="step"/><circle cx="954" cy="170" r="18" class="num"/><text x="954" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">5</text><text x="944" y="214" class="h"><tspan x="944">AUDIT</tspan></text><text x="944" y="282" class="body"><tspan x="944">Store routing reason</tspan><tspan x="944" dy="21">Preserve both scores</tspan><tspan x="944" dy="21">Human resolution</tspan></text><path d="M1124 330 H1142" class="arrow"/><rect x="1148" y="138" width="200" height="385" rx="10" class="step"/><circle cx="1178" cy="170" r="18" class="num"/><text x="1178" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">6</text><text x="1168" y="214" class="h"><tspan x="1168">REPORT</tspan></text><text x="1168" y="282" class="body"><tspan x="1168">Review rate</tspan><tspan x="1168" dy="21">Agreement metrics</tspan><tspan x="1168" dy="21">Limits</tspan></text><rect x="28" y="560" width="1344" height="122" rx="10" class="note"/><text x="50" y="598" class="h">KEY RULE / CALCULATION</text><text x="50" y="630" class="body"><tspan x="50">Review = |human − AI| &gt; 1 OR uncertainty ≥ .28;</tspan><tspan x="50" dy="21">also report exact agreement, within-one agreement and quadratic kappa.</tspan></text><text x="28" y="736" class="small">A strong kappa can coexist with systematic scoring problems; the prototype treats agreement and correctness as separate questions.</text></svg>