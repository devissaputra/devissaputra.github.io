<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc"><title id="title">Learning Design Process Mining — full project story</title><desc id="desc">Purpose, inputs, method, outputs and interpretation limits for this AI in Education research prototype.</desc><rect width="1400" height="788" fill="#F8FAFC"/><style>.title{font:700 37px Georgia,serif;fill:#173A63}.sub{font:600 14px Arial,sans-serif;fill:#5D6D7A;letter-spacing:3px}.h{font:700 17px Arial,sans-serif;fill:#173A63}.body{font:14px Arial,sans-serif;fill:#243744}.small{font:12px Arial,sans-serif;fill:#60717D}.card{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.soft{fill:#E8F5EE;stroke:#2F7D55;stroke-width:1.2}.warn{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.accent{fill:#2F7D55}.metric{font:700 20px Georgia,serif;fill:#2F7D55}</style><text x="700" y="48" text-anchor="middle" class="title">Learning Design Process Mining</text><text x="700" y="80" text-anchor="middle" class="sub">AI IN EDUCATION RESEARCH PROTOTYPE · FULL STORY</text>
<rect x="28" y="116" width="426" height="222" rx="11" class="card"/><circle cx="62" cy="150" r="18" class="accent"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">PURPOSE</text><text x="55" y="198" class="body"><tspan x="55">What recurring workflow patterns appear in</tspan><tspan x="55" dy="22">instructional-design traces, and where do</tspan><tspan x="55" dy="22">stages repeat or vary across cases?</tspan></text>
<rect x="487" y="116" width="426" height="222" rx="11" class="card"/><circle cx="521" cy="150" r="18" class="accent"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">INPUTS / EVIDENCE</text><text x="514" y="198" class="body"><tspan x="514">Synthetic design event logs</tspan><tspan x="514" dy="22">Case IDs + ordered stages</tspan><tspan x="514" dy="22">Timestamped process traces</tspan><tspan x="514" dy="22">Defined stage vocabulary</tspan></text>
<rect x="946" y="116" width="426" height="222" rx="11" class="card"/><circle cx="980" cy="150" r="18" class="accent"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">CORE LOGIC</text><text x="973" y="198" class="body"><tspan x="973">Reconstruct each case trace</tspan><tspan x="973" dy="22">Count process variants and transitions</tspan><tspan x="973" dy="22">Estimate stage-level entropy</tspan><tspan x="973" dy="22">Calculate explicit repetition rate</tspan></text>
<rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">WHAT THE PROTOTYPE PRODUCES</text><text x="55" y="453" class="body"><tspan x="55">Most common process variants</tspan><tspan x="55" dy="23">Transition shares</tspan><tspan x="55" dy="23">Entropy by source stage</tspan><tspan x="55" dy="23">Repetition patterns for review</tspan></text><text x="55" y="583" class="metric">Repetition rate = repeated-stage events / events within a case</text><text x="55" y="610" class="small">Descriptive workflow signal; repetition may be productive revision</text>
<rect x="946" y="372" width="426" height="268" rx="11" class="warn"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="body"><tspan x="973">The event logs are synthetic.</tspan><tspan x="973" dy="23">Stage labels require domain justification.</tspan><tspan x="973" dy="23">A repeated stage is not automatically waste</tspan><tspan x="973" dy="23">or process failure.</tspan></text>
<line x1="28" y1="699" x2="1372" y2="699" stroke="#D6E0E8"/><text x="28" y="728" class="small">Best use: make instructional-design workflow structure visible before interpreting efficiency or quality.</text><text x="28" y="754" class="small">The diagram separates implemented computation from claims that still require authentic data and validation.</text></svg>