<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc"><title id="title">Learning Design Process Mining — data processing workflow</title><desc id="desc">Step-by-step processing workflow and the main calculation or decision rule.</desc><rect width="1400" height="788" fill="#F8FAFC"/><style>.title{font:700 37px Georgia,serif;fill:#173A63}.sub{font:600 14px Arial,sans-serif;fill:#5D6D7A;letter-spacing:3px}.step{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.num{fill:#2F7D55}.h{font:700 15px Arial,sans-serif;fill:#173A63}.body{font:13px Arial,sans-serif;fill:#263846}.small{font:12px Arial,sans-serif;fill:#60717D}.note{fill:#E8F5EE;stroke:#2F7D55;stroke-width:1.2}.arrow{stroke:#2F7D55;stroke-width:2.3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F7D55"/></marker></defs><text x="700" y="48" text-anchor="middle" class="title">Learning Design Process Mining</text><text x="700" y="80" text-anchor="middle" class="sub">DATA PROCESSING + DECISION WORKFLOW</text><rect x="28" y="138" width="200" height="385" rx="10" class="step"/><circle cx="58" cy="170" r="18" class="num"/><text x="58" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="48" y="214" class="h"><tspan x="48">EVENT LOG</tspan></text><text x="48" y="282" class="body"><tspan x="48">Case ID</tspan><tspan x="48" dy="21">Stage</tspan><tspan x="48" dy="21">Timestamp</tspan></text><path d="M228 330 H246" class="arrow"/><rect x="252" y="138" width="200" height="385" rx="10" class="step"/><circle cx="282" cy="170" r="18" class="num"/><text x="282" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="272" y="214" class="h"><tspan x="272">ORDER</tspan></text><text x="272" y="282" class="body"><tspan x="272">Sort within case</tspan><tspan x="272" dy="21">Build trace</tspan><tspan x="272" dy="21">Check stage labels</tspan></text><path d="M452 330 H470" class="arrow"/><rect x="476" y="138" width="200" height="385" rx="10" class="step"/><circle cx="506" cy="170" r="18" class="num"/><text x="506" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="496" y="214" class="h"><tspan x="496">VARIANTS</tspan></text><text x="496" y="282" class="body"><tspan x="496">Trace patterns</tspan><tspan x="496" dy="21">Variant counts</tspan><tspan x="496" dy="21">Common paths</tspan></text><path d="M676 330 H694" class="arrow"/><rect x="700" y="138" width="200" height="385" rx="10" class="step"/><circle cx="730" cy="170" r="18" class="num"/><text x="730" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">4</text><text x="720" y="214" class="h"><tspan x="720">TRANSITIONS</tspan></text><text x="720" y="282" class="body"><tspan x="720">Stage-to-stage counts</tspan><tspan x="720" dy="21">Transition shares</tspan><tspan x="720" dy="21">Source-stage entropy</tspan></text><path d="M900 330 H918" class="arrow"/><rect x="924" y="138" width="200" height="385" rx="10" class="step"/><circle cx="954" cy="170" r="18" class="num"/><text x="954" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">5</text><text x="944" y="214" class="h"><tspan x="944">REPETITION</tspan></text><text x="944" y="282" class="body"><tspan x="944">Repeated stages</tspan><tspan x="944" dy="21">Case-level rate</tspan><tspan x="944" dy="21">No waste assumption</tspan></text><path d="M1124 330 H1142" class="arrow"/><rect x="1148" y="138" width="200" height="385" rx="10" class="step"/><circle cx="1178" cy="170" r="18" class="num"/><text x="1178" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">6</text><text x="1168" y="214" class="h"><tspan x="1168">REPORT</tspan></text><text x="1168" y="282" class="body"><tspan x="1168">Variants</tspan><tspan x="1168" dy="21">Transition map</tspan><tspan x="1168" dy="21">Review questions</tspan></text><rect x="28" y="560" width="1344" height="122" rx="10" class="note"/><text x="50" y="598" class="h">KEY RULE / CALCULATION</text><text x="50" y="630" class="body"><tspan x="50">Reconstruct ordered traces by case; count stage transitions and variants;</tspan><tspan x="50" dy="21">repetition rate = repeated-stage events / all events within each case, then summarize across cases.</tspan></text><text x="28" y="736" class="small">Process-mining output is descriptive. Meaning comes from authentic logs and expert interpretation of why a stage repeated.</text></svg>