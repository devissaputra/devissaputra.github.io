<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788"><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia;fill:#173A63}.s{font:600 14px Arial;fill:#60717D;letter-spacing:3px}.h{font:700 17px Arial;fill:#173A63}.b{font:14px Arial;fill:#263846}.sm{font:12px Arial;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#3B6F8A}.soft{fill:#EAF2F7;stroke:#3B6F8A;stroke-width:1.2}.w{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.m{font:700 20px Georgia;fill:#3B6F8A}</style><text x="700" y="48" text-anchor="middle" class="t">Constructive Alignment Auditor</text><text x="700" y="80" text-anchor="middle" class="s">AI IN EDUCATION RESEARCH PROTOTYPE · FULL STORY</text><rect x="28" y="116" width="426" height="222" rx="11" class="c"/><circle cx="62" cy="150" r="18" class="a"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">PURPOSE</text><text x="55" y="198" class="b"><tspan x="55">Where do learning outcomes, activities and</tspan><tspan x="55" dy="21">assessments differ in cognitive demand or</tspan><tspan x="55" dy="21">content emphasis?</tspan></text><rect x="487" y="116" width="426" height="222" rx="11" class="c"/><circle cx="521" cy="150" r="18" class="a"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">INPUTS / EVIDENCE</text><text x="514" y="198" class="b"><tspan x="514">Synthetic curriculum components</tspan><tspan x="514" dy="21">Outcome/activity/assessment text</tspan><tspan x="514" dy="21">Explicit Bloom verb lexicon</tspan><tspan x="514" dy="21">Content-token sets</tspan></text><rect x="946" y="116" width="426" height="222" rx="11" class="c"/><circle cx="980" cy="150" r="18" class="a"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">CORE LOGIC</text><text x="973" y="198" class="b"><tspan x="973">Identify supported cognitive verbs</tspan><tspan x="973" dy="21">Compare inferred demand across components</tspan><tspan x="973" dy="21">Calculate content-term overlap</tspan><tspan x="973" dy="21">Flag mismatch or uncertainty for review</tspan></text><rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">WHAT THE PROTOTYPE PRODUCES</text><text x="55" y="453" class="b"><tspan x="55">Evidence-backed cognitive levels</tspan><tspan x="55" dy="23">Alignment review flags</tspan><tspan x="55" dy="23">Content-overlap signal</tspan><tspan x="55" dy="23">Human-readable rationale</tspan></text><text x="55" y="583" class="m">Content overlap = shared tokens / union of tokens</text><text x="55" y="610" class="sm">Transparent lexical signal; not a validated alignment score</text><rect x="946" y="372" width="426" height="268" rx="11" class="w"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="b"><tspan x="973">Lexical rules miss context and nuance.</tspan><tspan x="973" dy="23">Bloom level is not pedagogy quality.</tspan><tspan x="973" dy="23">Flags support expert review rather than</tspan><tspan x="973" dy="23">replace curriculum judgment.</tspan></text><text x="28" y="728" class="sm">Best use: help curriculum reviewers find alignment questions worth inspecting, with every rule exposed.</text></svg>