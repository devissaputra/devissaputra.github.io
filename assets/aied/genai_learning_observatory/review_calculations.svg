x="272" dy="21">Verification</tspan><tspan x="272" dy="21">Revision</tspan><tspan x="272" dy="21">Reflection</tspan></text><path d="M452 330 H470" class="arrow"/><rect x="476" y="138" width="200" height="385" rx="10" class="step"/><circle cx="506" cy="170" r="18" class="num"/><text x="506" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="496" y="214" class="h"><tspan x="496">FEATURES</tspan></text><text x="496" y="282" class="body"><tspan x="496">Per-session rates</tspan><tspan x="496" dy="21">Adoption rate</tspan><tspan x="496" dy="21">Intent diversity</tspan></text><path d="M676 330 H694" class="arrow"/><rect x="700" y="138" width="200" height="385" rx="10" class="step"/><circle cx="730" cy="170" r="18" class="num"/><text x="730" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">4</text><text x="720" y="214" class="h"><tspan x="720">AGGREGATE</tspan></text><text x="720" y="282" class="body"><tspan x="720">Session summaries</tspan><tspan x="720" dy="21">Equal session weights</tspan><tspan x="720" dy="21">Cohort table</tspan></text><path d="M900 330 H918" class="arrow"/><rect x="924" y="138" width="200" height="385" rx="10" class="step"/><circle cx="954" cy="170" r="18" class="num"/><text x="954" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">5</text><text x="944" y="214" class="h"><tspan x="944">SCORE</tspan></text><text x="944" y="282" class="body"><tspan x="944">Agency heuristic</tspan><tspan x="944" dy="21">Expose components</tspan><tspan x="944" dy="21">No hidden model</tspan></text><path d="M1124 330 H1142" class="arrow"/><rect x="1148" y="138" width="200" height="385" rx="10" class="step"/><circle cx="1178" cy="170" r="18" class="num"/><text x="1178" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">6</text><text x="1168" y="214" class="h"><tspan x="1168">REPORT</tspan></text><text x="1168" y="282" class="body"><tspan x="1168">Dashboard</tspan><tspan x="1168" dy="21">Machine-readable metrics</tspan><tspan x="1168" dy="21">Validation limits</tspan></text><rect x="28" y="560" width="1344" height="122" rx="10" class="note"/><text x="50" y="598" class="h">KEY RULE / CALCULATION</text><text x="50" y="630" class="body"><tspan x="50">Compute V, R, F and A within each session;</tspan><tspan x="50" dy="21">Agency index = .30V + .25R + .25F + .20(1-A).</tspan></text><text x="28" y="736" class="small">Session averages give each session equal weight; the weights are design choices, not estimated loadings.</text></svg>