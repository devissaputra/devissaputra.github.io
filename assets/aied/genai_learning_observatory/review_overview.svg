<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc"><title id="title">GenAI Learning Observatory — full project story</title><desc id="desc">Purpose, inputs, method, outputs and interpretation limits for this AI in Education research prototype.</desc><rect width="1400" height="788" fill="#F8FAFC"/><style>.title{font:700 37px Georgia,serif;fill:#173A63}.sub{font:600 14px Arial,sans-serif;fill:#5D6D7A;letter-spacing:3px}.h{font:700 17px Arial,sans-serif;fill:#173A63}.body{font:14px Arial,sans-serif;fill:#243744}.small{font:12px Arial,sans-serif;fill:#60717D}.card{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.soft{fill:#E8F5F4;stroke:#2B7A78;stroke-width:1.2}.warn{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.accent{fill:#2B7A78}.metric{font:700 20px Georgia,serif;fill:#2B7A78}</style><text x="700" y="48" text-anchor="middle" class="title">GenAI Learning Observatory</text><text x="700" y="80" text-anchor="middle" class="sub">AI IN EDUCATION RESEARCH PROTOTYPE · FULL STORY</text>
<rect x="28" y="116" width="426" height="222" rx="11" class="card"/><circle cx="62" cy="150" r="18" class="accent"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">PURPOSE</text><text x="55" y="198" class="body"><tspan x="55">How can AI-use logs show whether learners</tspan><tspan x="55" dy="22">verify, revise, reflect on or simply adopt</tspan><tspan x="55" dy="22">generated assistance?</tspan></text>
<rect x="487" y="116" width="426" height="222" rx="11" class="card"/><circle cx="521" cy="150" r="18" class="accent"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">INPUTS / EVIDENCE</text><text x="514" y="198" class="body"><tspan x="514">Synthetic prompt-event records</tspan><tspan x="514" dy="22">Learner + session identifiers</tspan><tspan x="514" dy="22">Rule-readable interaction text</tspan><tspan x="514" dy="22">No real learner claims</tspan></text>
<rect x="946" y="116" width="426" height="222" rx="11" class="card"/><circle cx="980" cy="150" r="18" class="accent"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">CORE LOGIC</text><text x="973" y="198" class="body"><tspan x="973">Tag interaction intent with explicit rules</tspan><tspan x="973" dy="22">Aggregate behavior within each session</tspan><tspan x="973" dy="22">Compute verification, revision, reflection</tspan><tspan x="973" dy="22">and answer-adoption rates</tspan></text>
<rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">WHAT THE PROTOTYPE PRODUCES</text><text x="55" y="453" class="body"><tspan x="55">Session-level behavior profiles</tspan><tspan x="55" dy="23">Cohort summaries and intent diversity</tspan><tspan x="55" dy="23">A transparent agency-oriented heuristic</tspan><tspan x="55" dy="23">with each component traceable to events</tspan></text><text x="55" y="583" class="metric">Agency index = .30V + .25R + .25F + .20(1-A)</text><text x="55" y="610" class="small">Weighted design heuristic; not a psychological instrument</text>
<rect x="946" y="372" width="426" height="268" rx="11" class="warn"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="body"><tspan x="973">The bundled records are synthetic.</tspan><tspan x="973" dy="23">Intent labels are lexical rules.</tspan><tspan x="973" dy="23">The agency index has no validated construct</tspan><tspan x="973" dy="23">interpretation and must not be used for</tspan><tspan x="973" dy="23">grading or diagnosis.</tspan></text>
<line x1="28" y1="699" x2="1372" y2="699" stroke="#D6E0E8"/><text x="28" y="728" class="small">Best use: test instrumentation and analysis logic before collecting consented learner–AI interaction data.</text><text x="28" y="754" class="small">The diagram separates implemented computation from claims that still require authentic data and validation.</text></svg>