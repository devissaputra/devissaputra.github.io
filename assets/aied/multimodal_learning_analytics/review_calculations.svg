<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788"><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia;fill:#173A63}.s{font:600 14px Arial;fill:#60717D;letter-spacing:3px}.h{font:700 15px Arial;fill:#173A63}.b{font:13px Arial;fill:#263846}.sm{font:12px Arial;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#287C83}.n{fill:#E8F5F5;stroke:#287C83;stroke-width:1.2}.ar{stroke:#287C83;stroke-width:2.3;fill:none;marker-end:url(#x)}</style><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#287C83"/></marker></defs><text x="700" y="48" text-anchor="middle" class="t">Multimodal Learning Analytics</text><text x="700" y="80" text-anchor="middle" class="s">DATA PROCESSING + DECISION WORKFLOW</text><rect x="28" y="138" width="200" height="385" rx="10" class="c"/><circle cx="58" cy="170" r="18" class="a"/><text x="58" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="48" y="214" class="h"><tspan x="48">IDENTIFY</tspan></text><text x="48" y="282" class="b"><tspan x="48">Learner ID</tspan><tspan x="48" dy="21">Session ID</tspan><tspan x="48" dy="21">Timestamp</tspan></text><path d="M228 330 H246" class="ar"/><rect x="252" y="138" width="200" height="385" rx="10" class="c"/><circle cx="282" cy="170" r="18" class="a"/><text x="282" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="272" y="214" class="h"><tspan x="272">WINDOW</tspan></text><text x="272" y="282" class="b"><tspan x="272">Fixed width</tspan><tspan x="272" dy="21">floor(t/width)</tspan><tspan x="272" dy="21">No cross-session merge</tspan></text><path d="M452 330 H470" class="ar"/><rect x="476" y="138" width="200" height="385" rx="10" class="c"/><circle cx="506" cy="170" r="18" class="a"/><text x="506" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="496" y="214" class="h"><tspan x="496">SPEECH</tspan></text><text x="496" y="282" class="b"><tspan x="496">Observed values</tspan><tspan x="496" dy="21">Window mean</tspan><tspan x="496" dy="21">Observed flag</tspan></text><path d="M676 330 H694" class="ar"/><rect x="700" y="138" width="200" height="385" rx="10" class="c"/><circle cx="730" cy="170" r="18" class="a"/><text x="730" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">4</text><text x="720" y="214" class="h"><tspan x="720">GAZE</tspan></text><text x="720" y="282" class="b"><tspan x="720">Observed values</tspan><tspan x="720" dy="21">Window mean</tspan><tspan x="720" dy="21">Observed flag</tspan></text><path d="M900 330 H918" class="ar"/><rect x="924" y="138" width="200" height="385" rx="10" class="c"/><circle cx="954" cy="170" r="18" class="a"/><text x="954" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">5</text><text x="944" y="214" class="h"><tspan x="944">CLICKS</tspan></text><text x="944" y="282" class="b"><tspan x="944">Event counts</tspan><tspan x="944" dy="21">Window sum</tspan><tspan x="944" dy="21">Observed flag</tspan></text><path d="M1124 330 H1142" class="ar"/><rect x="1148" y="138" width="200" height="385" rx="10" class="c"/><circle cx="1178" cy="170" r="18" class="a"/><text x="1178" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">6</text><text x="1168" y="214" class="h"><tspan x="1168">FUSE</tspan></text><text x="1168" y="282" class="b"><tspan x="1168">One window row</tspan><tspan x="1168" dy="21">Missing explicit</tspan><tspan x="1168" dy="21">Downstream-ready</tspan></text><rect x="28" y="560" width="1344" height="122" rx="10" class="n"/><text x="50" y="598" class="h">KEY RULE / CALCULATION</text><text x="50" y="630" class="b"><tspan x="50">Assign events to fixed windows within learner/session;</tspan><tspan x="50" dy="21">speech and gaze use means, clicks use sums, with separate observed flags.</tspan></text><text x="28" y="736" class="sm">Explicit missingness prevents an unavailable sensor stream from being silently interpreted as zero.</text></svg>