<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788"><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia;fill:#173A63}.s{font:600 14px Arial;fill:#60717D;letter-spacing:3px}.h{font:700 17px Arial;fill:#173A63}.b{font:14px Arial;fill:#263846}.sm{font:12px Arial;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#6E5790}.soft{fill:#F1EDFA;stroke:#6E5790;stroke-width:1.2}.w{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.m{font:700 20px Georgia;fill:#6E5790}</style><text x="700" y="48" text-anchor="middle" class="t">Self-Regulated Learning Copilot</text><text x="700" y="80" text-anchor="middle" class="s">AI IN EDUCATION RESEARCH PROTOTYPE · FULL STORY</text><rect x="28" y="116" width="426" height="222" rx="11" class="c"/><circle cx="62" cy="150" r="18" class="a"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">PURPOSE</text><text x="55" y="198" class="b"><tspan x="55">When should a support system offer help,</tspan><tspan x="55" dy="21">delay it or respect a learner's decision</tspan><tspan x="55" dy="21">to continue independently?</tspan></text><rect x="487" y="116" width="426" height="222" rx="11" class="c"/><circle cx="521" cy="150" r="18" class="a"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">INPUTS / EVIDENCE</text><text x="514" y="198" class="b"><tspan x="514">Supplied learning state</tspan><tspan x="514" dy="21">Plans + progress</tspan><tspan x="514" dy="21">Preferences + help requests</tspan><tspan x="514" dy="21">Prompt/reflection history</tspan></text><rect x="946" y="116" width="426" height="222" rx="11" class="c"/><circle cx="980" cy="150" r="18" class="a"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">CORE LOGIC</text><text x="973" y="198" class="b"><tspan x="973">Check planning completeness and struggle rules</tspan><tspan x="973" dy="21">Preserve explicit requests/refusals</tspan><tspan x="973" dy="21">Limit prompt burden</tspan><tspan x="973" dy="21">Connect reflection to later strategy choices</tspan></text><rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">WHAT THE PROTOTYPE PRODUCES</text><text x="55" y="453" class="b"><tspan x="55">Offer / delay / withhold decision</tspan><tspan x="55" dy="23">Transparent reason</tspan><tspan x="55" dy="23">Prompt-burden control</tspan><tspan x="55" dy="23">Reflection and strategy trace</tspan></text><text x="55" y="583" class="m">Plan completeness = present planning fields / 4</text><text x="55" y="610" class="sm">Operational completeness rule, not a validated SRL measure</text><rect x="946" y="372" width="426" height="268" rx="11" class="w"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="b"><tspan x="973">Examples are synthetic.</tspan><tspan x="973" dy="23">Struggle and plan labels are operational.</tspan><tspan x="973" dy="23">The system does not diagnose self-regulation</tspan><tspan x="973" dy="23">or override learner autonomy.</tspan></text><text x="28" y="728" class="sm">Best use: inspect autonomy-preserving support rules before testing a copilot with consented learners.</text></svg>