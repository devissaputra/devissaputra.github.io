<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc"><title id="title">Hybrid Intelligence Lab — full project story</title><desc id="desc">Purpose, inputs, method, outputs and interpretation limits for this AI in Education research prototype.</desc><rect width="1400" height="788" fill="#F8FAFC"/><style>.title{font:700 37px Georgia,serif;fill:#173A63}.sub{font:600 14px Arial,sans-serif;fill:#5D6D7A;letter-spacing:3px}.h{font:700 17px Arial,sans-serif;fill:#173A63}.body{font:14px Arial,sans-serif;fill:#243744}.small{font:12px Arial,sans-serif;fill:#60717D}.card{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.soft{fill:#FFF1E4;stroke:#B56B2D;stroke-width:1.2}.warn{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.accent{fill:#B56B2D}.metric{font:700 20px Georgia,serif;fill:#B56B2D}</style><text x="700" y="48" text-anchor="middle" class="title">Hybrid Intelligence Lab</text><text x="700" y="80" text-anchor="middle" class="sub">AI IN EDUCATION RESEARCH PROTOTYPE · FULL STORY</text>
<rect x="28" y="116" width="426" height="222" rx="11" class="card"/><circle cx="62" cy="150" r="18" class="accent"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">PURPOSE</text><text x="55" y="198" class="body"><tspan x="55">When can confidence-aware routing combine</tspan><tspan x="55" dy="22">human and AI decisions better than always</tspan><tspan x="55" dy="22">using either source alone?</tspan></text>
<rect x="487" y="116" width="426" height="222" rx="11" class="card"/><circle cx="521" cy="150" r="18" class="accent"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">INPUTS / EVIDENCE</text><text x="514" y="198" class="body"><tspan x="514">Synthetic human decisions</tspan><tspan x="514" dy="22">Synthetic AI decisions</tspan><tspan x="514" dy="22">Confidence values</tspan><tspan x="514" dy="22">Known simulated correctness</tspan></text>
<rect x="946" y="116" width="426" height="222" rx="11" class="card"/><circle cx="980" cy="150" r="18" class="accent"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">CORE LOGIC</text><text x="973" y="198" class="body"><tspan x="973">Measure complementary errors</tspan><tspan x="973" dy="22">Keep agreements</tspan><tspan x="973" dy="22">Route disagreements by confidence gap</tspan><tspan x="973" dy="22">Default to human when gap is small</tspan></text>
<rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">WHAT THE PROTOTYPE PRODUCES</text><text x="55" y="453" class="body"><tspan x="55">Human, AI and hybrid accuracy</tspan><tspan x="55" dy="23">Complementarity rate</tspan><tspan x="55" dy="23">Deferral and override diagnostics</tspan><tspan x="55" dy="23">Threshold sensitivity</tspan></text><text x="55" y="583" class="metric">Complementarity = mean(human_correct XOR AI_correct)</text><text x="55" y="610" class="small">High value means one source is often right when the other is wrong</text>
<rect x="946" y="372" width="426" height="268" rx="11" class="warn"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="body"><tspan x="973">Confidence is informative by construction.</tspan><tspan x="973" dy="23">That can make hybrid gains optimistic.</tspan><tspan x="973" dy="23">The simulation does not establish an optimal</tspan><tspan x="973" dy="23">policy for real classrooms.</tspan></text>
<line x1="28" y1="699" x2="1372" y2="699" stroke="#D6E0E8"/><text x="28" y="728" class="small">Best use: inspect routing logic and the conditions under which human–AI complementarity could matter.</text><text x="28" y="754" class="small">The diagram separates implemented computation from claims that still require authentic data and validation.</text></svg>