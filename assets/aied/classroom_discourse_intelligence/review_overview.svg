<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc"><title id="title">Classroom Discourse Intelligence — full project story</title><desc id="desc">Purpose, inputs, method, outputs and interpretation limits for this AI in Education research prototype.</desc><rect width="1400" height="788" fill="#F8FAFC"/><style>.title{font:700 37px Georgia,serif;fill:#173A63}.sub{font:600 14px Arial,sans-serif;fill:#5D6D7A;letter-spacing:3px}.h{font:700 17px Arial,sans-serif;fill:#173A63}.body{font:14px Arial,sans-serif;fill:#243744}.small{font:12px Arial,sans-serif;fill:#60717D}.card{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.soft{fill:#EAF2F8;stroke:#2F6EAA;stroke-width:1.2}.warn{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.accent{fill:#2F6EAA}.metric{font:700 20px Georgia,serif;fill:#2F6EAA}</style><text x="700" y="48" text-anchor="middle" class="title">Classroom Discourse Intelligence</text><text x="700" y="80" text-anchor="middle" class="sub">AI IN EDUCATION RESEARCH PROTOTYPE · FULL STORY</text>
<rect x="28" y="116" width="426" height="222" rx="11" class="card"/><circle cx="62" cy="150" r="18" class="accent"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">PURPOSE</text><text x="55" y="198" class="body"><tspan x="55">Can teacher talk moves in the TalkMoves</tspan><tspan x="55" dy="22">corpus be classified above a majority</tspan><tspan x="55" dy="22">baseline without transcript leakage?</tspan></text>
<rect x="487" y="116" width="426" height="222" rx="11" class="card"/><circle cx="521" cy="150" r="18" class="accent"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">INPUTS / EVIDENCE</text><text x="514" y="198" class="body"><tspan x="514">TalkMoves teacher utterances</tspan><tspan x="514" dy="22">565 transcript groups</tspan><tspan x="514" dy="22">175,129 labeled utterances</tspan><tspan x="514" dy="22">Group-aware held-out split</tspan></text>
<rect x="946" y="116" width="426" height="222" rx="11" class="card"/><circle cx="980" cy="150" r="18" class="accent"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">CORE LOGIC</text><text x="973" y="198" class="body"><tspan x="973">Remove duplicate transcript copies</tspan><tspan x="973" dy="22">Group matching transcript text before split</tspan><tspan x="973" dy="22">Fit TF–IDF + logistic regression</tspan><tspan x="973" dy="22">Compare with majority baseline</tspan></text>
<rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">WHAT THE PROTOTYPE PRODUCES</text><text x="55" y="453" class="body"><tspan x="55">Held-out macro-F1 and accuracy</tspan><tspan x="55" dy="23">Per-class classification evidence</tspan><tspan x="55" dy="23">A leakage-conscious baseline</tspan><tspan x="55" dy="23">113 held-out transcript groups</tspan></text><text x="55" y="583" class="metric">Macro-F1: 0.5198 logistic vs 0.1152 majority</text><text x="55" y="610" class="small">Accuracy is similar; macro-F1 reveals improved minority-class handling</text>
<rect x="946" y="372" width="426" height="268" rx="11" class="warn"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="body"><tspan x="973">The target is coded discourse moves.</tspan><tspan x="973" dy="23">It is not teaching quality, pedagogy quality</tspan><tspan x="973" dy="23">or student learning. Corpus labels and context</tspan><tspan x="973" dy="23">still constrain generalization.</tspan></text>
<line x1="28" y1="699" x2="1372" y2="699" stroke="#D6E0E8"/><text x="28" y="728" class="small">Unlike most repositories in this section, this card uses a real external corpus and reports a held-out empirical benchmark.</text><text x="28" y="754" class="small">The diagram separates implemented computation from claims that still require authentic data and validation.</text></svg>