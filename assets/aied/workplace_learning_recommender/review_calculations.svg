 y="214" class="h"><tspan x="496">CATALOG</tspan></text><text x="496" y="282" class="b"><tspan x="496">Resource metadata</tspan><tspan x="496" dy="21">Level coverage</tspan><tspan x="496" dy="21">Quality/effort</tspan></text><path d="M676 330 H694" class="ar"/><rect x="700" y="138" width="200" height="385" rx="10" class="c"/><circle cx="730" cy="170" r="18" class="a"/><text x="730" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">4</text><text x="720" y="214" class="h"><tspan x="720">FILTER</tspan></text><text x="720" y="282" class="b"><tspan x="720">Hard feasibility</tspan><tspan x="720" dy="21">Remove unusable</tspan><tspan x="720" dy="21">Keep reasons</tspan></text><path d="M900 330 H918" class="ar"/><rect x="924" y="138" width="200" height="385" rx="10" class="c"/><circle cx="954" cy="170" r="18" class="a"/><text x="954" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">5</text><text x="944" y="214" class="h"><tspan x="944">SCORE</tspan></text><text x="944" y="282" class="b"><tspan x="944">Gap coverage</tspan><tspan x="944" dy="21">Task fit</tspan><tspan x="944" dy="21">Quality</tspan><tspan x="944" dy="21">Effort</tspan></text><path d="M1124 330 H1142" class="ar"/><rect x="1148" y="138" width="200" height="385" rx="10" class="c"/><circle cx="1178" cy="170" r="18" class="a"/><text x="1178" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">6</text><text x="1168" y="214" class="h"><tspan x="1168">SENSITIVITY</tspan></text><text x="1168" y="282" class="b"><tspan x="1168">Vary weights</tspan><tspan x="1168" dy="21">Coverage check</tspan><tspan x="1168" dy="21">Rank stability</tspan></text><rect x="28" y="560" width="1344" height="122" rx="10" class="n"/><text x="50" y="598" class="h">KEY RULE / CALCULATION</text><text x="50" y="630" class="b"><tspan x="50">Filter on hard feasibility constraints; normalize declared weights;</tspan><tspan x="50" dy="21">resource score = Σ(weight × 