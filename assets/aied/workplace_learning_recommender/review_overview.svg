<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788"><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia;fill:#173A63}.s{font:600 14px Arial;fill:#60717D;letter-spacing:3px}.h{font:700 17px Arial;fill:#173A63}.b{font:14px Arial;fill:#263846}.sm{font:12px Arial;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#A1663F}.soft{fill:#FAEFE8;stroke:#A1663F;stroke-width:1.2}.w{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.m{font:700 20px Georgia;fill:#A1663F}</style><text x="700" y="48" text-anchor="middle" class="t">Workplace Learning Recommender</text><text x="700" y="80" text-anchor="middle" class="s">AI IN EDUCATION RESEARCH PROTOTYPE · FULL STORY</text><rect x="28" y="116" width="426" height="222" rx="11" class="c"/><circle cx="62" cy="150" r="18" class="a"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">PURPOSE</text><text x="55" y="198" class="b"><tspan x="55">Which feasible learning resource best fits</tspan><tspan x="55" dy="21">a confirmed development need and the learner's</tspan><tspan x="55" dy="21">actual workplace context?</tspan></text><rect x="487" y="116" width="426" height="222" rx="11" class="c"/><circle cx="521" cy="150" r="18" class="a"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">INPUTS / EVIDENCE</text><text x="514" y="198" class="b"><tspan x="514">Confirmed competency gaps</tspan><tspan x="514" dy="21">Current + target level</tspan><tspan x="514" dy="21">Work context constraints</tspan><tspan x="514" dy="21">Structured resource catalog</tspan></text><rect x="946" y="116" width="426" height="222" rx="11" class="c"/><circle cx="980" cy="150" r="18" class="a"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">CORE LOGIC</text><text x="973" y="198" class="b"><tspan x="973">Filter infeasible resources first</tspan><tspan x="973" dy="21">Score remaining resources by declared factors</tspan><tspan x="973" dy="21">Expose every component contribution</tspan><tspan x="973" dy="21">Test coverage and weight sensitivity</tspan></text><rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">WHAT THE PROTOTYPE PRODUCES</text><text x="55" y="453" class="b"><tspan x="55">Ranked feasible resources</tspan><tspan x="55" dy="23">Gap-coverage estimate</tspan><tspan x="55" dy="23">Component-level rationale</tspan><tspan x="55" dy="23">Sensitivity to weight choices</tspan></text><text x="55" y="583" class="m">Resource score = Σ(normalized weight × component score)</text><text x="55" y="610" class="sm">Transparent ranking rule, not an estimate of learning impact</text><rect x="946" y="372" width="426" height="268" rx="11" class="w"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="b"><tspan x="973">Metadata quality drives the ranking.</tspan><tspan x="973" dy="23">Weights are policy choices.</tspan><tspan x="973" dy="23">A high score does not prove transfer, efficacy</tspan><tspan x="973" dy="23">or individual learning benefit.</tspan></text><text x="28" y="728" class="sm">Best use: turn confirmed needs into auditable resource recommendations without hiding the ranking assumptions.</text></svg>