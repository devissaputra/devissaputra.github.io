<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
<title id="title">Misconception Aware RAG Tutor, Empirical Study</title><desc id="desc">Study overview</desc>
<rect width="1400" height="788" fill="#F7F9FB"/>
<style>
.title{font-family:Georgia,serif;font-weight:700;fill:#173A63;font-size:38px}
.subtitle{font-family:Arial,sans-serif;fill:#173A63;font-size:15px;letter-spacing:4px}
.h{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:18px}
.h2{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:15px}
.txt{font-family:Arial,sans-serif;fill:#172533;font-size:14px}
.sm{font-family:Arial,sans-serif;fill:#5C6B78;font-size:12px}
.metric{font-family:Georgia,serif;font-weight:700;fill:#173A63;font-size:24px}
.card{fill:#FFFFFF;stroke:#C8D5E1;stroke-width:1.2}
.soft{fill:#EAF2F8;stroke:#D9E6F0;stroke-width:1}
</style>
<text x="700" y="50" text-anchor="middle" class="title">Misconception Aware RAG Tutor, Empirical Study</text>
<line x1="240" y1="78" x2="545" y2="78" stroke="#9DB5CB"/><line x1="855" y1="78" x2="1160" y2="78" stroke="#9DB5CB"/>
<text x="700" y="84" text-anchor="middle" class="subtitle">STUDY OVERVIEW</text>
<rect x="18" y="110" width="455" height="260" rx="10" class="card"/><circle cx="48" cy="140" r="19" fill="#173A63"/><text x="48" y="146" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">1</text><text x="82" y="146" class="h">RETRIEVAL QUESTION</text>
<text x="45" y="190" class="h"><tspan x="45">Does adding an observed wrong answer to a</tspan><tspan x="45" dy="23">science question improve retrieval of the</tspan><tspan x="45" dy="23">question&apos;s supporting evidence?</tspan></text>
<text x="45" y="300" class="sm"><tspan x="45">The empirical retrieval experiment is kept</tspan><tspan x="45" dy="18">separate from the tutoring prototype.</tspan></text>
<rect x="490" y="110" width="890" height="260" rx="10" class="card"/><circle cx="520" cy="140" r="19" fill="#173A63"/><text x="520" y="146" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">2</text><text x="554" y="146" class="h">SCIQ BENCHMARK AND CONDITIONS</text>
<rect x="530" y="205" width="150" height="92" rx="8" class="soft"/><text x="605" y="239" class="metric" text-anchor="middle">1,000</text><text x="605" y="263" class="h2" text-anchor="middle">test rows</text>
<rect x="690" y="205" width="150" height="92" rx="8" class="soft"/><text x="765" y="239" class="metric" text-anchor="middle">884</text><text x="765" y="263" class="h2" text-anchor="middle">eligible questions</text>
<rect x="850" y="205" width="150" height="92" rx="8" class="soft"/><text x="925" y="239" class="metric" text-anchor="middle">884</text><text x="925" y="263" class="h2" text-anchor="middle">support documents</text>
<rect x="1010" y="205" width="150" height="92" rx="8" class="soft"/><text x="1085" y="239" class="metric" text-anchor="middle">2,652</text><text x="1085" y="263" class="h2" text-anchor="middle">wrong-answer cases</text>
<text x="530" y="325" class="h2">Three frozen query conditions</text><text x="530" y="350" class="txt"><tspan x="530">Question only  |  question + observed wrong answer  |  question + shuffled wrong-answer</tspan><tspan x="530" dy="18">control</tspan></text>
<rect x="18" y="395" width="850" height="350" rx="10" class="card"/><circle cx="48" cy="425" r="19" fill="#173A63"/><text x="48" y="431" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">3</text><text x="82" y="431" class="h">MEAN RECIPROCAL RANK</text>
<line x1="75" y1="650" x2="765" y2="650" stroke="#C8D5E1"/>
<rect x="135" y="528" width="110" height="122" rx="3" fill="#173A63"/><text x="190" y="522" class="sm" text-anchor="middle">0.9472</text><text x="190" y="667" class="sm" text-anchor="middle"><tspan x="190">Question</tspan><tspan x="190" dy="12">only</tspan></text>
<rect x="365" y="545" width="110" height="105" rx="3" fill="#2F6EAA"/><text x="420" y="539" class="sm" text-anchor="middle">0.9433</text><text x="420" y="667" class="sm" text-anchor="middle"><tspan x="420">Observed</tspan><tspan x="420" dy="12">wrong answer</tspan></text>
<rect x="595" y="539" width="110" height="111" rx="3" fill="#6EA4D7"/><text x="650" y="533" class="sm" text-anchor="middle">0.9447</text><text x="650" y="667" class="sm" text-anchor="middle"><tspan x="650">Shuffled</tspan><tspan x="650" dy="12">control</tspan></text>
<text x="75" y="705" class="sm"><tspan x="75">Both kinds of query expansion reduce MRR relative to question-only</tspan><tspan x="75" dy="18">retrieval.</tspan></text>
<rect x="890" y="395" width="490" height="350" rx="10" class="card"/><circle cx="920" cy="425" r="19" fill="#173A63"/><text x="920" y="431" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">4</text><text x="954" y="431" class="h">WHAT THE COMPARISON SHOWS</text>
<circle cx="925" cy="490" r="10" fill="#2F8F72"/><path d="M 920 490 l4 5 l8 -10" stroke="white" stroke-width="2.5" fill="none"/><text x="950" y="484" class="txt"><tspan x="950">Observed wrong answer vs question only: Δ MRR</tspan><tspan x="950" dy="18">= −0.0039; 95% interval [−0.0077, −0.0002].</tspan></text>
<circle cx="925" cy="570" r="10" fill="#2F8F72"/><path d="M 920 570 l4 5 l8 -10" stroke="white" stroke-width="2.5" fill="none"/><text x="950" y="564" class="txt"><tspan x="950">Observed wrong answer vs shuffled control: Δ</tspan><tspan x="950" dy="18">MRR = −0.0014; 95% interval [−0.0057,</tspan><tspan x="950" dy="18">0.0027].</tspan></text>
<circle cx="925" cy="650" r="10" fill="#B94B55"/><path d="M 921 646 l8 8 M 929 646 l-8 8" stroke="white" stroke-width="2.5"/><text x="950" y="644" class="txt"><tspan x="950">No clear evidence of a distinct semantic</tspan><tspan x="950" dy="18">benefit from the actual wrong answer, and no</tspan><tspan x="950" dy="18">claim of improved learning.</tspan></text>
</svg>