<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc"><title id="title">Wrong Answer Conditioned Retrieval on SciQ — full study story</title><desc id="desc">Research question, dataset, study design, main result and interpretation boundary.</desc><rect width="1400" height="788" fill="#F8FAFC"/><style>.title{font:700 38px Georgia,serif;fill:#173A63}.sub{font:600 14px Arial,sans-serif;fill:#5B6B7A;letter-spacing:3px}.h{font:700 18px Arial,sans-serif;fill:#173A63}.body{font:14px Arial,sans-serif;fill:#21313E}.small{font:12px Arial,sans-serif;fill:#5D6A75}.metric{font:700 27px Georgia,serif;fill:#7651A6}.metricLabel{font:600 12px Arial,sans-serif;fill:#40505E}.card{fill:#FFF;stroke:#CBD6E0;stroke-width:1.4}.soft{fill:#F1ECF8;stroke:#7651A6;stroke-width:1}.flow{stroke:#8FA4B8;stroke-width:2;fill:none}.accent{fill:#7651A6}.warn{fill:#FFF7ED;stroke:#E7B06B;stroke-width:1.2}</style><text x="700" y="50" text-anchor="middle" class="title">Wrong Answer Conditioned Retrieval on SciQ</text><text x="700" y="82" text-anchor="middle" class="sub">EMPIRICAL STUDY · FULL STORY</text><rect x="28" y="118" width="425" height="230" rx="12" class="card"/><circle cx="62" cy="151" r="18" class="accent"/><text x="62" y="157" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="157" class="h">RESEARCH QUESTION</text><text x="55" y="198" class="body"><tspan x="55">Does adding the observed wrong answer to</tspan><tspan x="55" dy="23">a science question improve retrieval of the</tspan><tspan x="55" dy="23">question's supporting evidence, beyond the</tspan><tspan x="55" dy="23">effect of merely adding extra distractor text?</tspan></text><rect x="478" y="118" width="425" height="230" rx="12" class="card"/><circle cx="512" cy="151" r="18" class="accent"/><text x="512" y="157" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="544" y="157" class="h">DATA + DESIGN</text><text x="505" y="198" class="body"><tspan x="505">SciQ test split · 884 supported questions</tspan><tspan x="505" dy="22">884 support passages form the retrieval corpus</tspan><tspan x="505" dy="22">2,652 question × wrong-answer proxy cases</tspan><tspan x="505" dy="22">Frozen BM25 retrieval protocol</tspan></text><rect x="928" y="118" width="444" height="230" rx="12" class="card"/><circle cx="962" cy="151" r="18" class="accent"/><text x="962" y="157" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="994" y="157" class="h">ANALYTICAL LOGIC</text><text x="955" y="198" class="body"><tspan x="955">Compare question-only retrieval</tspan><tspan x="955" dy="22">Add the observed wrong answer</tspan><tspan x="955" dy="22">Add a shuffled wrong-answer control</tspan><tspan x="955" dy="22">Use paired question-block uncertainty</tspan></text><path d="M453 233 H478 M903 233 H928" class="flow"/><rect x="28" y="377" width="874" height="272" rx="12" class="soft"/><text x="55" y="415" class="h">WHAT THE STUDY FOUND</text><text x="65" y="476" class="metric">0.9472</text><text x="65" y="500" class="metricLabel">question-only MRR</text><text x="270" y="476" class="metric">0.9433</text><text x="270" y="500" class="metricLabel">observed wrong-answer MRR</text><text x="475" y="476" class="metric">0.9447</text><text x="475" y="500" class="metricLabel">shuffled-control MRR</text><text x="680" y="476" class="metric">−0.0039</text><text x="680" y="500" class="metricLabel">observed Δ MRR</text><text x="55" y="548" class="body"><tspan x="55">Appending the observed wrong answer slightly reduces retrieval quality, and its result is</tspan><tspan x="55" dy="22">not distinguishable from the shuffled lexical control. The empirical evidence therefore</tspan><tspan x="55" dy="22">supports a generic query-expansion cost rather than a misconception-specific benefit.</tspan></text><rect x="928" y="377" width="444" height="272" rx="12" class="warn"/><text x="955" y="415" class="h">INTERPRETATION BOUNDARY</text><text x="955" y="458" class="body"><tspan x="955">SciQ distractors are incorrect options,</tspan><tspan x="955" dy="23">not validated learner misconceptions.</tspan><tspan x="955" dy="23">The experiment evaluates retrieval only;</tspan><tspan x="955" dy="23">it does not show that the tutoring prototype</tspan><tspan x="955" dy="23">improves learning or feedback quality.</tspan></text><text x="55" y="704" class="small">Scientific source: SciQ test split from Allen Institute for AI, pinned to a frozen revision with byte-level verification.</text><line x1="28" y1="728" x2="1372" y2="728" stroke="#D7E0E8"/><text x="28" y="754" class="small">Designed for rapid professor review: question → evidence → analysis → result → limit.</text></svg>