<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
<title id="title">Misconception Aware RAG Tutor, Empirical Study</title><desc id="desc">Data processing and retrieval evaluation pipeline</desc>
<rect width="1400" height="788" fill="#F7F9FB"/>
<style>
.title{font-family:Georgia,serif;font-weight:700;fill:#173A63;font-size:38px}
.subtitle{font-family:Arial,sans-serif;fill:#173A63;font-size:15px;letter-spacing:4px}
.h{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:18px}
.h2{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:15px}
.txt{font-family:Arial,sans-serif;fill:#172533;font-size:14px}
.card{fill:#FFFFFF;stroke:#C8D5E1;stroke-width:1.2}
.flow{stroke:#173A63;stroke-width:2;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#173A63"/></marker></defs>
<text x="700" y="50" text-anchor="middle" class="title">Misconception Aware RAG Tutor, Empirical Study</text>
<line x1="240" y1="78" x2="545" y2="78" stroke="#9DB5CB"/><line x1="855" y1="78" x2="1160" y2="78" stroke="#9DB5CB"/>
<text x="700" y="84" text-anchor="middle" class="subtitle">DATA PROCESSING AND RETRIEVAL EVALUATION PIPELINE</text>
<rect x="16" y="125" width="180" height="390" rx="10" class="card"/><circle cx="42" cy="154" r="19" fill="#173A63"/><text x="42" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">1</text><text x="66" y="160" class="h2">SCIQ TEST</text><text x="36" y="205" class="txt">1,000 rows</text>
<rect x="210" y="125" width="180" height="390" rx="10" class="card"/><circle cx="236" cy="154" r="19" fill="#173A63"/><text x="236" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">2</text><text x="260" y="160" class="h2">FILTER</text><text x="230" y="205" class="txt">884 with support</text>
<rect x="404" y="125" width="180" height="390" rx="10" class="card"/><circle cx="430" cy="154" r="19" fill="#173A63"/><text x="430" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">3</text><text x="454" y="160" class="h2">CORPUS</text><text x="424" y="205" class="txt">884 support docs</text>
<rect x="598" y="125" width="180" height="390" rx="10" class="card"/><circle cx="624" cy="154" r="19" fill="#173A63"/><text x="624" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">4</text><text x="648" y="160" class="h2">QUERIES</text><text x="618" y="205" class="txt">3 variants</text>
<rect x="792" y="125" width="180" height="390" rx="10" class="card"/><circle cx="818" cy="154" r="19" fill="#173A63"/><text x="818" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">5</text><text x="842" y="160" class="h2">BM25</text><text x="812" y="205" class="txt">top 5 retrieval</text>
<rect x="986" y="125" width="180" height="390" rx="10" class="card"/><circle cx="1012" cy="154" r="19" fill="#173A63"/><text x="1012" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">6</text><text x="1036" y="160" class="h2">METRICS</text><text x="1006" y="205" class="txt">MRR + Recall</text>
<rect x="1180" y="125" width="180" height="390" rx="10" class="card"/><circle cx="1206" cy="154" r="19" fill="#173A63"/><text x="1206" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">7</text><text x="1230" y="160" class="h2">COMPARE</text><text x="1200" y="205" class="txt">question blocks</text>
<path d="M 196 330 L 208 330" class="flow"/><path d="M 390 330 L 402 330" class="flow"/><path d="M 584 330 L 596 330" class="flow"/><path d="M 778 330 L 790 330" class="flow"/><path d="M 972 330 L 984 330" class="flow"/><path d="M 1166 330 L 1178 330" class="flow"/>
<text x="34" y="270" class="txt"><tspan x="34">Fields: question,</tspan><tspan x="34" dy="20">distractors, correct</tspan><tspan x="34" dy="20">answer, support</tspan><tspan x="34" dy="20">paragraph</tspan></text>
<text x="228" y="270" class="txt"><tspan x="228">Drop rows without</tspan><tspan x="228" dy="20">support. Each</tspan><tspan x="228" dy="20">eligible question</tspan><tspan x="228" dy="20">contributes three</tspan><tspan x="228" dy="20">wrong-answer proxy</tspan><tspan x="228" dy="20">cases.</tspan></text>
<text x="422" y="270" class="txt"><tspan x="422">Each unique support</tspan><tspan x="422" dy="20">paragraph becomes</tspan><tspan x="422" dy="20">one retrieval</tspan><tspan x="422" dy="20">document. A</tspan><tspan x="422" dy="20">question&apos;s own</tspan><tspan x="422" dy="20">support is relevant.</tspan></text>
<text x="616" y="270" class="txt"><tspan x="616">Q1 question only</tspan><tspan x="616" dy="20">Q2 + observed wrong</tspan><tspan x="616" dy="20">answer</tspan><tspan x="616" dy="20">Q3 + shuffled</tspan><tspan x="616" dy="20">distractor</tspan></text>
<text x="810" y="270" class="txt"><tspan x="810">Frozen BM25</tspan><tspan x="810" dy="20">k1 = 1.5</tspan><tspan x="810" dy="20">b = 0.75</tspan><tspan x="810" dy="20">depth = 5</tspan></text>
<text x="1004" y="270" class="txt"><tspan x="1004">MRR</tspan><tspan x="1004" dy="20">Recall@1,3,5</tspan><tspan x="1004" dy="20">nDCG@5</tspan><tspan x="1004" dy="20">query length</tspan></text>
<text x="1198" y="270" class="txt"><tspan x="1198">3,000</tspan><tspan x="1198" dy="20">question-block</tspan><tspan x="1198" dy="20">bootstrap</tspan><tspan x="1198" dy="20">replicates</tspan><tspan x="1198" dy="20">paired deltas</tspan><tspan x="1198" dy="20">seed 20260925</tspan></text>
<rect x="16" y="555" width="1344" height="170" rx="10" class="card"/><text x="40" y="590" class="h">EVIDENCE BOUNDARY</text><text x="40" y="625" class="txt"><tspan x="40">SciQ distractors are incorrect answer options, not validated learner misconception labels. The shuffled condition is a negative</tspan><tspan x="40" dy="21">control for generic lexical expansion. The tutoring concept is not treated as evidence that retrieval changes learning outcomes.</tspan></text>
</svg>