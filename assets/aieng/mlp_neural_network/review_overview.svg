<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc"><title id="title">MLP vs Linear Baseline on Handwritten Digits — full benchmark story</title><desc id="desc">Engineering question, data, comparison, recorded result and interpretation limits.</desc><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia,serif;fill:#173A63}.s{font:600 14px Arial,sans-serif;fill:#60717D;letter-spacing:3px}.h{font:700 17px Arial,sans-serif;fill:#173A63}.b{font:14px Arial,sans-serif;fill:#263846}.sm{font:12px Arial,sans-serif;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#7A5797}.soft{fill:#F2EDFA;stroke:#7A5797;stroke-width:1.2}.w{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.m{font:700 25px Georgia,serif;fill:#7A5797}.ml{font:600 12px Arial,sans-serif;fill:#435563}</style>
<text x="700" y="48" text-anchor="middle" class="t">MLP vs Linear Baseline on Handwritten Digits</text><text x="700" y="80" text-anchor="middle" class="s">AI ENGINEERING · RECORDED BENCHMARK · FULL STORY</text>
<rect x="28" y="116" width="426" height="222" rx="11" class="c"/><circle cx="62" cy="150" r="18" class="a"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">ENGINEERING QUESTION</text><text x="55" y="198" class="b"><tspan x="55">Does a multilayer perceptron earn its added</tspan><tspan x="55" dy="22">nonlinear complexity against a strong linear</tspan><tspan x="55" dy="22">baseline on small handwritten digits?</tspan></text>
<rect x="487" y="116" width="426" height="222" rx="11" class="c"/><circle cx="521" cy="150" r="18" class="a"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">DATA + PROTOCOL</text><text x="514" y="198" class="b"><tspan x="514">scikit-learn digits dataset</tspan><tspan x="514" dy="22">1,797 images · 64 pixel inputs</tspan><tspan x="514" dy="22">1,347 train · 450 test</tspan><tspan x="514" dy="22">Shared stratified split · seed 42</tspan></text>
<rect x="946" y="116" width="426" height="222" rx="11" class="c"/><circle cx="980" cy="150" r="18" class="a"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">COMPARISON</text><text x="973" y="198" class="b"><tspan x="973">Standardize inputs</tspan><tspan x="973" dy="22">Multinomial logistic baseline</tspan><tspan x="973" dy="22">MLP: 128 → 64 hidden units</tspan><tspan x="973" dy="22">Compare accuracy + macro-F1</tspan></text>
<rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">RECORDED RESULT</text><text x="55" y="474" class="m">0.9778</text><text x="55" y="498" class="ml">logistic accuracy</text><text x="260" y="474" class="m">0.9578</text><text x="260" y="498" class="ml">MLP accuracy</text><text x="465" y="474" class="m">0.9776</text><text x="465" y="498" class="ml">logistic macro-F1</text><text x="670" y="474" class="m">29</text><text x="670" y="498" class="ml">MLP iterations</text><text x="55" y="548" class="b"><tspan x="55">The linear baseline wins on both accuracy and macro-F1. Keeping that result prevents the</tspan><tspan x="55" dy="22">neural network from being treated as superior by assumption and makes model complexity</tspan><tspan x="55" dy="22">something that must be justified by evidence.</tspan></text>
<rect x="946" y="372" width="426" height="268" rx="11" class="w"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="b"><tspan x="973">This is one seeded holdout.</tspan><tspan x="973" dy="23">Preprocessing and tuning choices affect the result.</tspan><tspan x="973" dy="23">It does not establish a universal architecture</tspan><tspan x="973" dy="23">ranking for handwritten-digit problems.</tspan></text>
<text x="28" y="728" class="sm">Negative result retained deliberately: more capacity did not buy better held-out performance under this protocol.</text></svg>