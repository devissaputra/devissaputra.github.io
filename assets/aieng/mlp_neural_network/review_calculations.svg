<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc"><title id="title">MLP vs Linear Baseline on Handwritten Digits — data processing workflow</title><desc id="desc">Step-by-step benchmark preparation, model fitting and evaluation.</desc><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia,serif;fill:#173A63}.s{font:600 14px Arial,sans-serif;fill:#60717D;letter-spacing:3px}.h{font:700 15px Arial,sans-serif;fill:#173A63}.b{font:13px Arial,sans-serif;fill:#263846}.sm{font:12px Arial,sans-serif;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#7A5797}.n{fill:#F2EDFA;stroke:#7A5797;stroke-width:1.2}.ar{stroke:#7A5797;stroke-width:2.3;fill:none;marker-end:url(#x)}</style><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7A5797"/></marker></defs>
<text x="700" y="48" text-anchor="middle" class="t">MLP vs Linear Baseline on Handwritten Digits</text><text x="700" y="80" text-anchor="middle" class="s">DATA PROCESSING + BENCHMARK WORKFLOW</text>
<rect x="28" y="138" width="200" height="385" rx="10" class="c"/><circle cx="58" cy="170" r="18" class="a"/><text x="58" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="48" y="214" class="h"><tspan x="48">LOAD</tspan></text><text x="48" y="282" class="b"><tspan x="48">1,797 digit images</tspan><tspan x="48" dy="21">8×8 pixels</tspan><tspan x="48" dy="21">10 classes</tspan></text><path d="M228 330 H246" class="ar"/><rect x="252" y="138" width="200" height="385" rx="10" class="c"/><circle cx="282" cy="170" r="18" class="a"/><text x="282" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="272" y="214" class="h"><tspan x="272">SPLIT</tspan></text><text x="272" y="282" class="b"><tspan x="272">75/25 stratified</tspan><tspan x="272" dy="21">Seed 42</tspan><tspan x="272" dy="21">Freeze test</tspan></text><path d="M452 330 H470" class="ar"/><rect x="476" y="138" width="200" height="385" rx="10" class="c"/><circle cx="506" cy="170" r="18" class="a"/><text x="506" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="496" y="214" class="h"><tspan x="496">SCALE</tspan></text><text x="496" y="282" class="b"><tspan x="496">Fit on train</tspan><tspan x="496" dy="21">Transform test</tspan><tspan x="496" dy="21">Shared inputs</tspan></text><path d="M676 330 H694" class="ar"/><rect x="700" y="138" width="200" height="385" rx="10" class="c"/><circle cx="730" cy="170" r="18" class="a"/><text x="730" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">4</text><text x="720" y="214" class="h"><tspan x="720">FIT LINEAR</tspan></text><text x="720" y="282" class="b"><tspan x="720">Multinomial logistic</tspan><tspan x="720" dy="21">Strong baseline</tspan><tspan x="720" dy="21">Same split</tspan></text><path d="M900 330 H918" class="ar"/><rect x="924" y="138" width="200" height="385" rx="10" class="c"/><circle cx="954" cy="170" r="18" class="a"/><text x="954" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">5</text><text x="944" y="214" class="h"><tspan x="944">FIT MLP</tspan></text><text x="944" y="282" class="b"><tspan x="944">128 hidden</tspan><tspan x="944" dy="21">64 hidden</tspan><tspan x="944" dy="21">Early stopping</tspan></text><path d="M1124 330 H1142" class="ar"/><rect x="1148" y="138" width="200" height="385" rx="10" class="c"/><circle cx="1178" cy="170" r="18" class="a"/><text x="1178" y="176" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">6</text><text x="1168" y="214" class="h"><tspan x="1168">COMPARE</tspan></text><text x="1168" y="282" class="b"><tspan x="1168">Accuracy</tspan><tspan x="1168" dy="21">Macro-F1</tspan><tspan x="1168" dy="21">Complexity vs gain</tspan></text>
<rect x="28" y="560" width="1344" height="122" rx="10" class="n"/><text x="50" y="598" class="h">KEY CALCULATION / DESIGN RULE</text><text x="50" y="630" class="b"><tspan x="50">Accuracy = correct predictions / n; macro-F1 = mean of class-wise F1 across all 10 digits.</tspan><tspan x="50" dy="21">Both models use the same stratified split and training-fitted scaling.</tspan></text><text x="28" y="736" class="sm">A baseline is useful only if it is allowed to win; this experiment keeps the linear victory instead of cherry-picking a neural-network success.</text></svg>