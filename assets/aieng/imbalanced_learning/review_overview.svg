<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc"><title id="title">Learning from Imbalanced Data — full benchmark story</title><desc id="desc">Engineering question, data, comparison, recorded result and interpretation limits.</desc><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia,serif;fill:#173A63}.s{font:600 14px Arial,sans-serif;fill:#60717D;letter-spacing:3px}.h{font:700 17px Arial,sans-serif;fill:#173A63}.b{font:14px Arial,sans-serif;fill:#263846}.sm{font:12px Arial,sans-serif;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#A65B45}.soft{fill:#FAECE8;stroke:#A65B45;stroke-width:1.2}.w{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.m{font:700 25px Georgia,serif;fill:#A65B45}.ml{font:600 12px Arial,sans-serif;fill:#435563}</style>
<text x="700" y="48" text-anchor="middle" class="t">Learning from Imbalanced Data</text><text x="700" y="80" text-anchor="middle" class="s">AI ENGINEERING · RECORDED BENCHMARK · FULL STORY</text>
<rect x="28" y="116" width="426" height="222" rx="11" class="c"/><circle cx="62" cy="150" r="18" class="a"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">ENGINEERING QUESTION</text><text x="55" y="198" class="b"><tspan x="55">What changes when minority recovery matters</tspan><tspan x="55" dy="22">and the same observations are modeled with</tspan><tspan x="55" dy="22">ordinary versus class-weighted methods?</tspan></text>
<rect x="487" y="116" width="426" height="222" rx="11" class="c"/><circle cx="521" cy="150" r="18" class="a"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">DATA + PROTOCOL</text><text x="514" y="198" class="b"><tspan x="514">Wisconsin Diagnostic Breast Cancer data</tspan><tspan x="514" dy="22">212 malignant + sampled 35 benign cases</tspan><tspan x="514" dy="22">Constructed minority scenario · seed 42</tspan><tspan x="514" dy="22">Stratified 70/30 train/test split</tspan></text>
<rect x="946" y="116" width="426" height="222" rx="11" class="c"/><circle cx="980" cy="150" r="18" class="a"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">COMPARISON</text><text x="973" y="198" class="b"><tspan x="973">Ordinary logistic regression</tspan><tspan x="973" dy="22">Class-weighted logistic regression</tspan><tspan x="973" dy="22">Class-weighted random forest</tspan><tspan x="973" dy="22">Compare ranking + threshold metrics</tspan></text>
<rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">RECORDED RESULT</text><text x="55" y="474" class="m">0.9091</text><text x="55" y="498" class="ml">logistic minority F1</text><text x="260" y="474" class="m">0.9565</text><text x="260" y="498" class="ml">weighted logistic F1</text><text x="465" y="474" class="m">1.0000</text><text x="465" y="498" class="ml">weighted RF F1</text><text x="670" y="474" class="m">35</text><text x="670" y="498" class="ml">minority cases total</text><text x="55" y="548" class="b"><tspan x="55">Weighting improves minority recovery for logistic regression on this split, while the</tspan><tspan x="55" dy="22">weighted forest records a perfect held-out score. The perfect result is retained because</tspan><tspan x="55" dy="22">its fragility is part of the engineering lesson, not something to hide.</tspan></text>
<rect x="946" y="372" width="426" height="268" rx="11" class="w"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="b"><tspan x="973">The imbalance is deliberately constructed.</tspan><tspan x="973" dy="23">Benign is the minority class here.</tspan><tspan x="973" dy="23">The minority test sample is very small, so</tspan><tspan x="973" dy="23">a perfect score is not clinical evidence.</tspan></text>
<text x="28" y="728" class="sm">Real observations are used, but the altered prevalence is methodological and must not be read as disease prevalence.</text></svg>