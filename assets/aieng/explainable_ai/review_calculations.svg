<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
<title id="title">Explainable AI: Model Dependence and Feature Governance</title><desc id="desc">DATA PROCESSING AND AUDIT PIPELINE</desc>
<rect width="1400" height="788" fill="#F7F9FB"/>

<style>
.title{font-family:Georgia,serif;font-weight:700;fill:#173A63;font-size:38px}
.subtitle{font-family:Arial,sans-serif;fill:#173A63;font-size:15px;letter-spacing:4px}
.h{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:18px}
.h2{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:15px}
.txt{font-family:Arial,sans-serif;fill:#172533;font-size:14px}
.sm{font-family:Arial,sans-serif;fill:#5C6B78;font-size:12px}
.metric{font-family:Georgia,serif;font-weight:700;fill:#173A63;font-size:24px}
.card{fill:#FFFFFF;stroke:#C8D5E1;stroke-width:1.2}
.soft{fill:#EAF2F8;stroke:#D9E6F0;stroke-width:1}
.warn{fill:#FFF0EF;stroke:#E7C2BE;stroke-width:1}
.good{fill:#EAF6F1;stroke:#C2DED3;stroke-width:1}
.flow{stroke:#173A63;stroke-width:2;fill:none;marker-end:url(#arrow)}
.axis{stroke:#8094A7;stroke-width:1.2}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#173A63"/></marker></defs>
<text x="700" y="50" text-anchor="middle" class="title">Explainable AI: Model Dependence and Feature Governance</text>
<line x1="230" y1="78" x2="540" y2="78" stroke="#9DB5CB"/><line x1="860" y1="78" x2="1170" y2="78" stroke="#9DB5CB"/>
<text x="700" y="84" text-anchor="middle" class="subtitle">DATA PROCESSING AND AUDIT PIPELINE</text>

<rect x="18" y="125" width="174" height="415" rx="10" class="card"/><circle cx="44" cy="154" r="19" fill="#173A63"/><text x="44" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">1</text><rect x="208" y="125" width="174" height="415" rx="10" class="card"/><circle cx="234" cy="154" r="19" fill="#173A63"/><text x="234" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">2</text><rect x="398" y="125" width="174" height="415" rx="10" class="card"/><circle cx="424" cy="154" r="19" fill="#173A63"/><text x="424" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">3</text><rect x="588" y="125" width="174" height="415" rx="10" class="card"/><circle cx="614" cy="154" r="19" fill="#173A63"/><text x="614" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">4</text><rect x="778" y="125" width="174" height="415" rx="10" class="card"/><circle cx="804" cy="154" r="19" fill="#173A63"/><text x="804" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">5</text><rect x="968" y="125" width="174" height="415" rx="10" class="card"/><circle cx="994" cy="154" r="19" fill="#173A63"/><text x="994" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">6</text><rect x="1158" y="125" width="224" height="415" rx="10" class="card"/><circle cx="1184" cy="154" r="19" fill="#173A63"/><text x="1184" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">7</text>
<text x="62" y="160" class="h2">UCI ADULT</text><text x="40" y="210" class="txt"><tspan x="40">48,842 records</tspan><tspan x="40" dy="20">Frozen archive hash</tspan><tspan x="40" dy="20">Income target</tspan></text>
<text x="252" y="160" class="h2">PARSE + CLEAN</text><text x="230" y="210" class="txt"><tspan x="230">Normalize targets</tspan><tspan x="230" dy="20">Treat ? as missing</tspan><tspan x="230" dy="20">Combine source files</tspan></text>
<text x="442" y="160" class="h2">GROUP SPLIT</text><text x="420" y="210" class="txt"><tspan x="420">Hash exact predictor</tspan><tspan x="420" dy="20">vectors before split</tspan><tspan x="420" dy="20">Train/test overlap = 0</tspan></text>
<text x="632" y="160" class="h2">PREPROCESS</text><text x="610" y="210" class="txt"><tspan x="610">Numeric median + scale</tspan><tspan x="610" dy="20">Categorical mode + one-hot</tspan><tspan x="610" dy="20">Training pipeline only</tspan></text>
<text x="822" y="160" class="h2">FIT 4 CONDITIONS</text><text x="800" y="210" class="txt"><tspan x="800">Logistic: all / excluded</tspan><tspan x="800" dy="20">RF: all / excluded</tspan><tspan x="800" dy="20">Race, sex excluded only</tspan><tspan x="800" dy="20">from model inputs</tspan></text>
<text x="1012" y="160" class="h2">EXPLAIN + EVALUATE</text><text x="990" y="210" class="txt"><tspan x="990">Held-out ROC-AUC</tspan><tspan x="990" dy="20">Permutation importance</tspan><tspan x="990" dy="20">Top-k stability</tspan><tspan x="990" dy="20">Error analysis</tspan></text>
<text x="1202" y="160" class="h2">SUBGROUP AUDIT</text><text x="1180" y="210" class="txt"><tspan x="1180">Race and sex</tspan><tspan x="1180" dy="20">descriptive metrics</tspan><tspan x="1180" dy="20">Repeated split</tspan><tspan x="1180" dy="20">feature-exclusion</tspan><tspan x="1180" dy="20">sensitivity</tspan></text>
<path d="M192 330 L205 330" class="flow"/><path d="M382 330 L395 330" class="flow"/><path d="M572 330 L585 330" class="flow"/><path d="M762 330 L775 330" class="flow"/><path d="M952 330 L965 330" class="flow"/><path d="M1142 330 L1155 330" class="flow"/>
<rect x="18" y="575" width="1364" height="150" rx="10" class="card"/><text x="42" y="610" class="h">SCIENTIFIC INTERPRETATION</text>
<text x="42" y="648" class="txt"><tspan x="42">Permutation importance asks how much held-out performance falls after a feature is shuffled. Correlated predictors can redistribute importance.</tspan><tspan x="42" dy="22">Protected-feature exclusion is a governance sensitivity analysis, not a causal explanation and not a fairness certificate.</tspan></text>

</svg>