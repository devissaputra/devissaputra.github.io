<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc"><title id="title">CNN vs Flattened Linear Baseline on Digits — full benchmark story</title><desc id="desc">Engineering question, data, comparison, recorded result and interpretation limits.</desc><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia,serif;fill:#173A63}.s{font:600 14px Arial,sans-serif;fill:#60717D;letter-spacing:3px}.h{font:700 17px Arial,sans-serif;fill:#173A63}.b{font:14px Arial,sans-serif;fill:#263846}.sm{font:12px Arial,sans-serif;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#2E778F}.soft{fill:#E8F4F7;stroke:#2E778F;stroke-width:1.2}.w{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.m{font:700 25px Georgia,serif;fill:#2E778F}.ml{font:600 12px Arial,sans-serif;fill:#435563}</style>
<text x="700" y="48" text-anchor="middle" class="t">CNN vs Flattened Linear Baseline on Digits</text><text x="700" y="80" text-anchor="middle" class="s">AI ENGINEERING · RECORDED BENCHMARK · FULL STORY</text>
<rect x="28" y="116" width="426" height="222" rx="11" class="c"/><circle cx="62" cy="150" r="18" class="a"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">ENGINEERING QUESTION</text><text x="55" y="198" class="b"><tspan x="55">Does preserving two-dimensional image</tspan><tspan x="55" dy="22">structure improve classification beyond a</tspan><tspan x="55" dy="22">flattened linear baseline on the same digits?</tspan></text>
<rect x="487" y="116" width="426" height="222" rx="11" class="c"/><circle cx="521" cy="150" r="18" class="a"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">DATA + PROTOCOL</text><text x="514" y="198" class="b"><tspan x="514">scikit-learn digits dataset</tspan><tspan x="514" dy="22">1,797 images · 8×8 grayscale</tspan><tspan x="514" dy="22">Shared stratified 75/25 split</tspan><tspan x="514" dy="22">Pixels scaled to [0,1]</tspan></text>
<rect x="946" y="116" width="426" height="222" rx="11" class="c"/><circle cx="980" cy="150" r="18" class="a"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">COMPARISON</text><text x="973" y="198" class="b"><tspan x="973">Flattened logistic regression baseline</tspan><tspan x="973" dy="22">Compact 6,090-parameter CNN</tspan><tspan x="973" dy="22">Adam · lr .003 · batch 64</tspan><tspan x="973" dy="22">14 fixed training epochs</tspan></text>
<rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">RECORDED RESULT</text><text x="55" y="474" class="m">0.9622</text><text x="55" y="498" class="ml">logistic accuracy</text><text x="260" y="474" class="m">0.9733</text><text x="260" y="498" class="ml">CNN accuracy</text><text x="465" y="474" class="m">+1.11 pp</text><text x="465" y="498" class="ml">accuracy difference</text><text x="670" y="474" class="m">6,090</text><text x="670" y="498" class="ml">CNN parameters</text><text x="55" y="548" class="b"><tspan x="55">The CNN records a modest held-out gain over the flattened baseline, consistent with a</tspan><tspan x="55" dy="22">benefit from preserving local spatial structure. The result is useful because the gain is</tspan><tspan x="55" dy="22">measured against a strong comparator rather than assumed from architecture alone.</tspan></text>
<rect x="946" y="372" width="426" height="268" rx="11" class="w"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="b"><tspan x="973">The gain comes from one split and one seed.</tspan><tspan x="973" dy="23">No uncertainty interval is claimed.</tspan><tspan x="973" dy="23">The result does not establish general CNN</tspan><tspan x="973" dy="23">superiority on image-recognition tasks.</tspan></text>
<text x="28" y="728" class="sm">The comparison is within this repository only; preprocessing differs from the separate MLP benchmark.</text></svg>