<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
<title id="title">Probability Calibration on UCI Bank Marketing</title><desc id="desc">DATA PROCESSING AND EVALUATION PIPELINE</desc>
<rect width="1400" height="788" fill="#F7F9FB"/>

<style>
.title{font-family:Georgia,serif;font-weight:700;fill:#173A63;font-size:38px}
.subtitle{font-family:Arial,sans-serif;fill:#173A63;font-size:15px;letter-spacing:4px}
.h{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:18px}
.h2{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:15px}
.txt{font-family:Arial,sans-serif;fill:#172533;font-size:14px}
.sm{font-family:Arial,sans-serif;fill:#5C6B78;font-size:12px}
.metric{font-family:Georgia,serif;font-weight:700;fill:#173A63;font-size:24px}
.card{fill:#FFFFFF;stroke:#C8D5E1;stroke-width:1.2}
.soft{fill:#EAF2F8;stroke:#D9E6F0;stroke-width:1}
.warn{fill:#FFF0EF;stroke:#E7C2BE;stroke-width:1}
.good{fill:#EAF6F1;stroke:#C2DED3;stroke-width:1}
.flow{stroke:#173A63;stroke-width:2;fill:none;marker-end:url(#arrow)}
.axis{stroke:#8094A7;stroke-width:1.2}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#173A63"/></marker></defs>
<text x="700" y="50" text-anchor="middle" class="title">Probability Calibration on UCI Bank Marketing</text>
<line x1="230" y1="78" x2="540" y2="78" stroke="#9DB5CB"/><line x1="860" y1="78" x2="1170" y2="78" stroke="#9DB5CB"/>
<text x="700" y="84" text-anchor="middle" class="subtitle">DATA PROCESSING AND EVALUATION PIPELINE</text>

<rect x="18" y="125" width="208" height="415" rx="10" class="card"/><circle cx="46" cy="154" r="19" fill="#173A63"/><text x="46" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">1</text><rect x="242" y="125" width="208" height="415" rx="10" class="card"/><circle cx="270" cy="154" r="19" fill="#173A63"/><text x="270" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">2</text><rect x="466" y="125" width="208" height="415" rx="10" class="card"/><circle cx="494" cy="154" r="19" fill="#173A63"/><text x="494" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">3</text><rect x="690" y="125" width="208" height="415" rx="10" class="card"/><circle cx="718" cy="154" r="19" fill="#173A63"/><text x="718" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">4</text><rect x="914" y="125" width="208" height="415" rx="10" class="card"/><circle cx="942" cy="154" r="19" fill="#173A63"/><text x="942" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">5</text><rect x="1138" y="125" width="244" height="415" rx="10" class="card"/><circle cx="1166" cy="154" r="19" fill="#173A63"/><text x="1166" y="160" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">6</text>
<text x="74" y="160" class="h2">UCI SOURCE</text><text x="42" y="210" class="txt"><tspan x="42">Official bank-full.csv</tspan><tspan x="42" dy="20">SHA-256 validated</tspan><tspan x="42" dy="20">45,211 rows</tspan><tspan x="42" dy="20">16 predictors</tspan></text>
<text x="298" y="160" class="h2">PREPROCESSING</text><text x="266" y="210" class="txt"><tspan x="266">Numeric: median + scale</tspan><tspan x="266" dy="20">Categorical: mode + one-hot</tspan><tspan x="266" dy="20">Fit inside training pipeline</tspan></text>
<text x="522" y="160" class="h2">HOLDOUTS</text><text x="490" y="210" class="txt"><tspan x="490">Five stratified 80/20 splits</tspan><tspan x="490" dy="20">Seeds 13, 29, 42, 73, 101</tspan><tspan x="490" dy="20">Test data untouched</tspan></text>
<text x="746" y="160" class="h2">MODELS</text><text x="714" y="210" class="txt"><tspan x="714">Class prior</tspan><tspan x="714" dy="20">Logistic uncalibrated</tspan><tspan x="714" dy="20">Sigmoid calibration</tspan><tspan x="714" dy="20">Isotonic calibration</tspan></text>
<text x="970" y="160" class="h2">METRICS</text><text x="938" y="210" class="txt"><tspan x="938">ROC-AUC</tspan><tspan x="938" dy="20">Average precision</tspan><tspan x="938" dy="20">Brier score</tspan><tspan x="938" dy="20">Log loss</tspan><tspan x="938" dy="20">ECE-10</tspan></text>
<text x="1194" y="160" class="h2">SENSITIVITY</text><text x="1162" y="210" class="txt"><tspan x="1162">Duration ablation</tspan><tspan x="1162" dy="20">ECE-bin sensitivity</tspan><tspan x="1162" dy="20">Calibration-CV sensitivity</tspan><tspan x="1162" dy="20">Repeated split summary</tspan></text>
<path d="M226 330 L239 330" class="flow"/><path d="M450 330 L463 330" class="flow"/><path d="M674 330 L687 330" class="flow"/><path d="M898 330 L911 330" class="flow"/><path d="M1122 330 L1135 330" class="flow"/>
<rect x="18" y="575" width="1364" height="150" rx="10" class="card"/><text x="42" y="610" class="h">INTERPRETATION BOUNDARY</text>
<text x="42" y="648" class="txt"><tspan x="42">Brier and log loss evaluate probability quality; ROC-AUC evaluates ranking. ECE depends on the binning scheme.</tspan><tspan x="42" dy="22">Because the five holdouts overlap, split-level bootstrap intervals are descriptive rather than independent-sample inference.</tspan></text>

</svg>