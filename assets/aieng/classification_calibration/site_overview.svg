<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Probability Calibration for AI Engineering</title>
  <desc id="d">Scientific overview of the UCI Bank Marketing probability calibration study, including dataset, comparison models, repeated holdout results, and validity checks.</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#0b2a55"/><stop offset=".55" stop-color="#164d8f"/><stop offset="1" stop-color="#5b3fd3"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17324f" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#f5f8fc"/>
  <rect width="1600" height="112" fill="url(#head)"/>
  <text x="54" y="58" font-family="Arial,Helvetica,sans-serif" font-size="43" fill="#ffffff" font-weight="700" text-anchor="start">Probability Calibration for AI Engineering</text>
  <text x="56" y="91" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#dcecff" font-weight="400" text-anchor="start">Do predicted probabilities correspond to observed outcomes?</text>
  <text x="1538" y="50" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#c7f0ff" font-weight="700" text-anchor="end">EMPIRICAL STUDY</text>
  <text x="1538" y="78" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="end">UCI Bank Marketing · frozen protocol</text>
  <rect x="42" y="140" width="430" height="590" rx="22" fill="#ffffff" stroke="#c9d7e8" stroke-width="2"/>
  <text x="72" y="185" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#174f91" font-weight="700" text-anchor="start">1  The research problem</text>
  <text x="72" y="224" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#34465c" font-weight="400" text-anchor="start">A classifier can rank cases well and still assign</text><text x="72" y="252" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#34465c" font-weight="400" text-anchor="start">probabilities that are too high or too low.</text><text x="72" y="280" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#34465c" font-weight="400" text-anchor="start">This study tests whether post-hoc calibration makes</text><text x="72" y="308" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#34465c" font-weight="400" text-anchor="start">those probabilities more trustworthy.</text>
  <rect x="72" y="350" width="370" height="172" rx="16" fill="#eef6ff" stroke="#b7d2f3" stroke-width="1.5"/>
  <text x="94" y="385" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#183153" font-weight="700" text-anchor="start">UCI Bank Marketing</text>
  <text x="94" y="419" font-family="Arial,Helvetica,sans-serif" font-size="35" fill="#1f5fbf" font-weight="700" text-anchor="start">45,211</text>
  <text x="220" y="419" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#52657a" font-weight="400" text-anchor="start">rows</text>
  <text x="94" y="453" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#34465c" font-weight="600" text-anchor="start">16 predictors</text>
  <text x="255" y="453" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#9b3d78" font-weight="600" text-anchor="start">11.7% positive</text>
  <rect x="94" y="476" width="310" height="18" rx="9" fill="#e7edf4"/>
  <rect x="94" y="476" width="36.3" height="18" rx="9" fill="#d84a8b"/>
  <text x="94" y="510" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#5a6878" font-weight="400" text-anchor="start">Class imbalance is part of the calibration problem.</text>
  <text x="72" y="562" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#183153" font-weight="700" text-anchor="start">Study question</text>
  <text x="72" y="592" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#34465c" font-weight="400" text-anchor="start">How do sigmoid and isotonic calibration change</text><text x="72" y="618" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#34465c" font-weight="400" text-anchor="start">probability quality while preserving discrimination,</text><text x="72" y="644" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#34465c" font-weight="400" text-anchor="start">and are the effects stable across repeated splits?</text>
  <rect x="495" y="140" width="655" height="590" rx="22" fill="#ffffff" stroke="#c9d7e8" stroke-width="2"/>
  <text x="525" y="185" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#174f91" font-weight="700" text-anchor="start">2  Repeated-holdout evidence</text>
  <text x="525" y="216" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5a6878" font-weight="400" text-anchor="start">Mean across seeds 13, 29, 42, 73 and 101</text>
  <text x="525" y="262" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5a6878" font-weight="700" text-anchor="start">Model</text>
  <text x="735" y="262" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5a6878" font-weight="700" text-anchor="start">ROC-AUC ↑</text>
  <text x="865" y="262" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5a6878" font-weight="700" text-anchor="start">Brier ↓</text>
  <text x="975" y="262" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5a6878" font-weight="700" text-anchor="start">Log loss ↓</text>
  <text x="1090" y="262" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5a6878" font-weight="700" text-anchor="end">ECE-10 ↓</text>
  <line x1="525" y1="275" x2="1120" y2="275" stroke="#cbd7e5"/>
  <rect x="518" y="286" width="605" height="50" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="535" y="316" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#e55353" font-weight="700" text-anchor="start">Uncalibrated</text><text x="785" y="316" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#24364a" font-weight="600" text-anchor="end">0.9057</text><text x="900" y="316" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#24364a" font-weight="600" text-anchor="end">0.0720</text><text x="1018" y="316" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#24364a" font-weight="600" text-anchor="end">0.2445</text><text x="1105" y="316" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#24364a" font-weight="600" text-anchor="end">0.0311</text><rect x="518" y="350" width="605" height="50" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="535" y="380" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#f29f3f" font-weight="700" text-anchor="start">Sigmoid</text><text x="785" y="380" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#24364a" font-weight="600" text-anchor="end">0.9058</text><text x="900" y="380" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#24364a" font-weight="600" text-anchor="end">0.0720</text><text x="1018" y="380" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#24364a" font-weight="600" text-anchor="end">0.2443</text><text x="1105" y="380" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#24364a" font-weight="600" text-anchor="end">0.0318</text><rect x="518" y="414" width="605" height="50" rx="12" fill="#eaf8f2" stroke="#9ed8c6"/><text x="535" y="444" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#13a373" font-weight="700" text-anchor="start">Isotonic</text><text x="785" y="444" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#24364a" font-weight="600" text-anchor="end">0.9058</text><text x="900" y="444" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#24364a" font-weight="600" text-anchor="end">0.0693</text><text x="1018" y="444" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#24364a" font-weight="600" text-anchor="end">0.2269</text><text x="1105" y="444" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#24364a" font-weight="600" text-anchor="end">0.0074</text><text x="525" y="510" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#183153" font-weight="700" text-anchor="start">Probability-quality improvement</text>
    <text x="525" y="540" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#5a6878" font-weight="400" text-anchor="start">Lower is better · isotonic vs. uncalibrated</text>
    <text x="525" y="580" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#34465c" font-weight="600" text-anchor="start">Brier</text><rect x="610" y="565" width="190" height="18" rx="9" fill="#e8eef6"/><rect x="610" y="565" width="182.9" height="18" rx="9" fill="#13a373"/><text x="815" y="580" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#34465c" font-weight="600" text-anchor="start">0.0720 → 0.0693</text>
    <text x="525" y="623" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#34465c" font-weight="600" text-anchor="start">Log loss</text><rect x="610" y="608" width="190" height="18" rx="9" fill="#e8eef6"/><rect x="610" y="608" width="176.3" height="18" rx="9" fill="#13a373"/><text x="815" y="623" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#34465c" font-weight="600" text-anchor="start">0.2445 → 0.2269</text>
    <text x="525" y="666" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#34465c" font-weight="600" text-anchor="start">ECE-10</text><rect x="610" y="651" width="190" height="18" rx="9" fill="#e8eef6"/><rect x="610" y="651" width="45.2" height="18" rx="9" fill="#13a373"/><text x="815" y="666" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#34465c" font-weight="600" text-anchor="start">0.0311 → 0.0074</text>
    <text x="525" y="704" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#5a6878" font-weight="400" text-anchor="start">Ranking barely changes: ROC-AUC 0.9057 → 0.9058.</text>
    <rect x="1173" y="140" width="385" height="590" rx="22" fill="#ffffff" stroke="#c9d7e8" stroke-width="2"/>
    <text x="1203" y="185" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#174f91" font-weight="700" text-anchor="start">3  What makes it rigorous</text>
    <rect x="1203" y="218" width="325" height="92" rx="14" fill="#eef6ff" stroke="#b7d2f3" stroke-width="1.3"/>
    <text x="1222" y="248" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f5fbf" font-weight="700" text-anchor="start">Split discipline</text>
    <text x="1222" y="274" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="400" text-anchor="start">Primary 80/20 stratified split; calibrators</text><text x="1222" y="296" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="400" text-anchor="start">fit only inside training via cross-validation.</text>
    <rect x="1203" y="324" width="325" height="92" rx="14" fill="#f2efff" stroke="#c9bdf7" stroke-width="1.3"/>
    <text x="1222" y="354" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6a47c8" font-weight="700" text-anchor="start">Sensitivity checks</text>
    <text x="1222" y="380" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="400" text-anchor="start">Calibration CV: 3 / 5 / 10 folds</text><text x="1222" y="402" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="400" text-anchor="start">ECE bins: 5 / 10 / 20</text>
    <rect x="1203" y="430" width="325" height="102" rx="14" fill="#fff4e8" stroke="#f3c692" stroke-width="1.3"/>
    <text x="1222" y="460" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#c97819" font-weight="700" text-anchor="start">Operational ablation</text>
    <text x="1222" y="486" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="400" text-anchor="start">Re-run without call duration because it is</text><text x="1222" y="508" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="400" text-anchor="start">unavailable before the marketing call.</text>
    <rect x="1203" y="546" width="325" height="116" rx="14" fill="#eaf8f2" stroke="#a8dccc" stroke-width="1.3"/>
    <text x="1222" y="576" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#11825e" font-weight="700" text-anchor="start">Uncertainty + errors</text>
    <text x="1222" y="602" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="400" text-anchor="start">4,000 paired bootstrap resamples;</text><text x="1222" y="624" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#44576b" font-weight="400" text-anchor="start">confusion counts and ≥0.80-confidence errors.</text>
    <text x="1203" y="699" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#5a6878" font-weight="600" text-anchor="start">Boundary: methodology benchmark, not a banking deployment claim.</text>
    <rect x="42" y="755" width="1516" height="104" rx="18" fill="#0f2f57" stroke="#0f2f57" stroke-width="0"/>
    <text x="72" y="794" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#8ed8ff" font-weight="700" text-anchor="start">Main empirical result</text>
    <text x="72" y="829" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#ffffff" font-weight="700" text-anchor="start">Isotonic calibration improves probability quality substantially while discrimination remains essentially unchanged.</text>
    <text x="1528" y="829" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#c7d8ea" font-weight="400" text-anchor="end">Source: frozen repository outputs</text>
  </svg>