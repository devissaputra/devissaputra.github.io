<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
<title id="title">Probability Calibration on UCI Bank Marketing</title><desc id="desc">STUDY OVERVIEW</desc>
<rect width="1400" height="788" fill="#F7F9FB"/>

<style>
.title{font-family:Georgia,serif;font-weight:700;fill:#173A63;font-size:38px}
.subtitle{font-family:Arial,sans-serif;fill:#173A63;font-size:15px;letter-spacing:4px}
.h{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:18px}
.h2{font-family:Arial,sans-serif;font-weight:700;fill:#173A63;font-size:15px}
.txt{font-family:Arial,sans-serif;fill:#172533;font-size:14px}
.sm{font-family:Arial,sans-serif;fill:#5C6B78;font-size:12px}
.metric{font-family:Georgia,serif;font-weight:700;fill:#173A63;font-size:24px}
.card{fill:#FFFFFF;stroke:#C8D5E1;stroke-width:1.2}
.soft{fill:#EAF2F8;stroke:#D9E6F0;stroke-width:1}
.warn{fill:#FFF0EF;stroke:#E7C2BE;stroke-width:1}
.good{fill:#EAF6F1;stroke:#C2DED3;stroke-width:1}
.flow{stroke:#173A63;stroke-width:2;fill:none;marker-end:url(#arrow)}
.axis{stroke:#8094A7;stroke-width:1.2}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#173A63"/></marker></defs>
<text x="700" y="50" text-anchor="middle" class="title">Probability Calibration on UCI Bank Marketing</text>
<line x1="230" y1="78" x2="540" y2="78" stroke="#9DB5CB"/><line x1="860" y1="78" x2="1170" y2="78" stroke="#9DB5CB"/>
<text x="700" y="84" text-anchor="middle" class="subtitle">STUDY OVERVIEW</text>

<rect x="18" y="110" width="445" height="250" rx="10" class="card"/><circle cx="48" cy="140" r="19" fill="#173A63"/><text x="48" y="146" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">1</text><text x="82" y="146" class="h">QUESTION AND DATA</text>
<text x="45" y="190" class="h"><tspan x="45">Can predicted probabilities be trusted, not just</tspan><tspan x="45" dy="23">ranked correctly?</tspan></text>
<rect x="45" y="250" width="115" height="88" rx="8" class="soft"/><text x="103" y="282" class="metric" text-anchor="middle">45,211</text><text x="103" y="307" class="h2" text-anchor="middle">records</text>
<rect x="170" y="250" width="115" height="88" rx="8" class="soft"/><text x="228" y="282" class="metric" text-anchor="middle">16</text><text x="228" y="307" class="h2" text-anchor="middle">predictors</text>
<rect x="295" y="250" width="140" height="88" rx="8" class="soft"/><text x="365" y="282" class="metric" text-anchor="middle">11.7%</text><text x="365" y="307" class="h2" text-anchor="middle">positive class</text>

<rect x="480" y="110" width="900" height="250" rx="10" class="card"/><circle cx="510" cy="140" r="19" fill="#173A63"/><text x="510" y="146" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">2</text><text x="544" y="146" class="h">FIVE FIXED HOLDOUTS AND FOUR PROBABILITY MODELS</text>
<line x1="540" y1="225" x2="1260" y2="225" class="flow"/>
<circle cx="600" cy="225" r="9" fill="#B7C8D8"/><text x="600" y="202" class="sm" text-anchor="middle">class prior</text>
<circle cx="790" cy="225" r="9" fill="#6EA4D7"/><text x="790" y="202" class="sm" text-anchor="middle">logistic</text>
<circle cx="980" cy="225" r="9" fill="#2F6EAA"/><text x="980" y="202" class="sm" text-anchor="middle">sigmoid</text>
<circle cx="1170" cy="225" r="9" fill="#173A63"/><text x="1170" y="202" class="sm" text-anchor="middle">isotonic</text>
<text x="540" y="280" class="txt"><tspan x="540">Each split is stratified 80/20. Preprocessing is fitted on training data only, and</tspan><tspan x="540" dy="20">probability calibrators are learned by cross-validation inside the training partition.</tspan></text>

<rect x="18" y="385" width="850" height="360" rx="10" class="card"/><circle cx="48" cy="415" r="19" fill="#173A63"/><text x="48" y="421" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">3</text><text x="82" y="421" class="h">RECORDED PROBABILITY QUALITY</text>
<line x1="80" y1="655" x2="780" y2="655" class="axis"/>
<rect x="120" y="487" width="95" height="168" rx="3" fill="#B7C8D8"/><text x="168" y="479" class="sm" text-anchor="middle">0.1033</text><text x="168" y="675" class="sm" text-anchor="middle">Prior</text>
<rect x="280" y="538" width="95" height="117" rx="3" fill="#7EA7CF"/><text x="328" y="530" class="sm" text-anchor="middle">0.0720</text><text x="328" y="675" class="sm" text-anchor="middle">Uncalibrated</text>
<rect x="440" y="538" width="95" height="117" rx="3" fill="#5489BE"/><text x="488" y="530" class="sm" text-anchor="middle">0.0720</text><text x="488" y="675" class="sm" text-anchor="middle">Sigmoid</text>
<rect x="600" y="553" width="95" height="102" rx="3" fill="#173A63"/><text x="648" y="545" class="sm" text-anchor="middle">0.0693</text><text x="648" y="675" class="sm" text-anchor="middle">Isotonic</text>
<text x="80" y="710" class="h2">Mean Brier score across five splits; lower is better. Isotonic ECE-10 = 0.0074.</text>

<rect x="890" y="385" width="490" height="360" rx="10" class="card"/><circle cx="920" cy="415" r="19" fill="#173A63"/><text x="920" y="421" text-anchor="middle" fill="white" font-family="Arial" font-weight="700" font-size="17">4</text><text x="954" y="421" class="h">INTERPRETATION</text>
<rect x="920" y="470" width="420" height="72" rx="8" class="good"/><text x="942" y="495" class="h2">Probability quality improves</text><text x="942" y="520" class="txt">Isotonic lowers Brier and log loss.</text>
<rect x="920" y="555" width="420" height="72" rx="8" class="soft"/><text x="942" y="580" class="h2">Ranking is essentially unchanged</text><text x="942" y="605" class="txt">ROC-AUC remains near 0.906.</text>
<rect x="920" y="640" width="420" height="72" rx="8" class="warn"/><text x="942" y="665" class="h2">Operational caveat</text><text x="942" y="690" class="txt">Call duration is unavailable before the call.</text>

</svg>