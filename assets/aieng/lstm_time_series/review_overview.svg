<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc"><title id="title">LSTM Forecasting for Mauna Loa CO₂ — full benchmark story</title><desc id="desc">Engineering question, data, comparison, recorded result and interpretation limits.</desc><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia,serif;fill:#173A63}.s{font:600 14px Arial,sans-serif;fill:#60717D;letter-spacing:3px}.h{font:700 17px Arial,sans-serif;fill:#173A63}.b{font:14px Arial,sans-serif;fill:#263846}.sm{font:12px Arial,sans-serif;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#3F7B6D}.soft{fill:#EAF5F1;stroke:#3F7B6D;stroke-width:1.2}.w{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.m{font:700 25px Georgia,serif;fill:#3F7B6D}.ml{font:600 12px Arial,sans-serif;fill:#435563}</style>
<text x="700" y="48" text-anchor="middle" class="t">LSTM Forecasting for Mauna Loa CO₂</text><text x="700" y="80" text-anchor="middle" class="s">AI ENGINEERING · RECORDED BENCHMARK · FULL STORY</text>
<rect x="28" y="116" width="426" height="222" rx="11" class="c"/><circle cx="62" cy="150" r="18" class="a"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">ENGINEERING QUESTION</text><text x="55" y="198" class="b"><tspan x="55">Can a compact LSTM beat persistence and</tspan><tspan x="55" dy="22">linear autoregression for next-week CO₂</tspan><tspan x="55" dy="22">forecasting under a causal time protocol?</tspan></text>
<rect x="487" y="116" width="426" height="222" rx="11" class="c"/><circle cx="521" cy="150" r="18" class="a"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">DATA + PROTOCOL</text><text x="514" y="198" class="b"><tspan x="514">Mauna Loa weekly CO₂ · statsmodels</tspan><tspan x="514" dy="22">24-week lag windows</tspan><tspan x="514" dy="22">1,808 train · 452 chronological test</tspan><tspan x="514" dy="22">Past-only forward fill for missing weeks</tspan></text>
<rect x="946" y="116" width="426" height="222" rx="11" class="c"/><circle cx="980" cy="150" r="18" class="a"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">COMPARISON</text><text x="973" y="198" class="b"><tspan x="973">Persistence baseline</tspan><tspan x="973" dy="22">Ridge autoregression · α = 1</tspan><tspan x="973" dy="22">LSTM · 32 hidden units · 20 epochs</tspan><tspan x="973" dy="22">One-step rolling held-out evaluation</tspan></text>
<rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">RECORDED RESULT</text><text x="55" y="474" class="m">0.4639</text><text x="55" y="498" class="ml">ridge RMSE ppm</text><text x="260" y="474" class="m">0.5135</text><text x="260" y="498" class="ml">persistence RMSE</text><text x="465" y="474" class="m">1.0751</text><text x="465" y="498" class="ml">LSTM RMSE</text><text x="670" y="474" class="m">452</text><text x="670" y="498" class="ml">test windows</text><text x="55" y="548" class="b"><tspan x="55">Ridge has the lowest RMSE and MAE, while the LSTM performs substantially worse. The</tspan><tspan x="55" dy="22">corrected run therefore rejects the idea that recurrent complexity is automatically helpful</tspan><tspan x="55" dy="22">for this one-step forecasting setup.</tspan></text>
<rect x="946" y="372" width="426" height="268" rx="11" class="w"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="b"><tspan x="973">One seed and one test era limit generalization.</tspan><tspan x="973" dy="23">Later test inputs use earlier observed test values.</tspan><tspan x="973" dy="23">This is rolling one-step evaluation, not a</tspan><tspan x="973" dy="23">recursive forecast from one origin.</tspan></text>
<text x="28" y="728" class="sm">The corrected experiment removed future-dependent interpolation and reproduced the 20-epoch run successfully in GitHub Actions.</text></svg>