<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc"><title id="title">PCA and K-Means Clustering — full benchmark story</title><desc id="desc">Engineering question, data, comparison, recorded result and interpretation limits.</desc><rect width="1400" height="788" fill="#F8FAFC"/><style>.t{font:700 37px Georgia,serif;fill:#173A63}.s{font:600 14px Arial,sans-serif;fill:#60717D;letter-spacing:3px}.h{font:700 17px Arial,sans-serif;fill:#173A63}.b{font:14px Arial,sans-serif;fill:#263846}.sm{font:12px Arial,sans-serif;fill:#60717D}.c{fill:#fff;stroke:#CBD6E0;stroke-width:1.35}.a{fill:#5A6F9D}.soft{fill:#EEF1F8;stroke:#5A6F9D;stroke-width:1.2}.w{fill:#FFF8EE;stroke:#E4B16F;stroke-width:1.2}.m{font:700 25px Georgia,serif;fill:#5A6F9D}.ml{font:600 12px Arial,sans-serif;fill:#435563}</style>
<text x="700" y="48" text-anchor="middle" class="t">PCA and K-Means Clustering</text><text x="700" y="80" text-anchor="middle" class="s">AI ENGINEERING · RECORDED BENCHMARK · FULL STORY</text>
<rect x="28" y="116" width="426" height="222" rx="11" class="c"/><circle cx="62" cy="150" r="18" class="a"/><text x="62" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="94" y="156" class="h">ENGINEERING QUESTION</text><text x="55" y="198" class="b"><tspan x="55">Can 13 unlabeled chemical measurements</tspan><tspan x="55" dy="22">support a stable-looking cluster solution</tspan><tspan x="55" dy="22">without choosing k from the PCA picture?</tspan></text>
<rect x="487" y="116" width="426" height="222" rx="11" class="c"/><circle cx="521" cy="150" r="18" class="a"/><text x="521" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="553" y="156" class="h">DATA + PROTOCOL</text><text x="514" y="198" class="b"><tspan x="514">Wine Recognition dataset</tspan><tspan x="514" dy="22">178 observations · 13 numerical features</tspan><tspan x="514" dy="22">Known class labels withheld from fitting</tspan><tspan x="514" dy="22">Standardization before clustering</tspan></text>
<rect x="946" y="116" width="426" height="222" rx="11" class="c"/><circle cx="980" cy="150" r="18" class="a"/><text x="980" y="156" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="1012" y="156" class="h">COMPARISON</text><text x="973" y="198" class="b"><tspan x="973">Fit k-means for k = 2…6 in full 13D</tspan><tspan x="973" dy="22">Select k by full-space silhouette</tspan><tspan x="973" dy="22">Use 2D PCA only for visualization</tspan><tspan x="973" dy="22">Compare labels post hoc with ARI</tspan></text>
<rect x="28" y="372" width="885" height="268" rx="11" class="soft"/><text x="55" y="410" class="h">RECORDED RESULT</text><text x="55" y="474" class="m">k = 3</text><text x="55" y="498" class="ml">selected cluster count</text><text x="260" y="474" class="m">0.2849</text><text x="260" y="498" class="ml">13D silhouette</text><text x="465" y="474" class="m">0.5583</text><text x="465" y="498" class="ml">2D silhouette</text><text x="670" y="474" class="m">0.8975</text><text x="670" y="498" class="ml">post-hoc ARI</text><text x="55" y="548" class="b"><tspan x="55">The selected solution uses three clusters. The striking difference between full-space and</tspan><tspan x="55" dy="22">projected silhouette scores shows why a clean two-dimensional picture should not drive</tspan><tspan x="55" dy="22">model selection when the clustering problem lives in 13 dimensions.</tspan></text>
<rect x="946" y="372" width="426" height="268" rx="11" class="w"/><text x="973" y="410" class="h">INTERPRETATION BOUNDARY</text><text x="973" y="453" class="b"><tspan x="973">PCA is a visualization, not the selection space.</tspan><tspan x="973" dy="23">ARI uses known labels only after clustering.</tspan><tspan x="973" dy="23">K-means assumes Euclidean, roughly spherical</tspan><tspan x="973" dy="23">structure and does not prove natural classes.</tspan></text>
<text x="28" y="728" class="sm">The known wine classes are withheld until after k is selected, preserving an unsupervised model-selection step.</text></svg>