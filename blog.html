<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog | Devis Saputra</title>
<meta name="description" content="Articles and research notes by Devis Saputra on AI in Education, machine learning, learning systems, and research methods.">
<link rel="canonical" href="https://devissaputra.github.io/blog.html">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/typography.css?v=20261113-unified-plex-v12">
<style>
:root{--paper:#EEF0EF;--ink:#1B2430;--muted:#5B6660;--line:#C9CDC5;--accent:#1E3A8A}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "IBM Plex Sans",Arial,sans-serif}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrapper{max-width:980px;margin:auto;padding:48px 28px 90px}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:23px}
.brand{font-weight:700;font-size:1.1rem;color:var(--ink);text-decoration:none}
.back{text-decoration:none;font-size:.93rem}
h1{font:600 clamp(2rem,4vw,2.8rem)/1.18 Georgia,serif;margin:46px 0 12px}
.intro{max-width:65ch;color:var(--muted);margin-bottom:29px}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.tools input,.tools select{border:1px solid var(--line);border-radius:4px;background:#fff;padding:12px;font:inherit;color:var(--ink)}
.tools input{flex:1 1 270px}
.tools select{flex:0 1 210px}
.card{border-top:1px solid var(--line);padding:25px 0}
.card:last-child{border-bottom:1px solid var(--line)}
.meta{font-size:.82rem;color:var(--muted);letter-spacing:.01em;margin-bottom:8px}
.card h2{font:600 1.4rem/1.35 Georgia,serif;margin:0 0 9px}
.card h2 a{text-decoration:none;color:var(--ink)}
.card h2 a:hover{text-decoration:underline;text-underline-offset:4px;color:var(--accent)}
.card p{max-width:67ch;margin:0 0 12px}
.card .read{font-size:.93rem}
.empty{border-top:1px solid var(--line);padding:35px 0;color:var(--muted)}
footer{margin-top:64px;font-size:.85rem;color:var(--muted)}
@media(max-width:600px){.wrapper{padding:28px 20px 60px}.tools select{flex:1 1 100%}}
</style>
</head>
<body>
<div class="wrapper">
<header class="top"><a class="brand" href="index.html">Devis Saputra</a><a class="back" href="index.html">← Back to portfolio</a></header>
<main>
<h1>Blog</h1>
<p class="intro">Research notes, technical articles, and reflections on AI in Education, machine learning, and learning systems. Articles will be listed here as they are published.</p>
<div class="tools" role="search">
<label for="search" style="position:absolute;left:-10000px">Search articles</label>
<input id="search" type="search" placeholder="Search articles by title or topic" autocomplete="off">
<label for="category" style="position:absolute;left:-10000px">Filter category</label>
<select id="category"><option value="">All topics</option></select>
</div>
<div id="status" role="status" aria-live="polite"></div>
<div id="articles"></div>
</main>
<footer>© <span id="year"></span> Devis Saputra. Articles reflect the author's own views.</footer>
</div>
<script>
"use strict";
document.getElementById("year").textContent=new Date().getFullYear();
const list=document.getElementById("articles"),status=document.getElementById("status"),search=document.getElementById("search"),category=document.getElementById("category");
let posts=[];
function elt(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function render(){
  list.replaceChildren();status.textContent="";
  const q=search.value.trim().toLowerCase(),c=category.value;
  const filtered=posts.filter(p=>(!c||p.category===c)&&(!q||[p.title,p.excerpt,p.category].join(" ").toLowerCase().includes(q)));
  if(!filtered.length){list.append(elt("p","empty",posts.length?"No articles match your search.":"No articles published yet. The first article will appear here when published."));return}
  status.textContent=filtered.length+" article"+(filtered.length===1?"":"s");
  filtered.forEach(p=>{
    const card=elt("article","card"),meta=elt("div","meta",(p.date||"")+" · "+(p.category||"Research notes")),h=elt("h2"),a=elt("a",null,p.title);
    a.href=p.url;h.append(a);card.append(meta,h,elt("p",null,p.excerpt||""));
    const link=elt("a","read","Read article →");link.href=p.url;card.append(link);list.append(card);
  });
}
fetch("blog/posts.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw Error("Could not load articles");return r.json()}).then(data=>{
 posts=(Array.isArray(data)?data:[]).filter(p=>p&&typeof p.title==="string"&&typeof p.url==="string"&&/^blog\/posts\/[a-z0-9-]+\.html$/.test(p.url)&&p.published===true).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 [...new Set(posts.map(p=>p.category).filter(Boolean))].sort().forEach(c=>{const o=elt("option",null,c);o.value=c;category.append(o)});
 render();
}).catch(()=>{list.append(elt("p","empty","Articles could not be loaded. Please try again later."))});
search.addEventListener("input",render);category.addEventListener("change",render);
</script>
</body>
</html>
